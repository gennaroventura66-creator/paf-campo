<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3d1e">
<title>DL Foresta</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>window.PAF_PWA=true</script>
<style>:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#241b14; --muted:#6b5e52; --line:#ddd5cb;
  --acc:#5b3d1e; --acc-ink:#ffffff; --acc-soft:#efe4d6; --warn:#a15c00; --warn-soft:#fff1dc;
  --bad:#b3261e; --dead:#6d5a4b; --mat:#1f5f8b; --pol:#7a4d9c;
  --r:12px; --tap:56px;
  font-size:16px;
}
:root[data-theme="dark"]{
  --bg:#140f0b; --card:#201812; --ink:#f3ede6; --muted:#b1a497; --line:#3a2e24;
  --acc:#d9a36a; --acc-ink:#1a110a; --acc-soft:#33261a; --warn:#f0b35a; --warn-soft:#2e2413;
  --bad:#ff8a80; --dead:#c8ad96; --mat:#7cc0f0; --pol:#c9a4ea;
}
:root[data-theme="sun"]{ /* alto contrasto per pieno sole */
  --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#222; --line:#000;
  --acc:#003d00; --acc-ink:#ffffff; --acc-soft:#dcffd6; --warn:#6b3a00; --warn-soft:#ffe8b0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--acc);color:var(--acc-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top .t{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:.78rem;opacity:.85;display:block;font-weight:500}
header.top button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-size:.85rem}
main{padding:12px 14px;max-width:900px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;color:var(--muted);padding:8px 0 10px;font-size:.58rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav.bottom button .i{font-size:1.35rem;line-height:1}
nav.bottom button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:1.15rem;margin:4px 0 12px}
h3{font-size:1rem;margin:14px 0 8px}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:0 16px;min-height:48px;font:inherit;font-weight:600}
.btn.sec{background:transparent;color:var(--acc)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem}
.btn.block{width:100%}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
.list .it.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.list .it .b{flex:1;min-width:0}
.list .it .b b{display:block}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-size:.9rem;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"▾";color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 14px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.78rem}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;max-width:90vw}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:10px}

/* ---- Cavallettamento ---- */
.tally-head{position:sticky;top:52px;z-index:15;background:var(--bg);padding:8px 0 6px}
.stati{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stati button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:.85rem}
.stati button.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.stati.d2{grid-template-columns:1fr 1fr}
.stati.d3{grid-template-columns:repeat(3,1fr)}
.stati button.on[data-s=V]{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.stati button.on[data-s=S]{border-color:var(--dead);background:var(--dead);color:#fff}
.stati button.on[data-s=M]{border-color:var(--mat);background:var(--mat);color:#fff}
.stati button.on[data-s=P]{border-color:var(--pol);background:var(--pol);color:#fff}
.spbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.spbar button{flex:0 0 auto;min-width:64px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;padding:4px 8px;line-height:1.05}
.spbar button small{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.spbar button.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.spbar button.on small{color:var(--acc-ink)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dgrid button{position:relative;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.45rem;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dgrid button .n{position:absolute;right:6px;top:4px;font-size:.8rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:99px;padding:1px 7px}
.dgrid button .n:empty{display:none}
.dgrid button.flash{background:var(--acc);color:var(--acc-ink)}
.dgrid button.flashm{background:var(--bad);color:#fff}
.tally-sum{font-size:.85rem}
.dict{display:flex;gap:6px;margin:8px 0}
.dict input{font-size:1.2rem;font-weight:700;text-transform:uppercase}
.bigN{font-size:1.6rem;font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .bar{fill:var(--acc)}
.chart .pt{fill:var(--acc);opacity:.65}
.chart .ln{stroke:var(--warn);stroke-width:2;fill:none}
.chart .ax{stroke:var(--line)}

/* ---- Stampa ---- */
#print{display:none}
@media print{
  body{padding:0;background:#fff;color:#000}
  body.printing header.top, body.printing nav.bottom, body.printing main{display:none!important}
  body.printing #print{display:block}
  #print{font-family:Georgia,"Times New Roman",serif;font-size:10.5pt;color:#000}
  #print .pp{page-break-after:always}
  #print h1{font-size:15pt;margin:0 0 4pt}
  #print h2{font-size:12pt;margin:10pt 0 4pt;border-bottom:1px solid #000}
  #print table{font-size:9pt}
  #print th,#print td{border-bottom:1px solid #999;color:#000}
  #print .kv{display:grid;grid-template-columns:1fr 1fr;gap:1pt 14pt}
  #print .kv div{border-bottom:1px dotted #bbb;padding:1pt 0}
  #print .kv b{font-weight:600}
}
@media (min-width:700px){ .dgrid{grid-template-columns:repeat(6,1fr)} }

/* ---- Mappa ---- */
.maptools{position:absolute;top:8px;left:8px;right:8px;z-index:500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.mbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 8px #0002}
.mbar .btn.sm{min-height:40px;padding:0 10px}
.mtb{flex-wrap:nowrap}.mtb .btn.sm{flex:1;padding:0 4px;font-size:.8rem;min-width:0;white-space:nowrap}
.mappanel{position:absolute;left:8px;right:8px;bottom:12px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px #0003}
.navarrow{font-size:2.6rem;line-height:1;color:var(--acc);width:52px;text-align:center;transition:transform .3s;transform-origin:50% 50%}
.plabel{background:#ffffffd9;border:1px solid #1b2419;border-radius:6px;padding:1px 6px;font-weight:800;font-size:13px;color:#1b2419;white-space:nowrap;transform:translate(-50%,-50%)}
.leaflet-tooltip.adslabel{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:800;font-size:10px;padding:0}
.leaflet-tooltip.adslabel::before{display:none}
.leaflet-popup-content{font-size:14px;line-height:1.45}
.leaflet-popup-content .btn{margin-top:6px}
.leaflet-container{font:inherit}
[hidden]{display:none!important}
.oh{font-size:.78rem;margin:-8px 0 10px;white-space:pre-wrap}
/* DL Foresta */
.stati.d3,.tally-head .stati{grid-template-columns:repeat(3,1fr)}
.stati button.on.dT{border-color:var(--bad);background:var(--bad);color:#fff}
.stati button.on.dM{border-color:var(--mat);background:var(--mat);color:#fff}
.stati button.on.dR{border-color:var(--warn);background:var(--warn);color:#fff}
.kpv{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:1rem;min-width:88px;text-align:center;cursor:pointer}
.kpv b{font-size:1.5rem}
.kpv.on{border-color:var(--acc);background:var(--acc-soft)}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kpad button{min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.6rem;font-weight:700}
.kpad button:active{background:var(--acc-soft)}
.btn.big{min-height:62px;font-size:1.15rem}
table.pl tr{cursor:pointer}
.clsgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.clsgrid button{position:relative;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:700}
.clsgrid button b{position:absolute;top:2px;right:5px;font-size:.72rem;color:var(--acc)}
.clsgrid button.has{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.clsgrid button.minus{border-style:dashed;color:#c0392b}
@media(max-width:360px){.clsgrid{grid-template-columns:repeat(4,1fr)}}

.dmark{background:none;border:0}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:6px 0}
.chk input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--acc,#5b3d1e)}
</style>
</head>
<body>
<header class="top">
  <div class="t" id="hdr">DL Foresta<span class="sub" id="hdrsub">Direzione dei lavori forestali</span></div>
  <span id="sync" class="pill" hidden style="background:#fff3;color:inherit;margin-right:6px;cursor:pointer" onclick="go('altro')"></span><span id="net" class="pill" style="background:#fff3;color:inherit"></span>
</header>
<main id="view"></main>
<nav class="bottom" id="nav">
  <button data-v="cantieri"><span class="i">▦</span>Cantieri</button>
  <button data-v="mappa"><span class="i">⌖</span>Mappa</button>
  <button data-v="verifica"><span class="i">✓</span>Verifica</button>
  <button data-v="elenco"><span class="i">☰</span>Piedilista</button>
  <button data-v="saggi"><span class="i">◯</span>Saggi</button>
  <button data-v="riepilogo"><span class="i">Σ</span>Riepilogo</button>
  <button data-v="altro"><span class="i">⋯</span>Altro</button>
</nav>
<div id="print"></div>

      const r = indexedDB.open('dl-foresta', 2);
      r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: 'id'}); }); };
      r.onsuccess = () => { this.db = r.result; res(); };

  req(store, mode, fn) {

  get(s, id) { return this.req(s, 'readonly', o => o.get(id)); },

/* ---------------- Calcoli del cantiere ---------------- */
function supLotto(l) {
  if (num(l.sup)) return num(l.sup);
  const a = areeOf(l.id).filter(x => x.geom && x.tipo !== 'Area esclusa');
  const ex = areeOf(l.id).filter(x => x.geom && x.tipo === 'Area esclusa');
  const s = a.reduce((t, x) => t + GEO.areaHa(x.geom), 0) - ex.reduce((t, x) => t + GEO.areaHa(x.geom), 0);
  return s > 0 ? Math.round(s * 10000) / 10000 : '';
}
/* statistiche del piedilista: per specie, per classe, per esito della verifica */
function stats(l, filt) {
  const cur = curves(l.id); const amp = num(l.amp) || 5;
  const rows = pianteOf(l.id).filter(x => !filt || filt(x)).map(x => ({x, c: treeCalc(l, x, cur)}));
  const agg = (list) => { const o = {n: 0, g: 0, v: 0, q: 0, miss: 0, vmiss: 0, dc: 0, ndc: 0}; list.forEach(({x, c}) => { o.n++; o.g += c.g; if (c.v == null) o.vmiss++; else o.v += c.v; if (c.q != null) o.q += c.q; if (c.h == null) o.miss++; if (num(x.dc)) { o.dc += num(x.dc); o.ndc++; } }); return o; };
  const by = (list, key) => { const m = {}; list.forEach(r => { const k = key(r); (m[k] = m[k] || []).push(r); }); const out = {}; for (const k in m) out[k] = agg(m[k]); return out; };
  return {rows, cur, amp, tot: agg(rows), bySp: by(rows, r => r.x.sp), byC: by(rows, r => classOf(r.c.d || num(r.x.dc) || 0, amp)), bySpC: by(rows, r => r.x.sp + '|' + classOf(r.c.d || num(r.x.dc) || 0, amp)),
    byVer: by(rows, r => r.x.ver || ''), bySpVer: by(rows, r => r.x.sp + '|' + (r.x.ver || '')), byArea: by(rows, r => r.x.areaId || '')};
}
function prevalente(l) {
  const c = {}; pianteOf(l.id).forEach(x => c[x.sp] = (c[x.sp] || 0) + gOf(num(x.d) || num(x.dc) || 0));
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || '';
}
/* quadro della verifica: conteggi che servono a viste, controlli e report */
function verifica(l) {
  const ps = pianteOf(l.id); const sup = supLotto(l); const N = regN(l);
  const mart = ps.filter(x => x.dest === 'T'), ril = ps.filter(x => x.dest === 'M' || x.dest === 'R'), extra = ps.filter(x => x.dest === 'X');
  const cnt = (list, v) => list.filter(x => (x.ver || '') === v).length;
  const dcK = (l.dck && {min: num(l.dck.min) || DC_K.min, max: num(l.dck.max) || DC_K.max}) || DC_K;
  const anom = mart.filter(x => x.ver === 'T' && num(x.dc) && num(x.d) && (num(x.dc) < num(x.d) * dcK.min || num(x.dc) > num(x.d) * dcK.max));
  const hmax = num(l.hcepp) || num(N.hCepp) || 10;
  const alte = ps.filter(x => x.ver === 'T' && num(x.hc) && num(x.hc) > hmax);
  const qual = {}; ps.filter(x => x.ver === 'T').forEach(x => { const q = x.qual || ''; qual[q] = (qual[q] || 0) + 1; });
  const dn = danniOf(l.id); const dP = dn.filter(d => DANNO_PIANTA.includes(d.tipo)), dS = dn.filter(d => !DANNO_PIANTA.includes(d.tipo));
  const ev = dP.filter(d => d.evit === 1).length;
  const byT = {}; dP.forEach(d => { const o = byT[d.tipo] = byT[d.tipo] || {n: 0, ev: 0, pct: 0}; o.n++; if (d.evit === 1) o.ev++; o.pct += num(d.pct) || 0; });
  const byG = {}; dP.forEach(d => { const g = gravOf(d.pct); byG[g] = (byG[g] || 0) + 1; });
  const supS = dS.reduce((s, d) => s + (num(d.sup) || 0), 0);
  const verified = ril.filter(x => x.ver === 'P' || x.ver === 'N').length;
  const Mp = ps.filter(x => x.dest === 'M' && x.ver !== 'N' && x.ver !== 'T');
  return {ps, mart, ril, extra, sup, hmax, dcK, anom, alte, qual, dn, dP, dS, ev, byT, byG, supS, verified,
    nT: cnt(mart, 'T'), nP: cnt(mart, 'P'), nN: cnt(mart, 'N'), nD: cnt(mart, ''), rT: cnt(ril, 'T'), rP: cnt(ril, 'P'), rN: cnt(ril, 'N'), rD: cnt(ril, ''),
    matrHa: sup ? Mp.length / sup : '', matrPresc: num(l.matr_presc) || '', pctDone: mart.length ? (mart.length - cnt(mart, '')) / mart.length * 100 : 0};
}
/* verifiche di conformità */
function checks(l) {
  const V = verifica(l); const out = []; const ced = isCeduo(l); const N = regN(l);
  if (!V.mart.length && !V.extra.length) { out.push({ok: null, t: 'Nessun piedilista: importa il piedilista di martellata (Altro → Importa) o registra le piante tagliate.'}); }
  else {
    out.push({ok: V.nD ? null : true, t: `Piante martellate: ${V.mart.length} · verificate ${V.mart.length - V.nD} (${fmt(V.pctDone, 0)}%) · tagliate ${V.nT} · ancora in piedi ${V.nP} · non trovate ${V.nN}`});
    if (V.nN) out.push({ok: false, t: `${V.nN} piante martellate non ritrovate sul terreno: da chiarire con l'impresa (ceppaia coperta, numero illeggibile, pianta non abbattuta?)`});
    if (V.extra.length) out.push({ok: false, t: `${V.extra.length} piante tagliate senza contrassegno${V.sup ? ` (${fmt(V.extra.length / V.sup, 1)}/ha)` : ''}${V.mart.length ? ` · ${fmt(V.extra.length / V.mart.length * 100, 1)}% delle martellate` : ''}`});
    else if (V.nT) out.push({ok: true, t: 'Nessun taglio di piante non contrassegnate rilevato'});
    if (V.anom.length) out.push({ok: false, t: `${V.anom.length} ceppaie con diametro incoerente con il diametro di martellata (fuori dal rapporto ${fmt(V.dcK.min, 2)}–${fmt(V.dcK.max, 2)}): n. ${V.anom.slice(0, 15).map(x => x.n).join(', ')}${V.anom.length > 15 ? '…' : ''}`});
    else if (V.nT) out.push({ok: true, t: 'Diametri delle ceppaie coerenti con i diametri di martellata'});
  }
  if (ced) {
    if (V.alte.length) out.push({ok: false, t: `${V.alte.length} ceppaie più alte di ${fmt(V.hmax, 0)} cm (altezza massima${num(l.hcepp) ? ' impostata nel cantiere' : ' da norma'})`});
    const nq = Object.entries(V.qual).filter(([q]) => q && q !== 'B').reduce((s, [, n]) => s + n, 0); const nqt = Object.values(V.qual).reduce((s, n) => s + n, 0);
    if (nqt) out.push({ok: nq / nqt <= 0.1, t: `Ceppaie non regolari (alte, slabbrate, danneggiate): ${nq} su ${nqt} (${fmt(nq / nqt * 100, 0)}%)`});
    const presc = V.matrPresc || (/composto/i.test(l.governo || '') ? num(N.composto) : (SP[l.sp_prev || prevalente(l)] || {}).grp === 'castagno' ? num(N.matrCastagno) : num(N.matr));
    const st = typeof adsStats === 'function' ? adsStats(l) : null; const mha = st && st.nA ? (st.ha.M || {}).n || 0 : '';
    const mc = typeof matrCens === 'function' ? matrCens(l) : null;
    if (mc && mc.n) { out.push({ok: mc.dens !== '' ? (presc ? mc.dens >= presc : null) : null, t: `Matricine rilasciate (censimento integrale${mc.src.length ? ' da ' + mc.src.join(', ') : ''}): ${mc.n}${mc.dens !== '' ? ` · ${fmt(mc.dens, 0)}/ha` : ''}${presc ? ` · prescritte ${fmt(presc, 0)}/ha` : ''}`}); const low = mc.per.filter(o => o.ok === false); if (low.length) out.push({ok: false, t: `Aree sotto le matricine prescritte: ${low.map(o => `${o.a.nome} (${fmt(o.dens, 0)}/ha)`).join(', ')}`}); }
    if (mha !== '') out.push({ok: presc ? mha >= presc : null, t: `Matricine rilasciate: ${fmt(mha, 0)}/ha dalle ${st.nA} aree di saggio${presc ? ` · prescritte ${fmt(presc, 0)}/ha` : ''}`});
    else if (V.matrHa !== '' && V.ps.some(x => x.dest === 'M')) out.push({ok: presc ? V.matrHa >= presc : null, t: `Matricine del piedilista ancora in piedi: ${fmt(V.matrHa, 0)}/ha${presc ? ` · prescritte ${fmt(presc, 0)}/ha` : ''} (per il controllo sul terreno rileva le aree di saggio)`});
    else out.push({ok: null, t: `Matricine rilasciate: rileva le aree di saggio (sezione Saggi)${presc ? ` · prescritte ${fmt(presc, 0)}/ha` : ''}`});
    if (V.rT) out.push({ok: false, t: `${V.rT} matricine contrassegnate risultano tagliate`});
  } else {
    if (V.rT) out.push({ok: false, t: `${V.rT} piante da rilasciare (riserve) risultano tagliate`});
  }
  if (V.dP.length) {
    const soglia = num(N.dannoMax);

    const grav = V.dP.filter(d => (num(d.pct) || 0) > 30).length; if (grav) out.push({ok: false, t: `${grav} danni gravi (oltre il 30%)`});
  } else if (V.nT) out.push({ok: true, t: 'Nessun danno alle piante rilasciate registrato'});
  if (V.dS.length) out.push({ok: null, t: `Danni al suolo e alla rinnovazione: ${V.dS.length} rilievi${V.supS ? `, ${fmt(V.supS, 0)} m² complessivi${V.sup ? ` (${fmt(V.supS / (V.sup * 1e4) * 100, 2)}% della superficie)` : ''}` : ''}`});

}

const objOf = (s, id) => S[s].find(x => x.id === id);
const A = {
  setF(el) {
    const o = objOf(el.dataset.s, el.dataset.id); if (!o) return;
    const k = el.dataset.k; o[k] = el.dataset.t === 'n' ? (el.value.trim() === '' ? '' : el.value.replace(',', '.')) : el.value;
    saveLater(el.dataset.s, o); if (el.dataset.s === 'lotti' && k === 'nome') hdr();
  },
  async newLot(sez = 'fustaia', extra = {}) {
    const ced = sez === 'ceduo';
    const l = Object.assign({id: uid(), sez, nome: ced ? 'Nuovo cantiere ceduo' : 'Nuovo cantiere alto fusto', regione: LS.get('dl-reg', 'Calabria'), governo: ced ? 'Ceduo matricinato' : 'Fustaia', intervento: ced ? 'Taglio di fine turno del ceduo' : 'Diradamento', amp: ced ? 2 : 5, dl: LS.get('dl-tec', ''), data_inizio: new Date().toISOString().slice(0, 10), t: Date.now()}, extra);
    await save('lotti', l); sel.lot = l.id; sel.area = ''; sel.ads = ''; sel.pl = ''; persistSel(); go('cantieri');
    setTimeout(() => { const i = document.querySelector('input[data-k=nome]'); if (i) { i.focus(); i.select(); } }, 50);
    return l;
  },
  async setSez(z) { const l = lot(); l.sez = z; if (!GOVERNI_SEZ[z].includes(l.governo)) l.governo = GOVERNI_SEZ[z][0 + (z === 'ceduo')]; if (!INTERVENTI_SEZ[z].includes(l.intervento)) l.intervento = INTERVENTI_SEZ[z][0]; await save('lotti', l); go('cantieri'); },
  selLot(id) { sel.lot = id; sel.area = ''; sel.ads = ''; sel.pl = ''; persistSel(); go('cantieri'); },
  async delLot() {
    const l = lot(); if (!confirm(`Eliminare il cantiere "${l.nome}" con piante, danni, foto e aree di saggio?`)) return;
    for (const s of ['adsril', 'ads', 'danni', 'piante', 'altezze', 'aree']) for (const x of S[s].filter(q => q.lottoId === l.id)) await remove(s, x.id);
    for (const f of await DB.all('foto')) if (f.lottoId === l.id) await DB.del('foto', f.id);
    await remove('lotti', l.id); sel.lot = null; persistSel(); go('cantieri');
  },
  async dck(k, v) { const l = lot(); if (!l) return; l.dck = l.dck || {}; l.dck[k] = v.replace(',', '.').trim(); await save('lotti', l); toast('Salvato', 700); },
  async newArea() { const l = lot(); const a = {id: uid(), lottoId: l.id, nome: 'Area ' + (areeOf(l.id).length + 1), tipo: 'Sezione di taglio', t: Date.now()}; await save('aree', a); A.editArea(a.id); },
  editArea(id) {
    const a = S.aree.find(x => x.id === id);
    $('#view').innerHTML = `<div class="card"><h2>Area</h2>${fld('aree', a, 'nome', 'Nome')}${selF('aree', a, 'tipo', 'Tipo', ['Confine del lotto', 'Sezione di taglio', 'Particella forestale', 'Area esclusa', 'Pista / imposto'])}${fld('aree', a, 'note', 'Note', 'a')}
      <p class="muted">${a.geom ? `Superficie cartografica ${fmt(GEO.areaHa(a.geom), 4)} ha.` : 'Nessun confine: disegnalo in QGIS o in Mappa (✎ Disegna / 👣 Traccia).'}</p>
      <div class="row"><button class="btn sm" onclick="go('cantieri')">Fatto</button><button class="btn sm sec" onclick="sel.area='${a.id}';go('mappa')">Mappa</button><button class="btn sm warn" onclick="A.delArea('${a.id}')">Elimina</button></div></div>`;
  },
  async delArea(id) { if (!confirm('Eliminare l\'area? Le piante restano nel cantiere.')) return; await remove('aree', id); if (sel.area === id) sel.area = ''; go('cantieri'); },
  setArea(id) { const a = S.aree.find(x => x.id === id); if (a && !incOk('area', a)) return; sel.area = id; persistSel(); go('verifica'); },
  async spSet(i, k, v) { S.specie[i][k] = ['hm', 'peso', 'f'].includes(k) ? v.replace(',', '.').trim() : k === 'infc' ? +v : v; await DB.put('config', {id: 'specie', list: S.specie}); refreshSP(); toast('Salvato', 700); },
  async spAdd() {
    const c = $('#nsc').value.trim().toUpperCase(), n = $('#nsn').value.trim(), t = $('#nst').value; if (!c || !n) return toast('Codice e nome');
    if (SP[c]) return toast('Codice già esistente'); if (!/^[A-Z]{1,3}$/.test(c)) return toast('Codice: da 1 a 3 lettere');
    S.specie.push({id: c, nome: n, tipo: t, infc: t === 'C' ? 131 : 399, grp: t === 'C' ? 'conifere' : 'altre', ass: true, f: t === 'C' ? 0.47 : 0.5, peso: '', hm: ''}); await DB.put('config', {id: 'specie', list: S.specie}); refreshSP(); go('altro');
  },
  async normSet(reg, k, v) {
    S.cfg.norme = S.cfg.norme || {}; const o = S.cfg.norme[reg] = S.cfg.norme[reg] || {};
    const val = /^(periodo)$/.test(k) ? v : (v.trim() === '' ? '' : +v.replace(',', '.'));
    if (k.startsWith('turni.')) { o.turni = Object.assign({}, (NORME[reg] || {}).turni || {}, o.turni || {}); o.turni[k.slice(6)] = val; } else o[k] = val;
    await DB.put('config', Object.assign({id: 'cfg'}, S.cfg)); toast('Salvato', 700);
  },
  theme(k) { LS.set('dl-theme', k); applyTheme(k); go('altro'); },
  async backup(share) {
    const data = {app: APP_NAME, ver: APP_VER, data: new Date().toISOString(), specie: S.specie, cfg: S.cfg};
    for (const s of DATA_STORES) data[s] = await DB.all(s);
    data.foto = await DB.all('foto');
    const ok = await out(`DLForesta_backup_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`, JSON.stringify(data), 'application/json', share);
    if (ok) { LS.set('dl-lastbackup', Date.now()); go('altro'); }
  },
  restore(inp) {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result); if (d.app !== APP_NAME) throw new Error('file non valido');
        if (!confirm(`Importare il backup del ${new Date(d.data).toLocaleString('it-IT')}?`)) return;
        for (const s of DATA_STORES.concat(['foto'])) for (const x of d[s] || []) await DB.put(s, x);
        if (d.specie) await DB.put('config', {id: 'specie', list: d.specie}); if (d.cfg) await DB.put('config', Object.assign({}, d.cfg, {id: 'cfg'}));
        await loadAll(); toast('Backup importato'); go('cantieri');
      } catch (e) { toast('Errore: ' + e.message, 3500); }
    };
    rd.readAsText(f);
  },
  /* importa il piedilista di martellata (martellata.gpkg o Piedilista.csv di Martellata Campo) */
  martIn(inp) {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = async () => {
      try {
        toast('Importo il piedilista…', 2000);
        const r = /\.csv$|\.txt$/i.test(f.name) ? await importMartCsv(rd.result) : /\.pdf$/i.test(f.name) || f.type === 'application/pdf' ? await importMartPdf(new Uint8Array(rd.result)) : await importMart(new Uint8Array(rd.result));
        sel.lot = r.lot.id; sel.pl = ''; sel.vf = 'da'; persistSel();
        toast(`Cantiere "${r.lot.nome}": ${r.rep.piante} piante del piedilista, ${r.rep.aree} aree`, 4500); go('cantieri');
      } catch (e) { console.error(e); toast('Errore: ' + e.message, 5000); }
    };
    if (/\.csv$|\.txt$/i.test(f.name)) rd.readAsText(f); else rd.readAsArrayBuffer(f);
  }
};

async function out(name, content, mime, share) {
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime});
  if (typeof PT !== 'undefined' && !PT.noArch) setTimeout(() => PT.archivia(name, blob), 300);
  if (typeof NATIVE !== 'undefined' && NATIVE) {
    try {
      const data = u8ToB64(new Uint8Array(await blob.arrayBuffer())); let uri = null, where = '';
      try { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: 'DL Foresta/' + name, data, directory: 'DOCUMENTS', recursive: true})).uri; where = 'Documenti/DL Foresta'; }
      catch (e) { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: name, data, directory: 'CACHE', recursive: true})).uri; }
      if (where) toast(`Salvato in ${where}/${name}`, 3500);

/* ============================================================
   DL Foresta — altezze e cubatura (volume delle piante tagliate)
   Altezza: misurata → curva ipsometrica della specie (≥ 3 misure) → curva del gruppo
   (conifere/latifoglie) → altezza media indicata per la specie.
   Volume: tavola del PAF assegnata alla specie (una entrata, doppia entrata o
   coefficienti) → equazione INFC 2005 della specie → G·h·f.
   ============================================================ */
const gOf = d => Math.PI * d * d / 40000; // m²
function fitCurve(pts) { // h = a + b·ln(d)
  const P = pts.filter(p => p.d > 0 && p.h > 0); const n = P.length; if (n < 3) return null;
  const xs = P.map(p => Math.log(p.d)), ys = P.map(p => p.h);
  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); syy += (ys[i] - my) ** 2; }
  if (sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx;
  return {a, b, r2: syy ? (sxy * sxy) / (sxx * syy) : 1, n};
}
/* misure di altezza del lotto: piante contrassegnate con h misurata + alberi campione */
function hSample(lotId) {
  const out = [];
  S.piante.filter(x => x.lottoId === lotId && num(x.h) && num(x.d)).forEach(x => out.push({sp: x.sp, d: num(x.d), h: num(x.h)}));
  S.altezze.filter(x => x.lottoId === lotId && num(x.h) && num(x.d)).forEach(x => out.push({sp: x.sp, d: num(x.d), h: num(x.h)}));
  return out;
}
function curves(lotId) {
  const g = {}; const add = (k, p) => (g[k] = g[k] || []).push(p);
  hSample(lotId).forEach(p => { add(p.sp, p); add('*' + ((SP[p.sp] || {}).tipo || 'L'), p); add('*', p); });
  const out = {}; for (const k in g) { const c = fitCurve(g[k]); if (c) out[k] = c; }
  return out;
}
/* altezza stimata e sua provenienza */
function hEst(lot, sp, d, cur) {
  const c = cur[sp];
  if (c) return {h: Math.max(1.3, c.a + c.b * Math.log(d)), src: 'curva ipsometrica della specie'};
  const hm = num((lot.hm || {})[sp]) || num((SP[sp] || {}).hm);
  if (hm) return {h: hm, src: 'altezza media indicata per la specie'};
  const cg = cur['*' + ((SP[sp] || {}).tipo || 'L')] || cur['*'];
  if (cg) return {h: Math.max(1.3, cg.a + cg.b * Math.log(d)), src: 'curva ipsometrica ' + (((SP[sp] || {}).tipo === 'C') ? 'delle conifere' : 'delle latifoglie')};
  return {h: null, src: 'altezza mancante'};
}

/* ---------- tavole di cubatura (anche dei PAF) ---------- */
const TAV_TIPI = {una: 'Tavola a una entrata (diametro → volume)', doppia: 'Tavola a doppia entrata (diametro × altezza → volume)', coeff: 'Equazione v = b1 + b2·d²·h + b3·d (dm³)'};
function tavFor(lot, sp) {

  return id && id !== 'infc' ? S.tavole.find(t => t.id === id) : null;
}
const lerp = (x, x0, x1, y0, y1) => x1 === x0 ? y0 : y0 + (y1 - y0) * (x - x0) / (x1 - x0);
function interp1(xs, ys, x) {

  let i = xs.findIndex(v => v >= x); if (i < 0) i = xs.length - 1; if (i === 0) i = 1;
  return lerp(x, xs[i - 1], xs[i], ys[i - 1], ys[i]);

function volTav(t, d, h) {

    if (!hs.length || !r.length) return null;
    const atH = r.map(x => { const pr = hs.map((hv, i) => [hv, num((x.v || [])[i])]).filter(p => p[0] !== '' && p[1] !== ''); return interp1(pr.map(p => p[0]), pr.map(p => p[1]), h); });
    const ok = atH.map((v, i) => [num(r[i].d), v]).filter(p => p[1] != null);

/* calcolo completo di una pianta */
function treeCalc(lot, x, cur) {

  const hm = num(x.h); const he = hm ? {h: hm, src: 'misurata'} : hEst(lot, x.sp, d, cur);

  if (v == null) { const r = volINFC(x.sp, d, he.h); v = r.v; vsrc = r.src + (t ? ` (fuori dalla tavola ${t.nome})` : ''); }

    <div class="chips" style="margin-top:6px">${Object.entries(VF).map(([k, v]) => `<button class="chip ${sel.vf === k && !q ? 'on' : ''}" onclick="sel.q='';sel.vf='${k}';persistSel();go('verifica')">${v} (${plFilter(l, k).length})</button>`).join('')}</div>

  </div>`;
  if (x) h += plCard(l, x);

};
function plList(list, cur) {

}
/* scheda della pianta selezionata */
function plCard(l, x) {
  const ced = isCeduo(l); const X = x.dest === 'X'; const ril = x.dest === 'M' || x.dest === 'R';
  const r = dcAtteso(l, x); const an = dcAnom(l, x); const hmax = num(l.hcepp) || num(regN(l).hCepp) || 10;
  const dn = danniPl(x.id);
  let h = `<div class="card" id="plcard"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0">${X ? 'Pianta tagliata senza contrassegno' : 'Pianta n. ' + esc(x.n)}${incTag('area', S.aree.find(a => a.id === x.areaId))}</h2>
    <span class="muted">${esc(x.sp)} ${esc(spName(x.sp))}${num(x.d) ? ` · d 1,30 m <b>${fmt(num(x.d), 0)} cm</b>` : ''}${x.h ? ' · h ' + fmt(num(x.h), 1) + ' m' : ''} · ${esc(DEST[x.dest] || '')}${x.eta ? ' ' + x.eta : ''}${x.areaId ? ' · ' + esc(areaName(x.areaId)) : ''}${x.lat ? ' · ⌖' : ''}</span></div>${verPill(x)}</div>`;
  if (!X) h += `<div class="stati d3" style="margin:8px 0">${[['T', 'Tagliata'], ['P', 'In piedi'], ['N', 'Non trovata']].map(([k, v]) => `<button class="${x.ver === k ? 'on' : ''}" style="${x.ver === k ? 'background:' + VER_COL[k] + ';border-color:' + VER_COL[k] : ''}" onclick="VR.ver('${x.id}','${k}')">${v}</button>`).join('')}</div>`;
  if (!X && !x.ver) h += `<p class="muted">Indica l'esito: <b>Tagliata</b> se trovi la ceppaia, <b>In piedi</b> se la pianta non è stata abbattuta, <b>Non trovata</b> se non si rintraccia.</p>`;
  if (x.ver === 'T' || X) {
    h += `<div class="g3">${fld('piante', x, 'dc', 'Diametro ceppaia (cm)', 'n', 'onchange="setTimeout(()=>VR.refresh(),450)"')}${fld('piante', x, 'hc', 'Altezza ceppaia (cm)', 'n', 'onchange="setTimeout(()=>VR.refresh(),450)"')}${X ? `<label class="f"><span>Specie</span><select data-s="piante" data-id="${x.id}" data-k="sp" onchange="A.setF(this);setTimeout(()=>VR.refresh(),450)">${S.specie.map(s => `<option value="${s.id}" ${s.id === x.sp ? 'selected' : ''}>${esc(s.id)} – ${esc(s.nome)}</option>`).join('')}</select></label>` : `<label class="f"><span>Atteso</span><input value="${r ? fmt(r[0], 0) + '–' + fmt(r[1], 0) + ' cm' : '—'}" disabled></label>`}</div>
      ${an ? `<div class="warnbox">Diametro della ceppaia fuori dall'intervallo atteso per una pianta di ${fmt(num(x.d), 0)} cm: controlla il numero o segnala l'anomalia nelle note.</div>` : ''}
      ${num(x.hc) && num(x.hc) > hmax ? `<div class="warnbox">Ceppaia più alta del massimo consentito (${fmt(hmax, 0)} cm).</div>` : ''}
      <div class="f" style="margin-bottom:10px"><span class="muted" style="display:block;font-size:.82rem;margin-bottom:4px">Qualità del taglio</span><div class="chips">${Object.entries(QUAL_CEPP).map(([k, v]) => `<button class="chip ${x.qual === k ? 'on' : ''}" onclick="VR.set('${x.id}','qual','${k}')">${v}</button>`).join('')}</div></div>`;
    if (X) h += `<div class="f" style="margin-bottom:10px"><span class="muted" style="display:block;font-size:.82rem;margin-bottom:4px">Motivo del taglio</span><div class="chips">${MOTIVI_X.map(m => `<button class="chip ${x.motivo === m ? 'on' : ''}" onclick="VR.set('${x.id}','motivo','${esc(m).replace(/'/g, '\\\'')}')">${esc(m)}</button>`).join('')}</div></div>`;
  }
  if (x.ver === 'P' || (ril && x.ver !== 'T' && x.ver !== 'N')) {
    h += `<div class="f" style="margin-bottom:8px"><span class="muted" style="display:block;font-size:.82rem;margin-bottom:4px">Danni sulla pianta in piedi</span>
      ${dn.map(d => `<div class="it" onclick="VR.editDanno('${d.id}')"><div class="b"><b>${esc(DANNO_TIPI[d.tipo] || d.tipo)}</b><span class="muted">${num(d.pct) !== '' ? fmt(num(d.pct), 0) + '% · ' + gravOf(d.pct) : ''}${d.evit === 1 ? ' · evitabile' : d.evit === 0 ? ' · inevitabile' : ''}${d.note ? ' · ' + esc(d.note) : ''}</span></div><span class="pill ${d.evit === 1 ? 'w' : ''}">✎</span></div>`).join('')}

  }
  h += fld('piante', x, 'vnote', 'Note della verifica');
  h += fotoBox(x.id, 'pianta');
  h += `<p class="muted" style="margin:6px 0">${x.vop ? 'Verificata da ' + esc(x.vop) + (x.vt ? ' il ' + new Date(x.vt).toLocaleDateString('it-IT') : '') : 'Non ancora verificata'}${x.op && !X ? ' · martellata: ' + esc(x.op) : ''}${x.lat ? ` · posizione ${(+x.lat).toFixed(5)}, ${(+x.lon).toFixed(5)}` : ''}</p>
    <div class="row"><button class="btn sm" onclick="VR.next()">Fatto, prossima ›</button><button class="btn sm sec" onclick="VR.pos('${x.id}')">⌖ Posizione</button><button class="btn sm sec" onclick="sel.pl='';go('verifica')">Chiudi</button>${X ? `<button class="btn sm warn" onclick="VR.delX('${x.id}')">Elimina</button>` : ''}</div></div>`;
  return h;
}
/* posizione continua mentre si verifica */
const TG = {watch: null, pos: null};
function treeGpsStart() {
  if (TG.watch != null || !navigator.geolocation) return;
  TG.watch = navigator.geolocation.watchPosition(p => { TG.pos = p.coords; }, () => {}, {enableHighAccuracy: true, maximumAge: 5000, timeout: 30000});
}
function treeGpsStop() { if (TG.watch != null) { navigator.geolocation.clearWatch(TG.watch); TG.watch = null; } }

/* ---------- scheda del danno ---------- */

      <div class="g2">${fld('danni', d, 'sup', 'Superficie interessata (m²)', 'n')}${fld('danni', d, 'lung', 'Lunghezza (m, piste e solchi)', 'n')}</div>` : ''}

      <div class="chips">${[5, 10, 20, 30, 50, 75, 100].map(p => `<button class="chip ${num(d.pct) === p ? 'on' : ''}" onclick="VR.dset('${d.id}','pct',${p})">${p}%</button>`).join('')}<input value="${esc(d.pct ?? '')}" inputmode="numeric" placeholder="altro" style="width:70px;min-height:36px;padding:6px" onchange="VR.dset('${d.id}','pct',this.value)"></div>

/* ---------- ELENCO (piedilista di verifica) ---------- */

    <div class="tw"><table class="pl"><tr><th>N.</th><th>Specie</th><th>d</th><th>Dest.</th><th>Esito</th><th>Cepp.</th>${ced ? '<th>h c.</th>' : ''}<th>Qual.</th><th>Danni</th><th></th></tr>
    ${list.map(x => `<tr onclick="VR.open('${x.id}')" ${dcAnom(l, x) ? 'style="background:#fff3e0"' : ''}><td><b>${x.dest === 'X' ? '✕' : esc(x.n)}</b></td><td>${esc(x.sp)}</td><td>${num(x.d) ? fmt(num(x.d), 0) : ''}</td><td>${esc(DEST_S[x.dest] || '')}${x.eta ? ' ' + x.eta : ''}</td><td>${x.dest === 'X' ? '—' : esc(VER_ST[x.ver || ''])}</td><td>${num(x.dc) ? fmt(num(x.dc), 0) : ''}</td>${ced ? `<td>${num(x.hc) ? fmt(num(x.hc), 0) : ''}</td>` : ''}<td>${x.qual ? esc(QUAL_CEPP[x.qual] || x.qual) : ''}</td><td>${danniPl(x.id).length || ''}</td><td>${x.lat ? '⌖' : ''}</td></tr>`).join('') || '<tr><td colspan="10" class="muted">Nessuna pianta.</td></tr>'}</table></div>
    <p class="muted">Tocca una riga per aprire la verifica. Righe evidenziate: diametro della ceppaia incoerente con la martellata.</p></div>`;

/* ---------- AZIONI ---------- */
const VR = {
  list() { const l = lot(); const q = String(sel.q || '').trim(); let list = q ? pianteOf(l.id).filter(x => String(x.n ?? '').startsWith(q) || x.sp === q.toUpperCase()) : plFilter(l, sel.vf); if (sel.area) list = list.filter(x => x.areaId === sel.area); const el = $('#pllist'); if (el) el.innerHTML = plList(list, plOf(sel.pl)); },
  goN() {
    const l = lot(); const q = String(sel.q || '').trim(); if (!q) return;
    const x = pianteOf(l.id).find(p => String(p.n) === q); if (!x) return toast('Nessuna pianta n. ' + q + ' nel piedilista. Se è stata tagliata senza contrassegno, registrala con il pulsante apposito.', 4000);
    sel.q = ''; VR.sel(x.id);
  },
  sel(id) { sel.pl = id; go('verifica'); setTimeout(() => { const c = $('#plcard'); if (c) c.scrollIntoView({block: 'start', behavior: 'smooth'}); }, 30); },
  open(id) { sel.pl = id; sel.q = ''; go('verifica'); setTimeout(() => { const c = $('#plcard'); if (c) c.scrollIntoView({block: 'start'}); }, 30); },
  refresh() { if (sel.view === 'verifica') { const x = plOf(sel.pl); const c = $('#plcard'); if (x && c) { c.outerHTML = plCard(lot(), x); loadFoto(); } } },
  next() {
    const l = lot(); const cur = plOf(sel.pl); let list = plFilter(l, 'da'); if (sel.area) list = list.filter(x => x.areaId === sel.area);
    if (cur && num(cur.n) !== '') { const after = list.filter(x => num(x.n) > num(cur.n)); if (after.length) list = after; }
    sel.q = ''; if (!list.length) { sel.pl = ''; toast('Tutte le piante dell\'elenco sono verificate'); go('verifica'); return; }
    sel.pl = list[0].id; go('verifica'); window.scrollTo(0, 0);
  },
  async ver(id, k) {
    const x = plOf(id); if (!x) return; const a = S.aree.find(q => q.id === x.areaId); if (a && !incOk('area', a)) return;
    x.ver = x.ver === k ? '' : k; x.vop = opName(); x.vt = Date.now(); x.vdev = DEV;
    if (x.ver !== 'T') { x.dc = ''; x.hc = ''; x.qual = ''; }
    if (!x.lat && TG.pos && TG.pos.accuracy < 30) { x.lat = TG.pos.latitude; x.lon = TG.pos.longitude; x.acc = Math.round(TG.pos.accuracy * 10) / 10; }
    await save('piante', x); buzz(12); VR.refresh();
    if (x.ver === 'T') setTimeout(() => { const i = document.querySelector('#plcard input[data-k=dc]'); if (i) i.focus(); }, 60);
  },
  async set(id, k, v) { const x = plOf(id); if (!x) return; x[k] = x[k] === v ? '' : v; x.vop = opName(); x.vt = Date.now(); await save('piante', x); VR.refresh(); },
  pos(id) {
    if (!navigator.geolocation) return toast('GPS non disponibile'); toast('Ricerca posizione…', 2500);
    navigator.geolocation.getCurrentPosition(async p => { const x = plOf(id); x.lat = p.coords.latitude; x.lon = p.coords.longitude; x.acc = Math.round(p.coords.accuracy * 10) / 10; await save('piante', x); toast(`Posizione ±${Math.round(p.coords.accuracy)} m`); VR.refresh(); }, e => toast('GPS: ' + e.message), {enableHighAccuracy: true, timeout: 30000});
  },
  async newX() {
    const l = lot(); const {used} = spOrder(); const sp = sel.sp && SP[sel.sp] ? sel.sp : used[0] || l.sp_prev || 'CE';
    const x = {id: uid(), lottoId: l.id, areaId: sel.area || (areeOf(l.id).length === 1 ? areeOf(l.id)[0].id : ''), n: '', sp, d: '', dc: '', dest: 'X', ver: 'T', motivo: '', vop: opName(), vt: Date.now(), op: opName(), dev: DEV, t: Date.now()};
    if (TG.pos && TG.pos.accuracy < 50) { x.lat = TG.pos.latitude; x.lon = TG.pos.longitude; x.acc = Math.round(TG.pos.accuracy * 10) / 10; }
    await save('piante', x); sel.pl = x.id; sel.vf = 'X'; sel.q = ''; go('verifica');
    if (!x.lat) VR.pos(x.id);
    setTimeout(() => { const i = document.querySelector('#plcard input[data-k=dc]'); if (i) i.focus(); }, 60);
  },
  async delX(id) { if (!confirm('Eliminare questa pianta?')) return; for (const d of danniPl(id)) await remove('danni', d.id); await remove('piante', id); sel.pl = ''; go('verifica'); },
  async newDanno(plId) {
    const l = lot(); const pl = plOf(plId);
    const d = {id: uid(), lottoId: l.id, plId: plId || '', areaId: pl ? pl.areaId || '' : sel.area || '', sp: pl ? pl.sp : '', d: pl ? pl.d : '', tipo: pl ? 'SC' : 'SU', sotto: '', pct: '', evit: pl ? '' : '', sup: '', lung: '', causa: '', note: '', op: opName(), dev: DEV, t: Date.now()};
    if (pl && pl.lat) { d.lat = pl.lat; d.lon = pl.lon; } else if (TG.pos && TG.pos.accuracy < 50) { d.lat = TG.pos.latitude; d.lon = TG.pos.longitude; }
    await save('danni', d); VR.editDanno(d.id); if (!d.lat) VR.dpos(d.id, true);
  },
  editDanno(id) { const d = S.danni.find(x => x.id === id); if (!d) return; sel.dn = id; $('#view').innerHTML = dannoForm(d); loadFoto(); window.scrollTo(0, 0); },
  async dset(id, k, v) { const d = S.danni.find(x => x.id === id); if (!d) return; d[k] = k === 'pct' ? (num(v) === '' ? '' : num(v)) : (d[k] === v && !['evit', 'tipo'].includes(k) ? '' : v); await save('danni', d); $('#dform').outerHTML = dannoForm(d); loadFoto(); },
  closeDanno() { const d = S.danni.find(x => x.id === sel.dn); sel.dn = ''; if (d && d.plId) { sel.pl = d.plId; } go(sel.view === 'elenco' ? 'elenco' : 'verifica'); },
  async delDanno(id) { if (!confirm('Eliminare il danno?')) return; await remove('danni', id); for (const f of await fotoOf(id)) { f.del = true; f.data = ''; await DB.put('foto', f); } VR.closeDanno(); },

/* ============================================================
   DL Foresta — collegamento a QFieldCloud (API v1)
   Nell'app Android le richieste passano dal livello nativo (niente blocco CORS)
   e la sincronizzazione è automatica. Il token resta sul dispositivo.
   ============================================================ */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const b64ToU8 = s => Uint8Array.from(atob(String(s).replace(/\s+/g, '')), c => c.charCodeAt(0));
/* Sito web: le chiamate passano dal "ponte" (Cloudflare Worker dell'utente) perché QFieldCloud non accetta il browser.
   L'indirizzo del ponte è comune alle due app (stesso sito). */
const ponte = () => String(LS.get('qfc-ponte', '') || '').trim().replace(/\/+$/, '');
const NET = () => NATIVE || !!ponte();
function u8ToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

const QFC = {
  url: () => (!NATIVE && ponte() ? ponte() : LS.get('mc-qfc-url', 'https://app.qfield.cloud').replace(/\/+$/, '')) + '/api/v1/',
  token: () => LS.get('mc-qfc-token', ''),
  user: () => LS.get('mc-qfc-user', ''),
  /* body: oggetto JSON oppure {file: Uint8Array, name, mime} per il caricamento multipart */
  async req(method, path, body, bin) {
    const url = QFC.url() + path.replace(/\/?$/, '/');
    const h = {Accept: 'application/json'};
    if (QFC.token()) h.Authorization = 'Token ' + QFC.token();
    let status, data, text;
    if (NATIVE) {
      const o = {url, method, headers: h, connectTimeout: 20000, readTimeout: 120000};
      if (bin) o.responseType = 'arraybuffer';
      if (body && body.file) {
        const bd = 'pafcampo' + Math.random().toString(16).slice(2);
        const enc = new TextEncoder();
        const head = enc.encode(`--${bd}\r\nContent-Disposition: form-data; name="file"; filename="${body.name}"\r\nContent-Type: ${body.mime}\r\n\r\n`);
        const tail = enc.encode(`\r\n--${bd}--\r\n`);
        const all = new Uint8Array(head.length + body.file.length + tail.length);
        all.set(head, 0); all.set(body.file, head.length); all.set(tail, head.length + body.file.length);
        h['Content-Type'] = 'multipart/form-data; boundary=' + bd; o.data = u8ToB64(all); o.dataType = 'file';
      } else if (body) { h['Content-Type'] = 'application/json'; o.data = body; }
      let r;
      try { r = await Capacitor.nativePromise('CapacitorHttp', 'request', o); }
      catch (e) { throw new Error('QFieldCloud non raggiungibile (' + (e.message || 'rete assente') + ').'); }
      status = r.status; data = r.data; text = typeof data === 'string' ? data : JSON.stringify(data);
      if (status >= 200 && status < 300) {
        if (bin) return b64ToU8(data);
        if (typeof data === 'string') { try { return data ? JSON.parse(data) : null; } catch (e) { return data; } }
        return data;
      }
    } else {
      let b = body;
      if (body && body.file) { b = new FormData(); b.append('file', new Blob([body.file], {type: body.mime}), body.name); }
      else if (body) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
      let r;
      try { r = await fetch(url, {method, headers: h, body: b}); }
      catch (e) { throw new Error(ponte() ? 'Ponte o QFieldCloud non raggiungibili (' + (e.message || 'rete assente') + '). Controlla la connessione e l\'indirizzo del ponte.' : 'Dal sito web serve il ponte verso QFieldCloud: impostalo in Altro → QFieldCloud (oppure usa l\'app Android).'); }
      status = r.status;
      if (r.ok) { if (bin) return new Uint8Array(await r.arrayBuffer()); return status === 204 ? null : r.json(); }
      text = await r.text();
    }
    if (status === 401 || (status === 403 && /token|credential|authenticat/i.test(text || ''))) { if (path !== 'auth/login/') LS.set('mc-qfc-token', ''); throw new Error('Accesso negato: ' + String(text || status).slice(0, 160)); }
    throw new Error(`QFieldCloud ${status}: ${String(text || '').slice(0, 200)}`);
  },
  async login(user, pass) { const d = await QFC.req('POST', 'auth/login/', {username: user, password: pass}); LS.set('mc-qfc-token', d.token); LS.set('mc-qfc-user', d.username || user); return d; },
  async logout() { try { await QFC.req('POST', 'auth/logout/'); } catch (e) {} LS.set('mc-qfc-token', ''); },
  projects: () => QFC.req('GET', 'projects/'),
  create: (name, owner) => QFC.req('POST', 'projects/', {name, owner, description: 'Direzione lavori forestali – DL Foresta', is_public: false}),
  files: pid => QFC.req('GET', `files/${pid}/`),
  download: (pid, name) => QFC.req('GET', `files/${pid}/${String(name).split('/').map(encodeURIComponent).join('/')}/`, null, true),
  upload: (pid, name, data, mime = 'application/octet-stream') => QFC.req('POST', `files/${pid}/${String(name).split('/').map(encodeURIComponent).join('/')}/`, {file: data instanceof Uint8Array ? data : new Uint8Array(data), name, mime}),
  package: pid => QFC.req('POST', 'jobs/', {project_id: pid, type: 'package'}),
  remove: (pid, name) => QFC.req('DELETE', `files/${pid}/${String(name).split('/').map(encodeURIComponent).join('/')}/`)
};
const fileSig = (files, n) => { const f = files.find(x => x.name === n); return f ? (f.md5sum || f.sha256 || '') + '|' + (f.last_modified || f.size || '') : ''; };

/* Sincronizzazione: 1) scarica il GeoPackage dal cloud e unisce le modifiche fatte in QField
   2) carica il GeoPackage aggiornato con i dati dell'app, solo se nel frattempo nessuno ha modificato il file. */
async function qfcSync(prog, log = () => {}, force = true) {
  const pid = prog.qfc_pid;
  if (!pid) throw new Error('Piano non collegato a un progetto QFieldCloud.');
  let files = await QFC.files(pid), chg = 0, synth = 0;
  for (let tent = 0; tent < 3; tent++) {
    const sig = fileSig(files, GPKG_FILE);
    if (sig && sig !== prog.qfc_sig) {
      log('Scarico ' + GPKG_FILE + '…');
      const u8 = await QFC.download(pid, GPKG_FILE);
      const {rep} = await importGpkg(u8, prog.id, {base: await syncBaseGet(prog.id), force: true}); chg += rep.nuovi + rep.agg + rep.elim;
      await syncBaseSet(prog.id, u8); prog.qfc_sig = sig;
      log(`Dal cloud: ${rep.nuovi} elementi nuovi, ${rep.agg} aggiornati, ${rep.elim} eliminati.`);
    }
    const t0 = Date.now();
    const local = !sig || !prog.qfc_last || synth > 0 || LS.get('dl-lastmod', 0) > prog.qfc_last;
    const needQgs = !files.some(x => /^DLForesta\.qg[sz]$/.test(x.name));
    if (local || force || needQgs) {
      log('Preparo il GeoPackage aggiornato…');
      const out = await exportGpkg(prog.id);
      files = await QFC.files(pid);
      if (fileSig(files, GPKG_FILE) !== sig) { log('Il file sul cloud è cambiato proprio ora: ripeto l\'unione.'); prog.qfc_sig = ''; continue; }
      log('Carico su QFieldCloud…');
      await QFC.upload(pid, GPKG_FILE, out, 'application/geopackage+sqlite3');
      await gpkgBaseSet(prog.id, out); await syncBaseSet(prog.id, out);
      if (needQgs) {
        log('Carico il progetto QGIS…');
        const q = await (await fetch('./DLForesta.qgz')).arrayBuffer();
        await QFC.upload(pid, 'DLForesta.qgz', q, 'application/zip');
      }
      files = await QFC.files(pid);
      if (await fotoPush(prog, files, log)) files = await QFC.files(pid);
      try { await QFC.package(pid); } catch (e) {}
    } else { log('Nessuna modifica locale da inviare.'); if (await fotoPush(prog, files, log)) files = await QFC.files(pid); }
    await fotoPull(prog, files, log);
    prog.qfc_sig = fileSig(files, GPKG_FILE); prog.qfc_last = t0; prog.qfc_err = ''; await DB.put('lotti', prog);
    log('Sincronizzazione completata. In QField premi "Sincronizza" per ricevere i dati.');
    return chg;
  }
  throw new Error('Il file sul cloud continua a cambiare (QField sta sincronizzando?). Riprovo più tardi.');
}

/* Collega un progetto del cloud: scarica il piano sul telefono di un nuovo operatore,
   ritrova il piano già presente (stesso identificativo) oppure collega quello aperto. */
async function qfcLink(pid, name, log = () => {}) {
  const files = await QFC.files(pid); const sig = fileSig(files, GPKG_FILE); const cur = prog();
  const link = async p => { p.qfc_pid = pid; p.qfc_name = name; await save('lotti', p); return p; };
  if (!sig && files.some(f => /\.(qgs|qgz|gpkg|shp|geojson)$/i.test(f.name) && !/^DLForesta\.qg[sz]$/.test(f.name)))
    throw new Error(`Il progetto "${name}" non è stato creato da DL Foresta: non lo collego per non modificarlo. Se è il progetto della martellata, usa "Importa dati da un altro progetto" per portare il piedilista nel cantiere.`);
  if (!sig) { if (!cur) throw new Error('Il progetto sul cloud è vuoto: crea prima il cantiere sul telefono, poi collegalo.'); cur.qfc_sig = ''; cur.qfc_last = 0; return link(cur); }
  log('Scarico ' + GPKG_FILE + '…');
  const u8 = await QFC.download(pid, GPKG_FILE);
  const SQL = await sqlJs(); const db = new SQL.Database(u8); const pr = rows(db, 'cantiere')[0]; db.close();
  const same = pr && pr.uuid && S.lotti.find(x => x.id === pr.uuid);
  const empty = x => !S.aree.some(q => q.lottoId === x.id) && !S.piante.some(q => q.lottoId === x.id);
  let target;
  if (same) target = same;
  else if (!cur || empty(cur) || !confirm(`Il progetto "${name}" contiene un cantiere diverso da "${cur.nome}". Unire i dati del cloud nel cantiere aperto?\n\nAnnulla = scarica il cantiere del cloud come cantiere separato.`)) {
    const {prog: p, rep} = await importGpkg(u8, null); target = p;
    log(`Cantiere scaricato: ${rep.aree} aree, ${rep.piante} piante.`);
    if (cur && empty(cur) && cur.id !== p.id && /^Nuovo cantiere/.test(cur.nome || '') && !cur.qfc_pid) { await remove('lotti', cur.id); }
    target.qfc_sig = sig; target.qfc_last = Date.now(); await syncBaseSet(target.id, u8);
    return link(target);
  } else target = cur;
  // unione nel piano esistente
  const {rep} = await importGpkg(u8, target.id, {force: true, base: target.qfc_pid === pid ? await syncBaseGet(target.id) : null});
  log(`Uniti: ${rep.nuovi} elementi nuovi, ${rep.agg} aggiornati.`);
  target.qfc_sig = sig; target.qfc_last = 0; await syncBaseSet(target.id, u8);
  return link(target);
}

/* ---------- Sincronizzazione automatica (solo app Android) ---------- */
const AUTO = {busy: false, dirty: false, last: 0, timer: null, errAt: 0};
const autoOn = () => NET() && LS.get('dl-qfc-auto', true) && !!QFC.token();
function syncBadge(state) {
  const el = document.getElementById('sync'); if (!el) return;
  el.hidden = !NET() || !QFC.token();
  el.textContent = {run: '☁ …', ok: '☁ ✓', err: '☁ !', wait: '☁ •'}[state] || '☁';
  el.title = {run: 'Sincronizzazione in corso', ok: 'Sincronizzato', err: 'Ultima sincronizzazione non riuscita', wait: 'Modifiche da inviare'}[state] || '';
}
async function autoSync(force) {
  if (!autoOn() || AUTO.busy || !navigator.onLine) { if (AUTO.dirty) syncBadge('wait'); return; }
  const ps = S.lotti.filter(p => p.qfc_pid);
  if (!ps.length) return;
  if (!force && !AUTO.dirty && Date.now() - AUTO.last < 10 * 60e3) return;
  if (!force && Date.now() - AUTO.errAt < 2 * 60e3) return;
  AUTO.busy = true; AUTO.dirty = false; syncBadge('run');
  let ok = true, chg = 0;
  for (const p of ps) {
    try { chg += await qfcSync(p, () => {}, false); }
    catch (e) { ok = false; p.qfc_err = e.message; try { await DB.put('lotti', p); } catch (x) {} console.warn('autosync', e); }
  }
  AUTO.busy = false; AUTO.last = Date.now(); if (!ok) AUTO.errAt = Date.now();
  syncBadge(ok ? (AUTO.dirty ? 'wait' : 'ok') : 'err');
  if (!chg) return;
  toast(`☁ ${chg} aggiornamenti ricevuti`, 2500);
  if (sel.view === 'mappa') { if (M.map && M.lyrP) drawLayers(false); }
  else if (['cantieri', 'elenco', 'riepilogo', 'verifica', 'altro'].includes(sel.view) && !document.querySelector('input:focus,textarea:focus,select:focus')) go(sel.view);
}
function autoMark() { if (!NET()) return; AUTO.dirty = true; syncBadge('wait'); clearTimeout(AUTO.timer); AUTO.timer = setTimeout(() => autoSync(), 45e3); }
function autoStart() {
  if (!NET() || AUTO.started) return; AUTO.started = true;
  syncBadge(AUTO.dirty ? 'wait' : '');
  addEventListener('online', () => setTimeout(() => autoSync(true), 3000));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); else if (AUTO.dirty) autoSync(true); });
  setInterval(() => autoSync(), 3 * 60e3);
  setTimeout(() => autoSync(true), 4000);
}

/* Importa i dati di un progetto QFieldCloud qualsiasi (fatto a mano in QGIS/QField) nel lotto aperto.
   Il progetto sul cloud viene solo letto: nessun file viene caricato o modificato. */
const MB = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
const QFC_MAXMB = 120;
/* elenco dei file importabili di un progetto QFieldCloud (GeoPackage, shapefile raggruppati, GeoJSON) */
async function qfcOtherFiles(pid) {
  const files = await QFC.files(pid); const out = [];
  files.filter(f => /\.(gpkg|geojson)$/i.test(f.name)).forEach(f => out.push({key: f.name, names: [f.name], size: +f.size || 0}));
  files.filter(f => /\.shp$/i.test(f.name)).forEach(f => {
    const base = f.name.slice(0, -4).toLowerCase();
    const parts = files.filter(x => x.name.toLowerCase().startsWith(base + '.') && /\.(shp|dbf|prj|cpg)$/i.test(x.name));
    out.push({key: f.name, names: parts.map(x => x.name), size: parts.reduce((a, x) => a + (+x.size || 0), 0)});
  });
  return out;
}
async function qfcReadOther(pid, list, log = () => {}) {
  const sets = [];
  for (const it of list) {
    if (it.size > QFC_MAXMB * 1048576) { log(`${it.key}: ${MB(it.size)}, troppo grande per il telefono. Saltato.`); continue; }
    if (/\.gpkg$/i.test(it.key)) {
      log(`Scarico ${it.key} (${MB(it.size)})…`);
      const u8 = await QFC.download(pid, it.key);
      log(`Leggo i layer di ${it.key}…`); await new Promise(r => setTimeout(r, 30));
      const ds = await readGpkgAny(u8, it.key.split('/').pop(), log);
      log(`${it.key}: ${ds.length} layer con geometrie.`); sets.push(...ds);
    } else {
      const blobs = [];
      for (const n of it.names) { log('Scarico ' + n + '…'); const u8 = await QFC.download(pid, n); blobs.push({name: n.split('/').pop(), arrayBuffer: async () => u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)}); }
      try { sets.push(...(await readVector(blobs))); } catch (e) { log(it.key + ': ' + e.message); }
    }

  return sets;
}

/* ============================================================

  last: (pid, op) => Math.max(0, ...S.rilievi.filter(r => r.progId === pid && r.op === op).map(r => r.mod || r.t1 || r.t0 || 0), ...S.osservazioni.filter(o => o.progId === pid && o.op === op).map(o => o.mod || o.t || 0))

    ads: {lab: () => 'area di saggio', list: lid => adsOf(lid), name: a => 'AS' + (a.n ?? ''), parent: a => ['area', S.aree.find(x => x.id === a.areaId)], store: 'ads'}

  last: (lid, op) => Math.max(0, ...S.piante.filter(x => x.lottoId === lid && (x.vop || x.op) === op).map(x => x.mod || x.t || 0), ...S.ads.filter(x => x.lottoId === lid && x.op === op).map(x => x.mod || x.t || 0))

const INC_ST = {assegnato: 'assegnata', corso: 'in corso', fatto: 'completata', libero: 'libera'};

/* ---------- scambio con il GeoPackage ---------- */
const INC_COLS = [['uuid', 'TEXT'], ['mod_ts', 'INTEGER'], ['tipo', 'TEXT'], ['nome', 'TEXT'], ['operatore', 'TEXT'], ['stato', 'TEXT'], ['assegnato_da', 'TEXT'], ['t_presa', 'INTEGER'], ['prec', 'TEXT'], ['data', 'TEXT']];
function incRows(pid) {
  return S.incarichi.filter(x => x.projId === pid).map((x, i) => ({fid: i + 1, uuid: x.id, mod_ts: x.mod || x.t || 0, tipo: x.kind, nome: x.nome || null, operatore: x.op || null, stato: x.stato, assegnato_da: x.da || null, t_presa: x.tp || null, prec: x.prev || null, data: new Date(x.mod || x.t || Date.now()).toISOString()}));
}
/* unisce gli incarichi del cloud; restituisce quante modifiche e le unità perse da questo operatore */
async function incMerge(rs, pid) {
  let chg = 0; const lost = []; const me = opName();
  for (const r of rs) {
    if (!r.uuid) continue;
    const x = {id: r.uuid, projId: pid, kind: r.tipo || '', nome: r.nome || '', op: r.operatore || '', stato: INC_ST[r.stato] ? r.stato : 'libero', da: r.assegnato_da || '', tp: r.t_presa || 0, prev: r.prec || '', mod: r.mod_ts || 0, t: r.mod_ts || 0};
    const l = incOf(x.id);
    if (!l) { await putS('incarichi', x); chg++; continue; }
    if ((l.mod || 0) === x.mod && l.op === x.op && l.stato === x.stato) continue;
    let win = x.mod > (l.mod || 0) ? x : l;
    if (x.stato === 'corso' && l.stato === 'corso' && x.op !== l.op) win = (x.tp || x.mod) <= (l.tp || l.mod) ? x : l; // prese in contemporanea: vince la prima
    const older = win === x ? l : x;
    if (!['corso', 'assegnato'].includes(win.stato) && win.prev && incHeld(older.stato) && older.op && older.op !== win.prev && older.stato !== 'fatto') win = older; // rilascio di un incarico che nel frattempo era passato ad altri
    if (win === x) { if (l.op === me && ['corso', 'assegnato'].includes(l.stato) && x.op && x.op !== me) lost.push(x); await putS('incarichi', x); chg++; }
  }
  if (lost.length) setTimeout(() => toast(`Attenzione: ${lost.map(x => x.nome).join(', ')} ${lost.length > 1 ? 'erano già state prese' : 'era già stata presa'} da ${[...new Set(lost.map(x => x.op))].join(', ')}`, 6000), 300);
  return {chg, lost};
}

/* ============================================================
   Grafici per i report (canvas → PNG). Modulo comune a PAF Campo e Martellata Campo.
   Ogni funzione restituisce {png: Uint8Array, url: dataURL, w, h} (dimensioni in px a 2x per la stampa).

const GR_COL = ['#2f6b2a', '#c98a1f', '#3b6fb6', '#b5443b', '#7a5c9e', '#2a9d8f', '#8c8c3b', '#d4765a', '#5b7f95', '#9b6b3c'];

  if (cur) lines.push(cur); return lines;
}
function grLegend(c, series, x, y, maxW) { // legenda orizzontale a capo; restituisce l'altezza usata
  c.font = '11px Arial, Helvetica, sans-serif'; let cx = x, cy = y; const lh = 16;
  series.forEach((s, i) => {
    const w = 14 + c.measureText(s.name).width + 12;

    c.fillStyle = s.color || GR_COL[i % GR_COL.length]; c.fillRect(cx, cy - 5, 10, 10);
    c.fillStyle = '#222'; c.textAlign = 'left'; c.fillText(s.name, cx + 14, cy); cx += w;
  });

/* Barre: labels = categorie sull'asse x; series = [{name, values, color}]; opt = {title, xLabel, yLabel, stacked, w, h, dec, values:true} */
function chartBars(labels, series, opt = {}) {

  labels.forEach((lab, i) => {

  if (opt.yLabel) { c.save(); c.translate(14, top + ph / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.fillText(opt.yLabel, 0, 0); c.restore(); }

/* Torta/anello: items = [{name, value, color}]; opt = {title, w, h, unit, dec} */
function chartPie(items, opt = {}) {

  const r = Math.min((H - top - 16) / 2, W * 0.26); const cx = r + 24, cy = top + (H - top) / 2;
  let a = -Math.PI / 2;
  data.forEach((d, i) => {
    const ang = d.value / tot * 2 * Math.PI; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, a, a + ang); c.closePath();
    c.fillStyle = d.color || GR_COL[i % GR_COL.length]; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();

    a += ang;

/* Linee: x = valori numerici o etichette; series = [{name, values, color}]; opt = {title, xLabel, yLabel, points} */
function chartLines(xs, series, opt = {}) {

  if (series.length > 1) top += grLegend(c, series, 60, top + 6, W - 80) + 2;

/* Barre orizzontali con intervallo di errore: items = [{name, value, err}]; opt = {title, xLabel, unit} */

  const pid = new URLSearchParams(location.search).get('portale'); if (!pid) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!PT.url() && document.referrer) { try { const o = new URL(document.referrer).origin; if (/workers\.dev|portale/i.test(o)) LS.set('portale-url', o); } catch (e) {} }
  if (PT.on()) { setTimeout(() => PT.apriUI(pid), 300); return; }
  $('#view').innerHTML = `<div class="card"><h2>Progetto dal portale</h2>
    <p class="muted">Per scaricare il progetto in questa app inserisci (una volta sola, su questo dispositivo) l'indirizzo e la chiave del Portale Foresta.</p>
    <label class="f"><span>Indirizzo del portale</span><input id="ptd-u" value="${esc(PT.url())}" placeholder="https://foresta-portale.xxxx.workers.dev" inputmode="url"></label>
    <label class="f"><span>Chiave di accesso</span><input id="ptd-k" type="password" value="${esc(PT.key())}" placeholder="chiave del portale"></label>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="LS.set('portale-url',$('#ptd-u').value.trim());LS.set('portale-key',$('#ptd-k').value.trim());PT.list=null;if(!PT.on()){toast('Inserisci indirizzo e chiave',2500);return}PT.apriUI('${esc(pid)}')">Apri il progetto</button><button class="btn sec" onclick="go('cantieri')">Annulla</button></div></div>`;
};

boot();
</script>
</body>
</html>
