<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b2a">
<title>PAF Campo</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>window.PAF_PWA=true</script>
<style>:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1b2419; --muted:#5d6b58; --line:#d7ddd2;
  --acc:#2f6b2a; --acc-ink:#ffffff; --acc-soft:#e3efdf; --warn:#a15c00; --warn-soft:#fff1dc;
  --bad:#b3261e; --dead:#6d5a4b; --mat:#1f5f8b; --pol:#7a4d9c;
  --r:12px; --tap:56px;
  font-size:16px;
}
:root[data-theme="dark"]{
  --bg:#0f140e; --card:#182017; --ink:#eef3ea; --muted:#a3b19c; --line:#2d3a2a;
  --acc:#7cc46f; --acc-ink:#0b1409; --acc-soft:#223320; --warn:#f0b35a; --warn-soft:#2e2413;
  --bad:#ff8a80; --dead:#c8ad96; --mat:#7cc0f0; --pol:#c9a4ea;
}
:root[data-theme="sun"]{ /* alto contrasto per pieno sole */
  --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#222; --line:#000;
  --acc:#003d00; --acc-ink:#ffffff; --acc-soft:#dcffd6; --warn:#6b3a00; --warn-soft:#ffe8b0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--acc);color:var(--acc-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top .t{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:.78rem;opacity:.85;display:block;font-weight:500}
header.top button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-size:.85rem}
main{padding:12px 14px;max-width:900px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;color:var(--muted);padding:8px 0 10px;font-size:.64rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav.bottom button .i{font-size:1.35rem;line-height:1}
nav.bottom button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:1.15rem;margin:4px 0 12px}
h3{font-size:1rem;margin:14px 0 8px}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:0 16px;min-height:48px;font:inherit;font-weight:600}
.btn.sec{background:transparent;color:var(--acc)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem}
.btn.block{width:100%}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
.list .it.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.list .it .b{flex:1;min-width:0}
.list .it .b b{display:block}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-size:.9rem;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"▾";color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 14px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.78rem}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;max-width:90vw}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:10px}

/* ---- Cavallettamento ---- */
.tally-head{position:sticky;top:52px;z-index:15;background:var(--bg);padding:8px 0 6px}
.stati{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stati button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:.85rem}
.stati button.on[data-s=V]{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.stati button.on[data-s=S]{border-color:var(--dead);background:var(--dead);color:#fff}
.stati button.on[data-s=M]{border-color:var(--mat);background:var(--mat);color:#fff}
.stati button.on[data-s=P]{border-color:var(--pol);background:var(--pol);color:#fff}
.spbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.spbar button{flex:0 0 auto;min-width:64px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;padding:4px 8px;line-height:1.05}
.spbar button small{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.spbar button.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.spbar button.on small{color:var(--acc-ink)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dgrid button{position:relative;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.45rem;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dgrid button .n{position:absolute;right:6px;top:4px;font-size:.8rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:99px;padding:1px 7px}
.dgrid button .n:empty{display:none}
.dgrid button.flash{background:var(--acc);color:var(--acc-ink)}
.dgrid button.flashm{background:var(--bad);color:#fff}
.tally-sum{font-size:.85rem}
.dict{display:flex;gap:6px;margin:8px 0}
.dict input{font-size:1.2rem;font-weight:700;text-transform:uppercase}
.bigN{font-size:1.6rem;font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .bar{fill:var(--acc)}
.chart .pt{fill:var(--acc);opacity:.65}
.chart .ln{stroke:var(--warn);stroke-width:2;fill:none}
.chart .ax{stroke:var(--line)}

/* ---- Stampa ---- */
#print{display:none}
@media print{
  body{padding:0;background:#fff;color:#000}
  body.printing header.top, body.printing nav.bottom, body.printing main{display:none!important}
  body.printing #print{display:block}
  #print{font-family:Georgia,"Times New Roman",serif;font-size:10.5pt;color:#000}
  #print .pp{page-break-after:always}
  #print h1{font-size:15pt;margin:0 0 4pt}
  #print h2{font-size:12pt;margin:10pt 0 4pt;border-bottom:1px solid #000}
  #print table{font-size:9pt}
  #print th,#print td{border-bottom:1px solid #999;color:#000}
  #print .kv{display:grid;grid-template-columns:1fr 1fr;gap:1pt 14pt}
  #print .kv div{border-bottom:1px dotted #bbb;padding:1pt 0}
  #print .kv b{font-weight:600}
}
@media (min-width:700px){ .dgrid{grid-template-columns:repeat(6,1fr)} }

/* ---- Mappa ---- */
.maptools{position:absolute;top:8px;left:8px;right:8px;z-index:500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.mbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 8px #0002}
.mbar .btn.sm{min-height:40px;padding:0 10px}
.mtb{flex-wrap:nowrap}.mtb .btn.sm{flex:1;padding:0 4px;font-size:.8rem;min-width:0;white-space:nowrap}
.mappanel{position:absolute;left:8px;right:8px;bottom:12px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px #0003}
.navarrow{font-size:2.6rem;line-height:1;color:var(--acc);width:52px;text-align:center;transition:transform .3s;transform-origin:50% 50%}
.plabel{background:#ffffffd9;border:1px solid #1b2419;border-radius:6px;padding:1px 6px;font-weight:800;font-size:13px;color:#1b2419;white-space:nowrap;transform:translate(-50%,-50%)}
.leaflet-tooltip.adslabel{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:800;font-size:10px;padding:0}
.leaflet-tooltip.adslabel::before{display:none}
.leaflet-popup-content{font-size:14px;line-height:1.45}
.leaflet-popup-content .btn{margin-top:6px}
.leaflet-container{font:inherit}
[hidden]{display:none!important}
.oh{font-size:.78rem;margin:-8px 0 10px;white-space:pre-wrap}
</style>
</head>

<main id="view"></main>

</nav>

/* ---------------- Dendrometria ---------------- */
const gOf = d => Math.PI * d * d / 40000; // m²
function classOf(d) {
  const p = prog() || {}; const amp = num(p.amp) || 5; const cmin = num(p.cmin) || 10;
  const c = Math.round(d / amp) * amp;
  return c < cmin ? null : c;
}
function fitCurve(pts) { // h = a + b·ln(d)
  const P = pts.filter(p => p.d > 0 && p.h > 0);
  const n = P.length; if (n < 3) return null;
  const xs = P.map(p => Math.log(p.d)), ys = P.map(p => p.h);
  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); syy += (ys[i] - my) ** 2; }
  if (sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx;
  const r2 = syy ? (sxy * sxy) / (sxx * syy) : 1;
  return {a, b, r2, n};
}
function curves(pid = sel.prog) {
  const H = S.altezze.filter(h => h.progId === pid);
  const g = {}; const add = (k, p) => (g[k] = g[k] || []).push(p);
  H.forEach(h => { const p = {d: num(h.d), h: num(h.h)}; add(h.sp, p); add('*' + ((SP[h.sp] || {}).tipo || 'L'), p); add('*', p); });
  const out = {}; for (const k in g) { const c = fitCurve(g[k]); if (c) out[k] = c; }
  return out;
}
function hFor(sp, d, cur) {
  const c = cur[sp] || cur['*' + ((SP[sp] || {}).tipo || 'L')] || cur['*'];
  if (!c) return null;
  return Math.max(1.3, c.a + c.b * Math.log(d));
}
function volCoeff(sp) {
  const s = SP[sp] || {}; const b1 = num(s.b1), b2 = num(s.b2), b3 = num(s.b3);
  if (b1 !== '' && b2 !== '') return {b: [b1, b2, b3 === '' ? null : b3], src: 'Tavola locale'};
  const q = INFC[s.infc];
  if (q) return {b: [q.vol[0], q.vol[1], q.vol[2] ?? null], src: `INFC – ${q.sez}${s.ass ? ' (assimilata)' : ''}`};
  return {b: [0, null, null], f: num(s.f) || 0.5, src: `Coeff. di forma f = ${fmt(num(s.f) || 0.5, 2)}`};
}
function vol(sp, d, h) { // m³ per albero
  const q = volCoeff(sp);
  if (q.b[1] == null) return gOf(d) * h * q.f;
  return Math.max(0, (q.b[0] + q.b[1] * d * d * h + (q.b[2] || 0) * d) / 1000);
}
function biomass(sp, d, h, v) { // t di sostanza secca, fitomassa arborea epigea INFC
  const q = INFC[(SP[sp] || {}).infc];
  if (q) return Math.max(0, (q.dw4[0] + q.dw4[1] * d * d * h + (q.dw4[2] || 0) * d) / 1000);
  return v * 0.7;
}
function areaRil(r, pa) {
  if (r.tipo === 'ads') return Math.PI * (num(r.raggio) || 0) ** 2 / 10000;
  if (r.tipo === 'totale') return num(r.sup) || num(pa.sup_bosc) || num(pa.sup_tot) || 0;
  return null;
}
function rilPerHa(r, pa, cur) {
  const o = {N: 0, G: 0, V: 0, B: 0, Ns: 0, Gs: 0, Vs: 0, bySp: {}, byC: {}, miss: new Set(), trees: 0};
  const area = areaRil(r, pa);
  for (const k in (r.tally || {})) {
    const n = r.tally[k]; if (!n) continue;
    const [sp, cs, st] = k.split('|'); const d = +cs; const g = gOf(d);
    o.trees += n;
    let nha;
    if (r.tipo === 'rel') nha = n * (num(r.baf) || 1) / g;
    else {
      if (!area) { o.noArea = true; continue; }
      const inner = r.tipo === 'ads' && num(r.rin) && num(r.dsoglia) && d < num(r.dsoglia);
      nha = n / (inner ? Math.PI * num(r.rin) ** 2 / 10000 : area);
    }
    const h = hFor(sp, d, cur); if (h == null) o.miss.add(sp);
    const v = h == null ? 0 : vol(sp, d, h);
    if (st === 'S') { o.Ns += nha; o.Gs += nha * g; o.Vs += nha * v; continue; }
    o.N += nha; o.G += nha * g; o.V += nha * v; if (h != null) o.B += nha * biomass(sp, d, h, v);
    const b = o.bySp[sp] = o.bySp[sp] || {N: 0, G: 0, V: 0}; b.N += nha; b.G += nha * g; b.V += nha * v;
    o.byC[d] = (o.byC[d] || 0) + nha;
  }

}
function partStats(pa, cur) {
  cur = cur || curves(pa.progId);
  const rs = rilOf(pa.id).filter(r => Object.keys(r.tally || {}).length);
  if (!rs.length) return null;
  const tot = rs.filter(r => r.tipo === 'totale');
  let list;
  if (tot.length) { // più rilievi "totale" = porzioni dello stesso cavallettamento
    const merged = {}; tot.forEach(r => { for (const k in r.tally) merged[k] = (merged[k] || 0) + r.tally[k]; });
    list = [rilPerHa({tipo: 'totale', sup: tot.map(r => num(r.sup)).find(x => x) || '', tally: merged}, pa, cur)];
  } else list = rs.map(r => rilPerHa(r, pa, cur));
  const n = list.length; const mean = k => list.reduce((s, o) => s + o[k], 0) / n;
  const o = {n, tipo: tot.length ? 'totale' : 'campione', N: mean('N'), G: mean('G'), V: mean('V'), B: mean('B'), Ns: mean('Ns'), Vs: mean('Vs'), bySp: {}, byC: {}, miss: new Set(), trees: 0, noArea: list.some(x => x.noArea)};
  list.forEach(x => {
    x.miss.forEach(m => o.miss.add(m)); o.trees += x.trees;
    for (const sp in x.bySp) { const b = o.bySp[sp] = o.bySp[sp] || {N: 0, G: 0, V: 0}; b.N += x.bySp[sp].N / n; b.G += x.bySp[sp].G / n; b.V += x.bySp[sp].V / n; }
    for (const c in x.byC) o.byC[c] = (o.byC[c] || 0) + x.byC[c] / n;
  });
  o.dg = o.N ? Math.sqrt(o.G / o.N * 40000 / Math.PI) : '';
  if (n > 1 && !tot.length) {
    const sd = Math.sqrt(list.reduce((s, x) => s + (x.V - o.V) ** 2, 0) / (n - 1));
    const cv = o.V ? sd / o.V * 100 : 0; const t = T95[Math.min(n - 1, 30)];
    o.cv = cv; o.E = cv * t / Math.sqrt(n);

  }

  return o;
}

VIEWS.rilievo = () => {
  const p = prog(); const pa = part();
  if (sel.ril && ril()) return tallyView();
  const ps = partsOf(p.id);
  let h = `<div class="card"><h2>${TX('u')}</h2><div class="chips">${ps.map(x => `<button class="chip ${x.id === sel.part ? 'on' : ''}" onclick="A.selPart('${x.id}')">${TX('ga') && grpOf(x) ? esc(grpOf(x)) + '/' : ''}${esc(x.num)}${esc(x.sub || '')}</button>`).join('') || `<span class="muted">Crea prima le ${TX('uns')}.</span>`}</div></div>`;
  if (pa) {
    const all = rilOf(pa.id); const ops = [...new Set(S.rilievi.filter(r => r.progId === p.id && r.op).map(r => r.op))];
    const rs = sel.opf ? all.filter(r => r.op === sel.opf) : all;
    h += `<div class="card"><h2>Rilievi – ${esc(unitName(pa))}</h2>${incBar('part', pa)}`;
    if (ops.length > 1) h += `<div class="chips" style="margin-bottom:8px"><button class="chip ${!sel.opf ? 'on' : ''}" onclick="A.opFilter('')">Tutti</button>${ops.map(o => `<button class="chip ${sel.opf === o ? 'on' : ''}" onclick="A.opFilter(this.dataset.o)" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    h += `<div class="list">`;
    if (!rs.length) h += `<p class="muted">Nessun rilievo in ${TX('questa')}.</p>`;
    rs.forEach(r => {
      const n = Object.values(r.tally || {}).reduce((a, b) => a + b, 0);
      const par = r.tipo === 'ads' ? `r ${fmt(num(r.raggio), 2)} m` : r.tipo === 'rel' ? `BAF ${fmt(num(r.baf), 0)}` : `${fmt(num(r.sup) || num(pa.sup_bosc) || num(pa.sup_tot), 2)} ha`;
      const dur = r.t1 && r.t0 ? ` · ${Math.round((r.t1 - r.t0) / 60000)} min` : '';
      h += `<div class="it" onclick="A.openRil('${r.id}')"><div class="b"><b>${esc(rilName(r))}${incTag('ads', r)}</b><span class="muted">${par}${r.op ? ' · ' + esc(r.op) : ''} · ${n ? new Date(r.t0).toLocaleString('it-IT', {dateStyle: 'short', timeStyle: 'short'}) : 'pianificata'}${dur}${r.lat ? ' · ⌖' : ''}</span></div>${n ? `<span class="pill">${n} piante</span>` : `<span class="pill w">da rilevare</span>`}${r.lat != null && !n ? `<button class="btn sm sec" onclick="event.stopPropagation();sel.part='${pa.id}';go('mappa');setTimeout(()=>MA.navTo('${r.id}'),400)">➜</button>` : ''}</div>`;
    });
    h += `</div><div class="g3"><button class="btn" onclick="A.newRil('ads')">+ ADS</button><button class="btn sec" onclick="A.newRil('rel')">+ Relasc.</button><button class="btn sec" onclick="A.newRil('totale')">+ Totale</button></div></div>`;
  }
  $('#view').innerHTML = h;
};

function spOrder() { // specie più usate nel piano per prime
  const cnt = {}; S.rilievi.filter(r => r.progId === sel.prog).forEach(r => { for (const k in r.tally || {}) { const sp = k.split('|')[0]; cnt[sp] = (cnt[sp] || 0) + r.tally[k]; } });
  const used = Object.keys(cnt).filter(k => SP[k]).sort((a, b) => cnt[b] - cnt[a]);
  const rest = S.specie.map(s => s.id).filter(x => !used.includes(x));
  return {used, rest};
}
function classes(sp) {
  const p = prog(); const amp = num(p.amp) || 5; const cmin = num(p.cmin) || 10; let cmax = num(p.cmax) || 80;
  const r = ril(); for (const k in r.tally || {}) { const c = +k.split('|')[1]; if (c > cmax) cmax = c; }
  const out = []; for (let c = cmin; c <= cmax + 1e-9; c += amp) out.push(Math.round(c * 10) / 10); return out;
}
function tallyView() {
  const r = ril(); const pa = S.particelle.find(x => x.id === r.partId);

  const {used, rest} = spOrder();
  if (!sel.sp || !SP[sel.sp]) sel.sp = used[0] || S.specie[0].id;
  const shown = sel.allsp ? used.concat(rest) : used.concat(rest).slice(0, Math.max(8, used.length));
  if (!shown.includes(sel.sp)) shown.unshift(sel.sp);
  const tot = Object.values(r.tally || {}).reduce((a, b) => a + b, 0);
  let h = `<div class="tally-head">
    <div class="row" style="margin-bottom:8px"><button class="btn sec sm" onclick="A.closeRil()">← Rilievi</button>
      <div class="grow"><b>${esc(rilName(r))}</b> <span class="muted">${pa ? esc(unitName(pa)) : ''}</span></div>
      <span class="bigN" id="totN">${tot}</span><button class="btn sec sm" onclick="A.undo()" aria-label="Annulla ultimo">↶</button></div>
    ${incBar('ads', r)}<div class="stati">${Object.entries(STATI).map(([k, v]) => `<button data-s="${k}" class="${sel.st === k ? 'on' : ''}" onclick="A.setSt('${k}')">${v}</button>`).join('')}</div>
    <div class="spbar">${shown.map(id => `<button class="${id === sel.sp ? 'on' : ''}" onclick="A.setSp('${id}')">${esc(id)}<small>${esc(SP[id].nome.slice(0, 10))}</small></button>`).join('')}
      <button onclick="A.allSp()">${sel.allsp ? '−' : '+'}<small>${sel.allsp ? 'meno' : 'tutte'}</small></button></div>
  </div>
  <div class="dgrid" id="dgrid">${classes(sel.sp).map(c => `<button data-c="${c}">${c}<span class="n">${(r.tally || {})[`${sel.sp}|${c}|${sel.st}`] || ''}</span></button>`).join('')}</div>
  <p class="muted" style="margin:6px 0">Tocca = +1 · tieni premuto = −1 · stato attivo: <b>${STATI[sel.st]}</b></p>
  <div class="dict"><input id="dict" placeholder="Dettatura: FA32 CE27 41" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key==='Enter')A.dict()"><button class="btn" onclick="A.dict()">↵</button></div>
  <div class="card tally-sum" id="tsum"></div>
  <details class="sec"><summary>Parametri del rilievo</summary><div class="in">
    ${r.tipo === 'ads' ? `<div class="g2">${fld('rilievi', r, 'raggio', 'Raggio orizzontale (m)', 'n', 'onchange="A.rilParams(1)"')}${fld('rilievi', r, 'pend', 'Pendenza (%)', 'n', 'onchange="A.rilParams()"')}</div>
      <div class="g2">${fld('rilievi', r, 'rin', 'Raggio interno area concentrica (m)', 'n', 'onchange="A.rilParams(1)"')}${fld('rilievi', r, 'dsoglia', 'Diametro soglia per il cerchio interno (cm)', 'n', 'onchange="A.rilParams(1)"')}</div>
      <p class="muted" id="rinfo"></p><button class="btn sec sm" onclick="A.rilRule()">Usa il raggio del criterio ${TX('della')}</button>` : ''}
    ${r.tipo === 'rel' ? fld('rilievi', r, 'baf', 'Fattore di area basimetrica (BAF)', 'n') : ''}
    ${r.tipo === 'totale' ? fld('rilievi', r, 'sup', 'Superficie cavallettata (ha) – vuoto = superficie boscata ' + TX('della'), 'n') : ''}
    <p class="muted">${r.lat ? `Posizione: ${r.lat.toFixed(6)}, ${r.lon.toFixed(6)} (±${Math.round(r.acc || 0)} m)` : 'Posizione non rilevata'}</p>
    <button class="btn sec sm" onclick="A.gpsRil()">⌖ Rileva posizione</button>

  $('#view').innerHTML = h;
  bindGrid(); tallySum(); rilInfo();
}
function rilInfo() {
  const r = ril(); const el = $('#rinfo'); if (!el || !r) return;
  const rr = num(r.raggio) || 0; const p = num(r.pend) || 0; const a = Math.PI * rr * rr;
  const k = p ? 1 / Math.cos(Math.atan(p / 100)) : 1;
  const ri = num(r.rin), ds = num(r.dsoglia);
  const pa = S.particelle.find(x => x.id === r.partId); const x = ruleFor(prog(), pa);
  el.innerHTML = `Superficie ${fmt(a, 0)} m² (${fmt(a / 10000, 4)} ha).${p ? ` Sul terreno in pendenza misurare lungo la massima pendenza <b>${fmt(rr * k, 2)} m</b>.` : ''}`
    + (ri && ds ? `<br>Area concentrica: piante con d &lt; ${fmt(ds, 1)} cm solo entro <b>${fmt(ri, 2)} m</b>${p ? ` (${fmt(ri * k, 2)} m lungo la pendenza)` : ''}, ${fmt(Math.PI * ri * ri, 0)} m².` : '')
    + `<br>Criterio ${TX('della')}: ${esc(ruleLabel(x))} → ${fmt(x ? num(x.r) : num(prog().raggio) || 12.62, 2)} m${r.rman ? ' · <b>raggio scelto a mano</b>' : ''}.`;
}
function tallySum() {
  const r = ril(); const el = $('#tsum'); if (!el) return;
  const agg = {}; let tot = 0;
  for (const k in r.tally || {}) { const [sp, , st] = k.split('|'); const a = agg[sp] = agg[sp] || {V: 0, S: 0, M: 0, P: 0}; a[st] += r.tally[k]; tot += r.tally[k]; }
  const pa = S.particelle.find(x => x.id === r.partId); const o = rilPerHa(r, pa, curves());
  let h = `<table><tr><th>Specie</th><th>Vivi</th><th>Matr.</th><th>Poll.</th><th>Secchi</th></tr>`;
  Object.keys(agg).sort().forEach(sp => h += `<tr><td>${esc(sp)} ${esc((SP[sp] || {}).nome || '')}</td><td>${agg[sp].V || ''}</td><td>${agg[sp].M || ''}</td><td>${agg[sp].P || ''}</td><td>${agg[sp].S || ''}</td></tr>`);
  h += `</table><p class="muted" style="margin:8px 0 0">Stima: ${fmt(o.N, 0)} piante/ha · G ${fmt(o.G, 1)} m²/ha${o.V ? ` · V ${fmt(o.V, 0)} m³/ha` : ''}${o.miss.size ? ' · <b>mancano altezze</b>' : ''}</p>`;
  el.innerHTML = tot ? h : '<span class="muted">Nessuna pianta registrata.</span>';
  const t = $('#totN'); if (t) t.textContent = tot;
}
function bindGrid() {
  const g = $('#dgrid'); if (!g) return;
  let timer = null, fired = false, sx = 0, sy = 0, btn = null;
  g.addEventListener('pointerdown', e => {
    btn = e.target.closest('button'); if (!btn) return;
    fired = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { fired = true; A.inc(+btn.dataset.c, -1, btn); }, 550);
  });
  g.addEventListener('pointermove', e => { if (timer && (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12)) { clearTimeout(timer); timer = null; btn = null; } });
  g.addEventListener('pointerup', () => { if (timer) clearTimeout(timer); if (btn && !fired) A.inc(+btn.dataset.c, 1, btn); timer = null; btn = null; });
  g.addEventListener('pointercancel', () => { clearTimeout(timer); timer = null; btn = null; });
  g.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- ALTEZZE ---------- */
VIEWS.altezze = () => {
  const p = prog(); const {used, rest} = spOrder();
  const withH = [...new Set(S.altezze.filter(h => h.progId === p.id).map(h => h.sp))];
  const order = [...new Set(used.concat(withH))]; const list = order.length ? order : rest.slice(0, 8);
  if (!sel.hsp || !SP[sel.hsp]) sel.hsp = list[0];
  const H = S.altezze.filter(h => h.progId === p.id && h.sp === sel.hsp).sort((a, b) => b.t - a.t);
  const cur = curves(); const c = cur[sel.hsp];
  let h = `<div class="card"><h2>Altezze</h2>
    <div class="chips" style="margin-bottom:10px">${list.map(id => `<button class="chip ${id === sel.hsp ? 'on' : ''}" onclick="A.setHsp('${id}')">${esc(id)}</button>`).join('')}
      <select style="width:auto;min-height:40px;padding:6px" onchange="A.setHsp(this.value)"><option value="">altra…</option>${rest.filter(x => !list.includes(x)).map(x => `<option value="${x}">${esc(x)} ${esc(SP[x].nome)}</option>`).join('')}</select></div>
    <div class="g2"><label class="f"><span>Diametro (cm)</span><input id="hd" inputmode="decimal" onkeydown="if(event.key==='Enter')$('#hh').focus()"></label>
      <label class="f"><span>Altezza (m)</span><input id="hh" inputmode="decimal" onkeydown="if(event.key==='Enter')A.addH()"></label></div>
    <button class="btn block" onclick="A.addH()">Registra ${esc(SP[sel.hsp].nome)}</button>
    <p class="muted" style="margin-top:6px">${TX('u')}: ${part() ? esc(unitName(part())) : '— (seleziona in Rilievo)'} · ${H.length} misure per questa specie</p></div>
  <details class="sec"><summary>Ipsometro trigonometrico</summary><div class="in">
    <div class="g2"><label class="f"><span>Distanza (m)</span><input id="ipD" inputmode="decimal" oninput="A.ipso()"></label>
      <label class="f"><span>Distanza misurata</span><select id="ipT" onchange="A.ipso()"><option value="o">orizzontale</option><option value="i">inclinata (alla base)</option></select></label></div>
    <div class="g2"><label class="f"><span>Angolo alla vetta</span><input id="ipA" inputmode="decimal" oninput="A.ipso()"></label>
      <label class="f"><span>Angolo alla base (− se sotto)</span><input id="ipB" inputmode="decimal" oninput="A.ipso()"></label></div>
    <label class="f"><span>Unità</span><select id="ipU" onchange="A.ipso()"><option value="g">gradi</option><option value="p">percento</option></select></label>
    <div class="row"><span class="bigN" id="ipR">–</span><button class="btn sec sm" onclick="A.ipsoUse()">Usa come altezza</button></div></div></details>`;
  h += `<div class="card"><h3 style="margin-top:0">Curva ipsometrica ${esc(SP[sel.hsp].nome)}</h3>`;
  const pts = H.map(x => ({d: num(x.d), h: num(x.h)}));
  if (c) h += `<p class="muted">h = ${fmt(c.a, 3)} + ${fmt(c.b, 3)} · ln(d) · R² ${fmt(c.r2, 2)} · n ${c.n}</p>`;
  else h += `<p class="muted">Servono almeno 3 misure per la curva della specie; fino ad allora si usa la curva ${cur['*' + SP[sel.hsp].tipo] ? 'di tutte le ' + (SP[sel.hsp].tipo === 'C' ? 'conifere' : 'latifoglie') : cur['*'] ? 'di tutte le specie' : '(nessuna disponibile)'}.</p>`;
  h += chartHyp(pts, c) + `</div>`;
  if (H.length) {
    h += `<div class="card"><h3 style="margin-top:0">Misure</h3><div class="tw"><table><tr><th>Part.</th><th>d cm</th><th>h m</th><th>Oper.</th><th></th></tr>`;
    H.forEach(x => { const pa = S.particelle.find(q => q.id === x.partId); h += `<tr><td>${esc(pa ? pa.num : '')}</td><td>${fmt(num(x.d), 1)}</td><td>${fmt(num(x.h), 1)}</td><td class="muted">${esc(x.op || '')}</td><td><button class="chip" style="min-height:30px;padding:2px 10px" onclick="A.delH('${x.id}')">✕</button></td></tr>`; });
    h += `</table></div></div>`;
  }
  const keys = Object.keys(cur).filter(k => !k.startsWith('*'));
  if (keys.length) {
    h += `<div class="card"><h3 style="margin-top:0">Curve del piano</h3><div class="tw"><table><tr><th>Specie</th><th>n</th><th>a</th><th>b</th><th>R²</th><th>h(20)</th><th>h(40)</th></tr>`;
    keys.forEach(k => { const q = cur[k]; h += `<tr><td>${esc(k)}</td><td>${q.n}</td><td>${fmt(q.a, 2)}</td><td>${fmt(q.b, 2)}</td><td>${fmt(q.r2, 2)}</td><td>${fmt(q.a + q.b * Math.log(20), 1)}</td><td>${fmt(q.a + q.b * Math.log(40), 1)}</td></tr>`; });
    h += `</table></div></div>`;
  }
  $('#view').innerHTML = h;
};
function chartHyp(pts, c) {
  if (!pts.length) return '';
  const W = 320, H = 180, L = 30, B = 22;
  const dmax = Math.max(...pts.map(p => p.d), 40) * 1.08, hmax = Math.max(...pts.map(p => p.h), 20) * 1.1;
  const X = d => L + d / dmax * (W - L - 6), Y = h => H - B - h / hmax * (H - B - 6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="ax" x1="${L}" y1="${H - B}" x2="${W}" y2="${H - B}"/><line class="ax" x1="${L}" y1="0" x2="${L}" y2="${H - B}"/>`;
  for (let d = 10; d < dmax; d += 10) s += `<text x="${X(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  for (let h = 5; h < hmax; h += 5) s += `<text x="${L - 4}" y="${Y(h) + 3}" text-anchor="end">${h}</text>`;
  pts.forEach(p => s += `<circle class="pt" cx="${X(p.d)}" cy="${Y(p.h)}" r="3.5"/>`);
  if (c) { let path = ''; for (let d = 5; d <= dmax; d += 1) { const h = c.a + c.b * Math.log(d); if (h > 0) path += (path ? 'L' : 'M') + X(d).toFixed(1) + ',' + Y(h).toFixed(1); } s += `<path class="ln" d="${path}"/>`; }
  return s + `</svg><p class="muted" style="margin:2px 0 0">diametro (cm) → altezza (m)</p>`;
}

/* ---------- RISULTATI ---------- */
VIEWS.risultati = () => {
  const p = prog(); const ps = partsOf(p.id); const cur = curves();
  const rows = ps.map(x => ({x, s: partStats(x, cur)}));
  let T = {sup: 0, Vtot: 0, rip: 0};
  let h = `<div class="card"><h2>Riepilogo del piano</h2><div class="tw"><table><tr><th>${TX('ua')}</th><th>${TX('ga') || TX('g')}</th><th>Sup ha</th><th>Ril.</th><th>N/ha</th><th>G/ha</th><th>V/ha</th><th>E%</th><th>V tot m³</th><th>Ripresa m³</th></tr>`;
  rows.forEach(({x, s}) => {
    const sup = num(x.sup_bosc) || num(x.sup_tot) || 0; T.sup += sup;
    if (s) { T.Vtot += s.Vtot; T.rip += s.ripresa || 0; }
    h += `<tr onclick="A.resPart('${x.id}')"><td><b>${esc(x.num)}${esc(x.sub || '')}</b></td><td>${esc(grpOf(x))}</td><td>${fmt(sup, 2)}</td><td>${s ? s.n : 0}</td><td>${s ? fmt(s.N, 0) : '–'}</td><td>${s ? fmt(s.G, 1) : '–'}</td><td>${s ? fmt(s.V, 0) : '–'}</td><td>${s && s.E ? `<span class="${s.E > 15 ? 'pill w' : ''}">${fmt(s.E, 0)}</span>` : '–'}</td><td>${s ? fmt(s.Vtot, 0) : '–'}</td><td>${s && s.ripresa !== '' ? fmt(s.ripresa, 0) : '–'}</td></tr>`;
  });
  h += `<tr class="tot"><td>Totale</td><td></td><td>${fmt(T.sup, 2)}</td><td></td><td></td><td></td><td>${T.sup ? fmt(T.Vtot / T.sup, 0) : '–'}</td><td></td><td>${fmt(T.Vtot, 0)}</td><td>${fmt(T.rip, 0)}</td></tr></table></div>
    <p class="muted">E% = errore di campionamento sul volume a ettaro (probabilità 95%). V/ha totale = media ponderata sulla superficie.</p></div>`;
  const comp = {}; rows.forEach(({x, s}) => { const k = grpOf(x) || '—'; const c = comp[k] = comp[k] || {sup: 0, V: 0, rip: 0, n: 0}; c.n++; c.sup += num(x.sup_bosc) || num(x.sup_tot) || 0; if (s) { c.V += s.Vtot; c.rip += s.ripresa || 0; } });
  h += `<div class="card"><h2>Per ${TX('gn')}</h2><div class="tw"><table><tr><th>${TX('g')}</th><th>${TX('ua')}</th><th>Sup ha</th><th>Provvigione m³</th><th>V/ha</th><th>Ripresa m³</th></tr>`;
  for (const k in comp) { const c = comp[k]; h += `<tr><td>${esc(k)}</td><td>${c.n}</td><td>${fmt(c.sup, 2)}</td><td>${fmt(c.V, 0)}</td><td>${c.sup ? fmt(c.V / c.sup, 0) : '–'}</td><td>${fmt(c.rip, 0)}</td></tr>`; }
  h += `</table></div></div>`;
  const rp = rows.find(r => r.x.id === (sel.rpart || sel.part)) || rows.find(r => r.s);
  if (rp && rp.s) h += partDetail(rp.x, rp.s);
  $('#view').innerHTML = h;
};
function partDetail(x, s) {
  let h = `<div class="card"><h2>${esc(unitName(x))} – dettaglio</h2>`;
  if (s.miss.size) h += `<div class="warnbox">Nessuna curva ipsometrica per: ${[...s.miss].join(', ')}. Il volume di queste specie non è calcolato: registra almeno 3 altezze.</div>`;
  if (s.noArea) h += `<div class="warnbox">Cavallettamento totale senza superficie: inserisci la superficie ${TX('della')} o del rilievo.</div>`;
  if (s.E > 15) h += `<div class="warnbox">Errore di campionamento ${fmt(s.E, 1)}% (CV ${fmt(s.cv, 0)}%). Per scendere sotto il 15% servono circa ${s.nNeed} aree di saggio (ora ${s.n}).</div>`;
  h += `<p class="muted">${s.n} ${s.tipo === 'totale' ? 'cavallettamento totale' : 'unità di campionamento'} · ${s.trees} piante misurate · dg ${fmt(s.dg, 1)} cm${s.Ns ? ` · secchi ${fmt(s.Ns, 0)}/ha (${fmt(s.Vs, 0)} m³/ha)` : ''}</p>
  <div class="tw"><table><tr><th>Specie</th><th>N/ha</th><th>G m²/ha</th><th>V m³/ha</th><th>% V</th></tr>`;
  Object.entries(s.bySp).sort((a, b) => b[1].G - a[1].G).forEach(([sp, b]) => h += `<tr><td>${esc(sp)} ${esc((SP[sp] || {}).nome || '')}</td><td>${fmt(b.N, 0)}</td><td>${fmt(b.G, 2)}</td><td>${fmt(b.V, 1)}</td><td>${s.V ? fmt(b.V / s.V * 100, 0) : '–'}</td></tr>`);
  h += `<tr class="tot"><td>Totale</td><td>${fmt(s.N, 0)}</td><td>${fmt(s.G, 2)}</td><td>${fmt(s.V, 1)}</td><td>100</td></tr></table></div>
  <h3>Distribuzione diametrica (piante/ha)</h3>${chartDist(s.byC)}</div>`;

}
function chartDist(byC) {
  const cs = Object.keys(byC).map(Number).sort((a, b) => a - b); if (!cs.length) return '';
  const W = 320, H = 150, B = 20, L = 30; const max = Math.max(...Object.values(byC)); const bw = (W - L) / cs.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="ax" x1="${L}" y1="${H - B}" x2="${W}" y2="${H - B}"/>`;
  s += `<text x="${L - 4}" y="10" text-anchor="end">${Math.round(max)}</text>`;
  cs.forEach((c, i) => { const bh = byC[c] / max * (H - B - 8); s += `<rect class="bar" x="${L + i * bw + 1}" y="${H - B - bh}" width="${Math.max(1, bw - 2)}" height="${bh}" rx="2"/>`; if (cs.length < 14 || i % 2 === 0) s += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${c}</text>`; });
  return s + '</svg>';
}

async function out(name, content, mime, share) {
  const blob = new Blob([content], {type: mime});
  if (NATIVE) {
    try {
      const data = u8ToB64(new Uint8Array(await blob.arrayBuffer())); let uri = null, where = '';
      try { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: 'PAF Campo/' + name, data, directory: 'DOCUMENTS', recursive: true})).uri; where = 'Documenti/PAF Campo'; }
      catch (e) { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: name, data, directory: 'CACHE', recursive: true})).uri; }
      if (where) toast(`Salvato in ${where}/${name}`, 3500);
      if (share || !where) { try { await Capacitor.nativePromise('Share', 'share', {title: name, files: [uri], dialogTitle: 'Invia ' + name}); } catch (e) { if (!/cancel/i.test(e.message || '')) toast('Condivisione: ' + e.message, 3500); } }
      return true;
    } catch (e) { toast('Errore salvataggio: ' + e.message, 4000); return false; }
  }
  try {
    if (share) { const file = new File([blob], name, {type: mime}); if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return true; } toast('Condivisione non disponibile: scarico il file'); }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true;
  } catch (e) { if (e.name !== 'AbortError') toast('Errore: ' + e.message); return false; }
}

const optsOf = k => { const f = fieldDef(k); return f && f[3] ? f[3] : []; };

/* parametri da assegnare a una nuova area di saggio della particella */
function adsParams(p, pa) {

const ruleLabel = x => x ? [x.gov || 'qualsiasi governo', x.st, x.den && 'densità ' + x.den.toLowerCase()].filter(Boolean).join(' · ') : 'raggio predefinito del piano';

/* ============================================================
   PAF Campo — descrizione particellare a più mani
   Ogni operatore (e ogni area di saggio) registra la propria osservazione;
   la scheda della particella è la sintesi: media dei numeri, valore più
   frequente delle scelte, unione delle scelte multiple, testi affiancati.
   Nessuna osservazione viene sovrascritta da quella di un collega.
   ============================================================ */
const OSS_SEC = ['Fattori stazionali', 'Soprassuolo', 'Accessibilità e funzioni'];
const OSS_META = ['id', 'progId', 'partId', 'rilId', 'op', 'dev', 't', 'mod', 'fid'];
const DEV = (() => { let d = LS.get('paf-dev', ''); if (!d) { d = Math.random().toString(36).slice(2, 8); LS.set('paf-dev', d); } return d; })();
const opName = () => LS.get('paf-op', '') || (typeof QFC !== 'undefined' && QFC.user()) || 'Operatore ' + DEV.slice(0, 4);
const schedaOf = pid => (REGIONI[(S.progetti.find(p => p.id === pid) || {}).regione] || REGIONI.Basilicata).scheda;
/* campi osservabili: sezioni stazionali, soprassuolo, accessibilità + note di campo */
function ossFields(sch, withNote = true) {
  const f = sch.filter(s => OSS_SEC.includes(s.sec)).flatMap(s => s.f);
  if (withNote) sch.forEach(s => s.f.forEach(x => { if (x[0] === 'note') f.push(x); }));
  return f;
}
const isOss = (k, sch) => ossFields(sch || scheda()).some(f => f[0] === k);
const filled = v => !(v === '' || v == null || (Array.isArray(v) && !v.length));
const ossOf = paid => S.osservazioni.filter(o => o.partId === paid);
const ossData = o => { const d = {}; for (const k in o) if (!OSS_META.includes(k) && filled(o[k])) d[k] = o[k]; return d; };
function ossLabel(o) {
  if (o.op === 'Dati iniziali') return 'Dati iniziali';
  const r = o.rilId ? S.rilievi.find(x => x.id === o.rilId) : null;
  return (o.rilId ? (r ? rilName(r) : 'ADS') : 'Generale') + (o.op ? ' (' + o.op + ')' : '');
}
/* valore normalizzato per i confronti */
function nv(v, t) {
  if (t === 'm') return parseArr(v).filter(Boolean).slice().sort().join('|');
  if (t === 'n') { const x = num(v); return x === '' ? '' : String(Math.round(x * 1e6) / 1e6); }
  if (t === 'fix') return Object.keys(v || {}).filter(k => v[k]).sort().join('|');
  return v == null ? '' : String(v).trim();
}
const decs = v => { const s = String(v).replace(',', '.'); const i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; };

/* composizione "FA 70 CE 30": media delle percentuali per specie */
function composMean(vals) {
  const maps = vals.map(v => { const m = {}; let any = false; String(v).toUpperCase().replace(/([A-Z]{1,3})\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*%?/g, (_, sp, x) => { m[sp] = (m[sp] || 0) + parseFloat(x.replace(',', '.')); any = true; }); return any ? m : null; });
  if (maps.some(m => !m)) { const d = []; vals.forEach(v => { const s = String(v).trim(); if (s && !d.includes(s)) d.push(s); }); return d.join('; '); }
  const tot = {}; maps.forEach(m => { for (const k in m) tot[k] = (tot[k] || 0) + m[k]; });
  return Object.entries(tot).map(([k, s]) => [k, Math.round(s / maps.length)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0] + ' ' + x[1]).join(' ');
}

/* sintesi pura: dalle osservazioni ai valori della scheda */
function synth(obs, fields) {
  const out = {}, info = {};
  const os = obs.slice().sort((a, b) => (a.mod || a.t || 0) - (b.mod || b.t || 0));
  for (const [k, , t, opts] of fields) {
    const vals = os.map(o => ({o, v: o[k]})).filter(x => filled(x.v));
    if (!vals.length) continue;
    let v;
    if (t === 'n') {
      const xs = vals.map(x => num(x.v)).filter(x => x !== ''); if (!xs.length) continue;
      if (k === 'alt_min') v = Math.min(...xs);
      else if (k === 'alt_max' || k === 'ult_int') v = Math.max(...xs);
      else { const d = Math.max(...vals.map(x => decs(x.v))); const f = 10 ** Math.min(d, 3); v = Math.round(xs.reduce((a, b) => a + b, 0) / xs.length * f) / f; }
      v = String(v);
    } else if (t === 's') {
      const c = {}; vals.forEach((x, i) => { const e = c[x.v] = c[x.v] || {n: 0, last: 0}; e.n++; e.last = i; });
      v = Object.keys(c).sort((a, b) => c[b].n - c[a].n || c[b].last - c[a].last)[0];
    } else if (t === 'm') {
      const set = new Set(); vals.forEach(x => parseArr(x.v).forEach(y => set.add(y)));
      v = [...set]; if (opts) v.sort((a, b) => (opts.indexOf(a) + 1 || 999) - (opts.indexOf(b) + 1 || 999));
      if (vals.length > 1 && v.length > 1) v = v.filter(y => !['Nessuno', 'Assente'].includes(y));
    } else if (k === 'compos') v = composMean(vals.map(x => x.v));
    else if (t === 'a') v = vals.length > 1 ? vals.map(x => `${ossLabel(x.o)}: ${String(x.v).trim()}`).join('\n') : String(vals[0].v);
    else { const d = []; vals.forEach(x => { const s = String(x.v).trim(); if (s && !d.some(y => y.toLowerCase() === s.toLowerCase())) d.push(s); }); v = d.join('; '); }
    out[k] = v; info[k] = vals;
  }
  return {out, info};
}

/* applica la sintesi alla particella (i campi fissati a mano restano) */
async function ossApply(pa) {
  if (!pa) return false;
  const fields = ossFields(schedaOf(pa.progId));
  const obs = ossOf(pa.id);
  const {out} = synth(obs, fields);
  const fix = pa.fix || {}; const prev = pa.synk || [];

    const B = hRemote(b); if (H_F.every(([k, t]) => nv(x[k] ?? '', t) === nv(B[k], t))) { await dropS('altezze', id); rep.del++; rep.chg++; }
  }

  // divisione del lavoro
  if (tableCols(db, 'incarichi').length) { const ir = await incMerge(rows(db, 'incarichi'), p.id); rep.inc = ir.chg; rep.chg += ir.chg; }
  // sintesi delle descrizioni ricalcolata
  for (const pa of S.particelle.filter(x => x.progId === p.id && (touched.has(x.id) || ossOf(x.id).length || (x.synk || []).length))) if (await ossApply(pa)) rep.synth++;
  try { rep.layers = await readRifLayers(db, p); } catch (e) { console.warn('layer extra', e); rep.layers = 0; }
  db.close(); if (bdb) bdb.close();
  return {prog: p, rep};
}

const MANAGED = t => /^(gpkg_|rtree_|sqlite_)/i.test(t);
function tableCols(db, t) { try { const r = db.exec(`PRAGMA table_info("${t}")`); return r.length ? r[0].values.map(v => ({name: v[1], type: v[2]})) : []; } catch (e) { return []; } }
function mergeBase(db, schema, base, p) {
  const del = new Set(p.rif_del || []);
  const have = new Set(db.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values.map(v => v[0]));
  const bt = base.exec("SELECT name, sql FROM sqlite_master WHERE type='table'");
  if (!bt.length) return;
  db.run('BEGIN');
  for (const [t, sql] of bt[0].values) {
    if (MANAGED(t) || del.has(t)) continue;
    if (schema[t]) { // tabella gestita: conserva le colonne aggiunte in QGIS
      const mine = new Set(tableCols(db, t).map(c => c.name));
      const extra = tableCols(base, t).filter(c => !mine.has(c.name));
      if (!extra.length || !mine.has('uuid')) continue;
      extra.forEach(c => db.run(`ALTER TABLE "${t}" ADD COLUMN "${c.name}" ${c.type || ''}`));
      const rs = rows(base, t);
      rs.forEach(r => { if (r.uuid == null) return; db.run(`UPDATE "${t}" SET ${extra.map(c => `"${c.name}"=?`).join(',')} WHERE uuid=?`, [...extra.map(c => r[c.name] === undefined ? null : r[c.name]), r.uuid]); });
      continue;
    }
    if (have.has(t) || !sql) continue; // un layer dell'app con lo stesso nome è già stato scritto
    db.run(sql);
    const cols = tableCols(base, t).map(c => c.name);
    const st = base.prepare(`SELECT ${cols.map(c => `"${c}"`).join(',')} FROM "${t}"`);
    const ins = db.prepare(`INSERT INTO "${t}" (${cols.map(c => `"${c}"`).join(',')}) VALUES (${cols.map(() => '?').join(',')})`);
    while (st.step()) ins.run(st.get());
    st.free(); ins.free();
    const cont = base.exec(`SELECT table_name, data_type, identifier, description, last_change, min_x, min_y, max_x, max_y, srs_id FROM gpkg_contents WHERE table_name=?`, [t]);
    if (cont.length) {
      const row = cont[0].values[0]; const srs = row[9];
      if (srs != null && !db.exec('SELECT 1 FROM gpkg_spatial_ref_sys WHERE srs_id=?', [srs]).length) {
        const sr = base.exec('SELECT srs_name, srs_id, organization, organization_coordsys_id, definition, description FROM gpkg_spatial_ref_sys WHERE srs_id=?', [srs]);
        if (sr.length) db.run('INSERT INTO gpkg_spatial_ref_sys VALUES (?,?,?,?,?,?)', sr[0].values[0]);
      }
      try { db.run('INSERT INTO gpkg_contents VALUES (?,?,?,?,?,?,?,?,?,?)', row); } catch (e) { db.run('INSERT INTO gpkg_contents (table_name,data_type,identifier,srs_id) VALUES (?,?,?,?)', [row[0], row[1], row[0] + '_' + Date.now(), row[9]]); }
      const gc = base.exec('SELECT table_name, column_name, geometry_type_name, srs_id, z, m FROM gpkg_geometry_columns WHERE table_name=?', [t]);
      if (gc.length) db.run('INSERT INTO gpkg_geometry_columns VALUES (?,?,?,?,?,?)', gc[0].values[0]);
    }
  }
  db.run('COMMIT');
  const baseTables = new Set(bt[0].values.map(v => v[0]));
  if (p.rif_del && p.rif_del.some(t => !baseTables.has(t))) { p.rif_del = p.rif_del.filter(t => baseTables.has(t)); DB.put('progetti', p); }
}
/* scrive i layer di riferimento importati nell'app che il file sul cloud non ha ancora */
async function writeRifLayers(db, p, schema, base) {
  const inBase = new Set(base ? (base.exec("SELECT name FROM sqlite_master WHERE type='table'")[0] || {values: []}).values.map(v => v[0]) : []);
  const ls = S.layers.filter(l => l.progId === p.id && !inBase.has(l.table) && !schema[l.table] && l.feats.length);
  for (const l of ls) {
    const types = new Set(l.feats.map(f => f.g.type));
    const gname = types.size === 1 ? [...types][0].toUpperCase() : 'GEOMETRY';
    const used = new Set(['fid', 'geom']); const cols = [];
    l.fields.forEach(f => { let c = String(f).replace(/"/g, '').slice(0, 60) || 'campo'; while (used.has(c.toLowerCase())) c += '_'; used.add(c.toLowerCase()); const v = l.feats.map(x => x.p[f]).find(x => x != null && x !== ''); cols.push({src: f, name: c, type: typeof v === 'number' ? 'REAL' : typeof v === 'boolean' ? 'INTEGER' : 'TEXT'}); });
    db.run(`CREATE TABLE "${l.table}" (fid INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, geom ${gname}${cols.map(c => `, "${c.name}" ${c.type}`).join('')})`);
    const ext = [Infinity, Infinity, -Infinity, -Infinity];
    db.run('BEGIN');
    const ins = db.prepare(`INSERT INTO "${l.table}" (geom${cols.map(c => `, "${c.name}"`).join('')}) VALUES (?${cols.map(() => ',?').join('')})`);
    l.feats.forEach(f => {
      const g = GEO.toSrs(f.g); const b = GEO.bbox(g); ext[0] = Math.min(ext[0], b[0]); ext[1] = Math.min(ext[1], b[1]); ext[2] = Math.max(ext[2], b[2]); ext[3] = Math.max(ext[3], b[3]);
      ins.run([GEO.writeGPKG(g, SRS), ...cols.map(c => { const v = f.p[c.src]; return v == null || v === '' ? null : typeof v === 'boolean' ? +v : v; })]);
    });
    ins.free(); db.run('COMMIT');
    db.run('INSERT INTO gpkg_contents (table_name,data_type,identifier,description,min_x,min_y,max_x,max_y,srs_id) VALUES (?,?,?,?,?,?,?,?,?)', [l.table, 'features', l.name + ' (' + l.table + ')', 'Layer importato in PAF Campo', ...ext, SRS]);
    db.run('INSERT INTO gpkg_geometry_columns VALUES (?,?,?,?,0,0)', [l.table, 'geom', gname, SRS]);
  }
}
/* legge i layer non gestiti presenti nel GeoPackage (aggiunti in QGIS o importati nell'app) */
async function readRifLayers(db, p) {
  const r = db.exec("SELECT c.table_name, g.column_name, g.srs_id FROM gpkg_contents c JOIN gpkg_geometry_columns g ON g.table_name=c.table_name WHERE c.data_type='features'");
  const found = new Set(); let n = 0;
  const managed = new Set(Object.keys(gpkgSchema((REGIONI[p.regione] || REGIONI.Basilicata).scheda)));
  for (const [t, gcol, srs] of (r[0] || {values: []}).values) {
    if (managed.has(t) || MANAGED(t) || (p.rif_del || []).includes(t)) continue;
    let fn;
    try {
      if (CRS[srs] || FAST_UTM33.includes(+srs) || FAST_GEO.includes(+srs)) fn = await toWgs(srs);
      else { const d = db.exec('SELECT definition FROM gpkg_spatial_ref_sys WHERE srs_id=?', [srs]); if (!d.length) continue; fn = await toWgs(d[0].values[0][0]); }
    } catch (e) { console.warn('SR non gestito per', t, srs); continue; }
    const st = db.prepare(`SELECT * FROM "${t}" LIMIT 50000`); const feats = []; const cols = st.getColumnNames();
    while (st.step()) {
      const v = st.get(); const row = {}; let geom = null;
      cols.forEach((c, i) => { if (c === gcol) geom = v[i]; else if (!(v[i] instanceof Uint8Array)) row[c] = v[i]; });
      const gg = geom ? GEO.readGPKG(geom) : null; if (!gg || !gg.g) continue;
      try { feats.push({g: GEO.mapCoords(gg.g, fn), p: row}); } catch (e) {}
    }
    st.free();
    const id = p.id + ':' + t; found.add(id);
    const old = S.layers.find(x => x.id === id);
    const ct = db.exec('SELECT identifier FROM gpkg_contents WHERE table_name=?', [t]);
    const name = old ? old.name : ((ct[0] && ct[0].values[0][0]) || t).replace(/ \(rif_[^)]*\)$/, '');
    await saveLayer({id, progId: p.id, table: t, name, gtype: feats[0] ? feats[0].g.type : 'Point', fields: cols.filter(c => c !== gcol && c !== 'fid'), feats, color: old ? old.color : LCOL[layersOf(p.id).length % LCOL.length], visible: old ? old.visible : true, source: 'gpkg'});
    n++;
  }
  for (const l of layersOf(p.id).filter(l => l.source === 'gpkg' && !found.has(l.id))) { S.layers = S.layers.filter(x => x.id !== l.id); await DB.del('layers', l.id); }
  return n;
}

/* App Android: le tessere viste vengono salvate sul telefono (Cache API) e riusate senza rete */
let _CTL = null, _tileN = 0;
async function tileGet(url) {
  const c = await caches.open('paf-tiles'); const hit = await c.match(url);
  if (hit) return hit.blob();
  const r = await fetch(url, {mode: 'cors'}); if (!r.ok) throw new Error('tile ' + r.status);
  await c.put(url, r.clone());
  if (++_tileN % 200 === 0) c.keys().then(ks => { if (ks.length > 8000) ks.slice(0, ks.length - 8000).forEach(k => c.delete(k)); });
  return r.blob();
}
function cachedTileLayer() {
  if (_CTL) return _CTL;
  _CTL = L.TileLayer.extend({
    createTile(coords, done) {
      const img = document.createElement('img'); img.alt = ''; img.setAttribute('role', 'presentation');
      const url = this.getTileUrl(coords);
      tileGet(url).then(b => { const u = URL.createObjectURL(b); img.onload = () => { URL.revokeObjectURL(u); done(null, img); }; img.onerror = e => done(e, img); img.src = u; })
        .catch(() => { img.onload = () => done(null, img); img.onerror = e => done(e, img); img.src = url; });
      return img;
    }
  });
  return _CTL;
}

    catch (e) { throw new Error((fname || 'Il file') + ' non è un GeoPackage valido'); }
    for (const [t, ident, gcol, srs] of (r[0] || {values: []}).values) {
      if (MANAGED(t)) continue;
      let code = +srs, def = '';
      try { const d = db.exec('SELECT organization, organization_coordsys_id, definition FROM gpkg_spatial_ref_sys WHERE srs_id=?', [srs]); if (d.length) { const [org, oid, dd] = d[0].values[0]; if (/epsg/i.test(org || '') && oid > 0) code = +oid; def = dd || ''; } } catch (e) {}

        const v = st.get(); const p = {}; let geom = null;

      const feats = []; raw.forEach(f => { try { feats.push({g: GEO.mapCoords(f.g, fn), p: f.p}); } catch (e) {} });
      out.push({name: ident || t, feats, fields: cols.filter(c => c !== gcol && c !== 'fid'), gtype: feats[0] ? feats[0].g.type : 'Point', crs: 4326, crsFrom: 'gpkg', crsLabel: CRS[code] ? `${CRS[code][0]} (EPSG:${code})` : code > 0 ? 'EPSG:' + code : 'stimato', src: fname});

        all.set(head, 0); all.set(body.file, head.length); all.set(tail, head.length + body.file.length);

      } else if (body) { h['Content-Type'] = 'application/json'; o.data = body; }
      let r;
      try { r = await Capacitor.nativePromise('CapacitorHttp', 'request', o); }
      catch (e) { throw new Error('QFieldCloud non raggiungibile (' + (e.message || 'rete assente') + ').'); }
      status = r.status; data = r.data; text = typeof data === 'string' ? data : JSON.stringify(data);
      if (status >= 200 && status < 300) {

      else if (body) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
      let r;
      try { r = await fetch(url, {method, headers: h, body: b}); }
      catch (e) { throw new Error(ponte() ? 'Ponte o QFieldCloud non raggiungibili (' + (e.message || 'rete assente') + '). Controlla la connessione e l\'indirizzo del ponte.' : 'Dal sito web serve il ponte verso QFieldCloud: impostalo in Altro → QFieldCloud (oppure usa l\'app Android).'); }

      if (r.ok) { if (bin) return new Uint8Array(await r.arrayBuffer()); return status === 204 ? null : r.json(); }

    }

    throw new Error(`QFieldCloud ${status}: ${String(text || '').slice(0, 200)}`);
  },
  async login(user, pass) { const d = await QFC.req('POST', 'auth/login/', {username: user, password: pass}); LS.set('qfc-token', d.token); LS.set('qfc-user', d.username || user); return d; },
  async logout() { try { await QFC.req('POST', 'auth/logout/'); } catch (e) {} LS.set('qfc-token', ''); },
  projects: () => QFC.req('GET', 'projects/'),
  create: (name, owner) => QFC.req('POST', 'projects/', {name, owner, description: 'Piano di assestamento forestale – PAF Campo', is_public: false}),
  files: pid => QFC.req('GET', `files/${pid}/`),
  download: (pid, name) => QFC.req('GET', `files/${pid}/${String(name).split('/').map(encodeURIComponent).join('/')}/`, null, true),
  upload: (pid, name, data, mime = 'application/octet-stream') => QFC.req('POST', `files/${pid}/${encodeURIComponent(name)}/`, {file: data instanceof Uint8Array ? data : new Uint8Array(data), name, mime}),
  package: pid => QFC.req('POST', 'jobs/', {project_id: pid, type: 'package'})

const fileSig = (files, n) => { const f = files.find(x => x.name === n); return f ? (f.md5sum || f.sha256 || '') + '|' + (f.last_modified || f.size || '') : ''; };

/* Sincronizzazione: 1) scarica il GeoPackage dal cloud e unisce le modifiche fatte in QField
   2) carica il GeoPackage aggiornato con i dati dell'app, solo se nel frattempo nessuno ha modificato il file. */
async function qfcSync(prog, log = () => {}, force = true) {
  const pid = prog.qfc_pid;
  if (!pid) throw new Error('Piano non collegato a un progetto QFieldCloud.');
  let files = await QFC.files(pid), chg = 0, synth = 0;
  for (let tent = 0; tent < 3; tent++) {
    const sig = fileSig(files, GPKG_FILE);
    if (sig && sig !== prog.qfc_sig) {
      log('Scarico ' + GPKG_FILE + '…');
      const u8 = await QFC.download(pid, GPKG_FILE);
      const {rep} = await importGpkg(u8, prog.id, {base: await syncBaseGet(prog.id), force: true}); chg += rep.chg; synth += rep.synth;
      await syncBaseSet(prog.id, u8); prog.qfc_sig = sig;
      log(`Dal cloud: ${rep.particelle[0]} particelle nuove, ${rep.ads[0]} aree di saggio nuove, ${rep.altezze} altezze nuove, ${rep.oss} descrizioni, ${rep.del} eliminazioni, ${rep.chg} elementi aggiornati.`);
    }
    const t0 = Date.now();
    const local = !sig || !prog.qfc_last || synth > 0 || LS.get('paf-lastmod', 0) > prog.qfc_last;
    const needQgs = !files.some(x => /^PAF_rilievi\.qg[sz]$/.test(x.name));
    if (local || force || needQgs) {
      log('Preparo il GeoPackage aggiornato…');
      const out = await exportGpkg(prog.id);
      files = await QFC.files(pid);
      if (fileSig(files, GPKG_FILE) !== sig) { log('Il file sul cloud è cambiato proprio ora: ripeto l\'unione.'); prog.qfc_sig = ''; continue; }
      log('Carico su QFieldCloud…');
      await QFC.upload(pid, GPKG_FILE, out, 'application/geopackage+sqlite3');
      await gpkgBaseSet(prog.id, out); await syncBaseSet(prog.id, out);
      if (needQgs) {
        log('Carico il progetto QGIS…');
        const q = await (await fetch('./PAF_rilievi.qgz')).arrayBuffer();
        await QFC.upload(pid, 'PAF_rilievi.qgz', q, 'application/zip');
      }
      try { await QFC.package(pid); } catch (e) {}
      files = await QFC.files(pid);
    } else log('Nessuna modifica locale da inviare.');
    prog.qfc_sig = fileSig(files, GPKG_FILE); prog.qfc_last = t0; prog.qfc_err = ''; await DB.put('progetti', prog);
    log('Sincronizzazione completata. In QField premi "Sincronizza" per ricevere i dati.');
    return chg;
  }
  throw new Error('Il file sul cloud continua a cambiare (QField sta sincronizzando?). Riprovo più tardi.');
}

/* Collega un progetto del cloud: scarica il piano sul telefono di un nuovo operatore,
   ritrova il piano già presente (stesso identificativo) oppure collega quello aperto. */
async function qfcLink(pid, name, log = () => {}) {
  const files = await QFC.files(pid); const sig = fileSig(files, GPKG_FILE); const cur = prog();
  const link = async p => { p.qfc_pid = pid; p.qfc_name = name; await save('progetti', p); return p; };
  if (!sig && files.some(f => /\.(qgs|qgz|gpkg|shp|geojson)$/i.test(f.name) && !/^PAF_rilievi\.qg[sz]$/i.test(f.name)))
    throw new Error(`Il progetto "${name}" non è stato creato da PAF Campo: non lo collego per non modificarlo. Per portarne i dati nel piano usa "Importa dati da un altro progetto".`);
  if (!sig) { if (!cur) throw new Error('Il progetto sul cloud è vuoto: crea prima il piano sul telefono, poi collegalo.'); cur.qfc_sig = ''; cur.qfc_last = 0; return link(cur); }
  log('Scarico ' + GPKG_FILE + '…');
  const u8 = await QFC.download(pid, GPKG_FILE);
  const SQL = await sqlJs(); const db = new SQL.Database(u8); const pr = rows(db, 'piano')[0]; db.close();
  const same = pr && pr.uuid && S.progetti.find(x => x.id === pr.uuid);
  const empty = x => !S.particelle.some(q => q.progId === x.id) && !S.rilievi.some(q => q.progId === x.id);
  let target;
  if (same) target = same;
  else if (!cur || empty(cur) || !confirm(`Il progetto "${name}" contiene un piano diverso da "${cur.nome}". Unire i dati del cloud nel piano aperto?\n\nAnnulla = scarica il piano del cloud come piano separato.`)) {
    const {prog: p, rep} = await importGpkg(u8, null); target = p;
    log(`Piano scaricato: ${rep.particelle[0]} particelle, ${rep.ads[0]} aree di saggio, ${rep.altezze} altezze, ${rep.oss} descrizioni.`);
    if (cur && empty(cur) && cur.id !== p.id && /^Nuovo piano$/.test(cur.nome || '') && !cur.qfc_pid) { await remove('progetti', cur.id); }
    target.qfc_sig = sig; target.qfc_last = Date.now(); await syncBaseSet(target.id, u8);
    return link(target);
  } else target = cur;
  // unione nel piano esistente
  const {rep} = await importGpkg(u8, target.id, {force: true, base: target.qfc_pid === pid ? await syncBaseGet(target.id) : null});
  log(`Uniti: ${rep.particelle[0]} particelle nuove, ${rep.ads[0]} aree di saggio nuove, ${rep.altezze} altezze nuove.`);
  target.qfc_sig = sig; target.qfc_last = 0; await syncBaseSet(target.id, u8);
  return link(target);
}

/* ---------- Sincronizzazione automatica (solo app Android) ---------- */
const AUTO = {busy: false, dirty: false, last: 0, timer: null, errAt: 0};
const autoOn = () => NET() && LS.get('qfc-auto', true) && !!QFC.token();
function syncBadge(state) {
  const el = document.getElementById('sync'); if (!el) return;
  el.hidden = !NET() || !QFC.token();
  el.textContent = {run: '☁ …', ok: '☁ ✓', err: '☁ !', wait: '☁ •'}[state] || '☁';
  el.title = {run: 'Sincronizzazione in corso', ok: 'Sincronizzato', err: 'Ultima sincronizzazione non riuscita', wait: 'Modifiche da inviare'}[state] || '';
}
async function autoSync(force) {
  if (!autoOn() || AUTO.busy || !navigator.onLine) { if (AUTO.dirty) syncBadge('wait'); return; }
  const ps = S.progetti.filter(p => p.qfc_pid);
  if (!ps.length) return;
  if (!force && !AUTO.dirty && Date.now() - AUTO.last < 10 * 60e3) return;
  if (!force && Date.now() - AUTO.errAt < 2 * 60e3) return;
  AUTO.busy = true; AUTO.dirty = false; syncBadge('run');
  let ok = true, chg = 0;
  for (const p of ps) {
    try { chg += await qfcSync(p, () => {}, false); }
    catch (e) { ok = false; p.qfc_err = e.message; try { await DB.put('progetti', p); } catch (x) {} console.warn('autosync', e); }
  }
  AUTO.busy = false; AUTO.last = Date.now(); if (!ok) AUTO.errAt = Date.now();
  syncBadge(ok ? (AUTO.dirty ? 'wait' : 'ok') : 'err');
  if (!chg) return;
  toast(`☁ ${chg} aggiornamenti ricevuti da QField`, 2500);
  if (sel.view === 'mappa') { if (M.map && M.lyrP) drawLayers(false); }
  else if (['piano', 'particelle', 'altro'].includes(sel.view) && !document.querySelector('input:focus,textarea:focus,select:focus')) go(sel.view);
}
function autoMark() { if (!NET()) return; AUTO.dirty = true; syncBadge('wait'); clearTimeout(AUTO.timer); AUTO.timer = setTimeout(() => autoSync(), 45e3); }
function autoStart() {
  if (!NET() || AUTO.started) return; AUTO.started = true;
  syncBadge(AUTO.dirty ? 'wait' : '');
  addEventListener('online', () => setTimeout(() => autoSync(true), 3000));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); else if (AUTO.dirty) autoSync(true); });
  setInterval(() => autoSync(), 3 * 60e3);
  setTimeout(() => autoSync(true), 4000);
}

/* Importa i dati di un progetto QFieldCloud qualsiasi (fatto a mano in QGIS/QField) nel piano aperto.
   Il progetto sul cloud viene solo letto: nessun file viene caricato o modificato. */
const MB = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
const QFC_MAXMB = 120;
/* elenco dei file importabili di un progetto QFieldCloud (GeoPackage, shapefile raggruppati, GeoJSON) */
async function qfcOtherFiles(pid) {
  const files = await QFC.files(pid); const out = [];
  files.filter(f => /\.(gpkg|geojson)$/i.test(f.name)).forEach(f => out.push({key: f.name, names: [f.name], size: +f.size || 0}));
  files.filter(f => /\.shp$/i.test(f.name)).forEach(f => {
    const base = f.name.slice(0, -4).toLowerCase();
    const parts = files.filter(x => x.name.toLowerCase().startsWith(base + '.') && /\.(shp|dbf|prj|cpg)$/i.test(x.name));
    out.push({key: f.name, names: parts.map(x => x.name), size: parts.reduce((a, x) => a + (+x.size || 0), 0)});
  });
  return out;
}
async function qfcReadOther(pid, list, log = () => {}) {
  const sets = [];
  for (const it of list) {
    if (it.size > QFC_MAXMB * 1048576) { log(`${it.key}: ${MB(it.size)}, troppo grande per il telefono. Saltato.`); continue; }
    if (/\.gpkg$/i.test(it.key)) {
      log(`Scarico ${it.key} (${MB(it.size)})…`);
      const u8 = await QFC.download(pid, it.key);
      log(`Leggo i layer di ${it.key}…`); await new Promise(r => setTimeout(r, 30));
      const ds = await readGpkgAny(u8, it.key.split('/').pop(), log);
      log(`${it.key}: ${ds.length} layer con geometrie.`); sets.push(...ds);
    } else {
      const blobs = [];
      for (const n of it.names) { log('Scarico ' + n + '…'); const u8 = await QFC.download(pid, n); blobs.push({name: n.split('/').pop(), arrayBuffer: async () => u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)}); }
      try { sets.push(...(await readVector(blobs))); } catch (e) { log(it.key + ': ' + e.message); }
    }
  }
  return sets;
}

/* ============================================================
   Divisione del lavoro in squadra (comune a PAF Campo e Martellata Campo)
   Ogni unità di lavoro (particella / area / area di saggio) può essere:
   assegnata dal capo squadra, presa in carico da un operatore, completata, libera.
   I record viaggiano nel GeoPackage (tabella "incarichi") con la sincronizzazione.
   Regole di unione: vince la modifica più recente; se due operatori prendono la stessa
   unità senza rete, la tiene chi l'ha presa per primo; un rilascio vale solo per chi la teneva.
   ============================================================ */
const IS_PAF = 'progetti' in S;
const SQ = IS_PAF ? {
  proj: () => prog(), projKey: 'progId',
  kinds: {
    part: {lab: () => TX('un'), list: pid => partsOf(pid), name: x => unitName(x), parent: null, store: 'particelle'},
    ads: {lab: () => 'area di saggio', list: pid => S.rilievi.filter(r => r.progId === pid).sort((a, b) => (a.n || 0) - (b.n || 0)), name: r => rilName(r), parent: r => ['part', S.particelle.find(p => p.id === r.partId)], store: 'rilievi'}
  },
  top: 'part',

    : store === 'osservazioni' ? (o.rilId ? ['ads', S.rilievi.find(r => r.id === o.rilId)] : ['part', S.particelle.find(p => p.id === o.partId)]) : null,
  ops: pid => [].concat(S.rilievi.filter(r => r.progId === pid).map(r => r.op), S.osservazioni.filter(o => o.progId === pid).map(o => o.op), S.altezze.filter(h => h.progId === pid).map(h => h.op)),
  last: (pid, op) => Math.max(0, ...S.rilievi.filter(r => r.progId === pid && r.op === op).map(r => r.mod || r.t1 || r.t0 || 0), ...S.osservazioni.filter(o => o.progId === pid && o.op === op).map(o => o.mod || o.t || 0))
} : {
  proj: () => lot(), projKey: 'lottoId',
  kinds: {
    area: {lab: () => 'area', list: lid => areeOf(lid).filter(a => a.tipo !== 'Area esclusa'), name: a => a.nome || 'Area', parent: null, store: 'aree'},
    ads: {lab: () => 'area di saggio', list: lid => adsOf(lid), name: a => 'AS' + (a.n ?? ''), parent: a => ['area', S.aree.find(x => x.id === a.areaId)], store: 'ads'}
  },
  top: 'area',
  touch: (store, o) => store === 'piante' ? (o.areaId ? ['area', S.aree.find(a => a.id === o.areaId)] : null) : store === 'ads' ? ['ads', o]
    : store === 'adsril' ? ['ads', S.ads.find(a => a.id === o.adsId)] : null,
  ops: lid => [].concat(S.piante.filter(x => x.lottoId === lid).map(x => x.op), S.ads.filter(x => x.lottoId === lid).map(x => x.op)),
  last: (lid, op) => Math.max(0, ...S.piante.filter(x => x.lottoId === lid && x.op === op).map(x => x.mod || x.t || 0), ...S.ads.filter(x => x.lottoId === lid && x.op === op).map(x => x.mod || x.t || 0))

const INC_ST = {assegnato: 'assegnata', corso: 'in corso', fatto: 'completata', libero: 'libera'};
const incHeld = s => s === 'assegnato' || s === 'corso' || s === 'fatto';
const OPCOL = ['#1f77b4', '#d62728', '#2ca02c', '#9467bd', '#ff7f0e', '#17becf', '#8c564b', '#e377c2'];
const opColor = op => { let h = 0; for (const c of String(op || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return OPCOL[h % OPCOL.length]; };

const sqCapo = () => !!LS.get('sq-capo', false);
const sqAuto = () => LS.get('sq-auto', true);
const sqOn = p => !!(p && (p.qfc_pid || sqCapo() || S.incarichi.some(x => x.projId === p.id && x.stato !== 'libero')));
/* incarico che vale per l'elemento: il suo, altrimenti quello dell'unità che lo contiene */
function incEff(kind, el) {
  if (!el) return null;
  const r = incOf(el.id); if (r && incHeld(r.stato)) return Object.assign({own: true}, r);
  const k = SQ.kinds[kind]; if (!k || !k.parent) return null;
  const [pk, pe] = k.parent(el) || []; if (!pe) return null;
  const pr = incOf(pe.id); return pr && incHeld(pr.stato) ? Object.assign({own: false, pkind: pk, pel: pe}, pr) : null;
}
async function incSet(kind, el, stato, op) {
  const p = SQ.proj(); const me = opName(); const old = incOf(el.id) || {};
  const r = {id: el.id, projId: el[SQ.projKey] || (p && p.id), kind, nome: SQ.kinds[kind].name(el), op: stato === 'libero' ? '' : (op || me), stato, da: stato === 'assegnato' ? me : (old.da || ''),
    tp: stato === 'corso' && old.stato !== 'corso' ? Date.now() : (old.tp || (stato === 'corso' ? Date.now() : 0)), prev: old.op || '', t: Date.now()};

}
/* chiamata da save(): prende in carico in automatico ciò su cui si inizia a lavorare */
const INC_BUSY = new Set();
function incTouch(store, o) {
  try {
    if (!sqAuto() || !o) return; const t = SQ.touch(store, o); if (!t || !t[1]) return;
    const [kind, el] = t; const p = SQ.proj(); if (!p || !p.qfc_pid || el[SQ.projKey] !== p.id) return;
    if (INC_BUSY.has(el.id)) return;

  const quando = h.mod ? ' (' + new Date(h.mod).toLocaleString('it-IT', {dateStyle: 'short', timeStyle: 'short'}) + ')' : '';
  const msg = h.stato === 'fatto' ? `${nm} è già stata completata da ${h.op}${quando}.` : h.stato === 'assegnato' ? `${nm} è assegnata a ${h.op} dal capo squadra.` : `${nm} è in carico a ${h.op}${quando}.`;
  if (!confirm(msg + '\n\nPer evitare doppioni lavora su un\'altra unità. Vuoi lavorarci comunque?')) return false;

}

}
/* barra "chi ci lavora" nella scheda dell'unità */
function incBar(kind, el) {
  const p = SQ.proj(); if (!el || !sqOn(p)) return '';

const INC_COLS = [['uuid', 'TEXT'], ['mod_ts', 'INTEGER'], ['tipo', 'TEXT'], ['nome', 'TEXT'], ['operatore', 'TEXT'], ['stato', 'TEXT'], ['assegnato_da', 'TEXT'], ['t_presa', 'INTEGER'], ['prec', 'TEXT'], ['data', 'TEXT']];
function incRows(pid) {
  return S.incarichi.filter(x => x.projId === pid).map((x, i) => ({fid: i + 1, uuid: x.id, mod_ts: x.mod || x.t || 0, tipo: x.kind, nome: x.nome || null, operatore: x.op || null, stato: x.stato, assegnato_da: x.da || null, t_presa: x.tp || null, prec: x.prev || null, data: new Date(x.mod || x.t || Date.now()).toISOString()}));
}
/* unisce gli incarichi del cloud; restituisce quante modifiche e le unità perse da questo operatore */
async function incMerge(rs, pid) {
  let chg = 0; const lost = []; const me = opName();
  for (const r of rs) {
    if (!r.uuid) continue;
    const x = {id: r.uuid, projId: pid, kind: r.tipo || '', nome: r.nome || '', op: r.operatore || '', stato: INC_ST[r.stato] ? r.stato : 'libero', da: r.assegnato_da || '', tp: r.t_presa || 0, prev: r.prec || '', mod: r.mod_ts || 0, t: r.mod_ts || 0};
    const l = incOf(x.id);
    if (!l) { await putS('incarichi', x); chg++; continue; }
    if ((l.mod || 0) === x.mod && l.op === x.op && l.stato === x.stato) continue;
    let win = x.mod > (l.mod || 0) ? x : l;
    if (x.stato === 'corso' && l.stato === 'corso' && x.op !== l.op) win = (x.tp || x.mod) <= (l.tp || l.mod) ? x : l; // prese in contemporanea: vince la prima
    const older = win === x ? l : x;
    if (!['corso', 'assegnato'].includes(win.stato) && win.prev && incHeld(older.stato) && older.op && older.op !== win.prev && older.stato !== 'fatto') win = older; // rilascio di un incarico che nel frattempo era passato ad altri
    if (win === x) { if (l.op === me && ['corso', 'assegnato'].includes(l.stato) && x.op && x.op !== me) lost.push(x); await putS('incarichi', x); chg++; }
  }
  if (lost.length) setTimeout(() => toast(`Attenzione: ${lost.map(x => x.nome).join(', ')} ${lost.length > 1 ? 'erano già state prese' : 'era già stata presa'} da ${[...new Set(lost.map(x => x.op))].join(', ')}`, 6000), 300);
  return {chg, lost};
}

    }
    if (k === 'compart') {

      C.push(cap(`Tabella ${nc}.1 – Comparti colturali e unità colturali.`));
      const fuori = Object.entries(g).filter(([kk, l]) => kk !== '—' && (s2 => s2 < 10 || s2 > 30)(l.reduce((a, x) => a + (num(x.sup_tot) || 0), 0))).map(([kk]) => kk);
      if (fuori.length) C.push(P(`[Motivare la superficie dei comparti ${fuori.join(', ')}, esterna all'intervallo 10–30 ha indicato dalle Linee guida.]`, {i: true}));
