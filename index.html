    }
    if (k === 'registro') {
      C.push(...paras(txt(k)));
      C.push(T(['Anno', 'Tipo di intervento', 'Atti amministrativi', 'Esecutore', 'Movimentazione finanziaria', 'Avvenimenti non programmati'], [['', '', '', '', '', ''], ['', '', '', '', '', ''], ['', '', '', '', '', '']]));
      C.push(cap(`Tabella ${nc}.1 – Schema del registro di gestione (libro economico).`));
      continue;
    }
    if (k === 'premessa') { C.push(...paras(txt(k))); C.push(H('Riferimenti normativi', 2)); NORME_NAZ.concat(reg.norme).forEach(n => C.push(new D.Paragraph({text: n, bullet: {level: 0}}))); continue; }
    if (k === 'inquadramento') {
      C.push(...paras(txt(k)));
      const cv = mapPng(p.id);
      if (cv) { const data = await new Promise(r => cv.toBlob(b => b.arrayBuffer().then(r), 'image/png')); C.push(new D.Paragraph({children: [new D.ImageRun({data: new Uint8Array(data), transformation: {width: 600, height: 412}})], alignment: D.AlignmentType.CENTER})); C.push(cap(`Figura 1 – ${TX('carta', p)} (confini, numerazione e aree di saggio).`)); }
      C.push(T([TX('u', p), 'Località', GL, 'Sup. totale ha', 'Sup. boscata ha', 'Sup. cartografica ha'],
        ps.map(x => [x.num + (x.sub || ''), x.localita || '', gOf(x), f2(num(x.sup_tot)), f2(num(x.sup_bosc)), x.geom ? f2(GEO.areaHa(x.geom)) : '']),
        ['Totale', '', '', f2(ps.reduce((s, x) => s + (num(x.sup_tot) || 0), 0)), f2(ps.reduce((s, x) => s + (num(x.sup_bosc) || 0), 0)), f2(ps.reduce((s, x) => s + (x.geom ? GEO.areaHa(x.geom) : 0), 0))]));
      C.push(cap(`Tabella ${nc}.1 – Superfici delle ${TX('uns', p)}.`));
      continue;
    }
    if (k === 'vegetazione') {
      C.push(...paras(txt(k)));
      const g = {}; ps.forEach(x => { const key = (x.categoria || 'n.d.') + '|' + (x.governo || 'n.d.'); g[key] = (g[key] || 0) + supOf(x); });
      const tot = Object.values(g).reduce((a, b) => a + b, 0);
      C.push(T(['Categoria forestale', 'Governo', 'Superficie ha', '%'], Object.entries(g).sort((a, b) => b[1] - a[1]).map(([kk, s]) => { const [c1, g1] = kk.split('|'); return [c1, g1, f2(s), tot ? f1(s / tot * 100) : '']; }), ['Totale', '', f2(tot), '100']));
      C.push(cap(`Tabella ${nc}.1 – Ripartizione per categoria forestale e governo.`));
      continue;
    }
    if (k === 'metodo') {
      const rs = S.rilievi.filter(r => r.progId === p.id && Object.keys(r.tally || {}).length);
      const nA = rs.filter(r => r.tipo === 'ads').length, nR = rs.filter(r => r.tipo === 'rel').length, nT = rs.filter(r => r.tipo === 'totale').length;
      const alberi = rs.reduce((s, r) => s + Object.values(r.tally).reduce((a, b) => a + b, 0), 0);
      const amp = num(p.amp) || 5, cmin = num(p.cmin) || 10;
      C.push(H(`${nc}.1 ${cal ? 'Cartografia' : 'Compartimentazione e cartografia'}`, 2));
      C.push(P(`La superficie è stata suddivisa in ${cal ? `${new Set(ps.map(gOf).filter(Boolean)).size} comparti colturali e ${ps.length} unità colturali` : `${ps.length} particelle forestali`}, delimitate su base cartografica e con rilievo GPS in campo. Le geometrie sono gestite in ambiente GIS (QGIS/QField) in un GeoPackage nel sistema di riferimento WGS84 / UTM fuso 33N (EPSG:32633); le superfici cartografiche sono calcolate nel piano della proiezione.`));
      C.push(H(`${nc}.2 Rilievi dendrometrici`, 2));
      const parts = [];
      if (nA) {
        const grp = {}; rs.filter(r => r.tipo === 'ads').forEach(r => { const pa = S.particelle.find(x => x.id === r.partId); const k = `${num(r.raggio)}|${num(r.rin) || ''}|${num(r.dsoglia) || ''}`; (grp[k] = grp[k] || {n: 0, tipi: new Set()}).n++; if (pa && (pa.governo || pa.stadio)) grp[k].tipi.add([pa.governo, pa.stadio].filter(Boolean).join(', ').toLowerCase()); });
        const desc = Object.entries(grp).sort((a, b) => b[1].n - a[1].n).map(([k, g]) => { const [rr, ri, ds] = k.split('|').map(Number); return `${g.n} di raggio ${f2(rr)} m (${f0(Math.PI * rr * rr)} m²)${ri ? `, concentriche con cerchio interno di ${f2(ri)} m per i diametri inferiori a ${f0(ds)} cm` : ''}${g.tipi.size ? ` nei soprassuoli ${[...g.tipi].join('; ')}` : ''}`; });
        parts.push(`${nA} aree di saggio circolari a raggio fisso, con raggio scelto in funzione della forma di governo e delle caratteristiche del soprassuolo (${desc.join('; ')}); il raggio è stato corretto in funzione della pendenza`);
      }
      if (nR) parts.push(`${nR} punti di campionamento relascopico (BAF ${f0(num(p.baf) || 2)})`);
      if (nT) parts.push(`${nT} cavallettamenti totali`);
      C.push(P(`Sono stati eseguiti ${parts.join(', ') || '[descrivere i rilievi]'}, per un totale di ${alberi} piante misurate. Le aree di saggio sono state disposte secondo una griglia sistematica con origine casuale all'interno di ciascuna ${cal ? 'unità colturale, per ogni comparto e tipologia colturale,' : 'particella'} e raggiunte con navigazione GPS. Il diametro a 1,30 m è stato rilevato con cavalletto dendrometrico e registrato in classi di ${f0(amp)} cm, con soglia di cavallettamento di ${f1(cmin - amp / 2)} cm; per ogni pianta sono stati annotati specie e stato (viva, secca, matricina, pollone).`));
      C.push(H(`${nc}.3 Curve ipsometriche`, 2));
      const keys = Object.keys(cur).filter(x => !x.startsWith('*'));
      C.push(P(`Le altezze sono state misurate con ipsometro su un campione di piante e perequate con la funzione h = a + b·ln(d). Per le specie con meno di tre misure si è utilizzata la curva del gruppo (conifere o latifoglie).`));
      if (keys.length) { C.push(T(['Specie', 'n', 'a', 'b', 'R²', 'h(20 cm)', 'h(40 cm)'], keys.map(x => { const q = cur[x]; return [(SP[x] || {}).nome || x, q.n, fmt(q.a, 3), fmt(q.b, 3), fmt(q.r2, 2), f1(q.a + q.b * Math.log(20)), f1(q.a + q.b * Math.log(40))]; }))); C.push(cap(`Tabella ${nc}.1 – Parametri delle curve ipsometriche.`)); }
      C.push(H(`${nc}.4 Cubatura e stima della fitomassa`, 2));
      C.push(P('Il volume del fusto e dei rami grossi è stato calcolato albero per albero con le equazioni a doppia entrata dell\'Inventario Nazionale delle Foreste e dei Serbatoi forestali di Carbonio (INFC 2005; Tabacchi et al., 2011), nella forma v = b1 + b2·d²·h (+ b3·d), in funzione del diametro e dell\'altezza stimata dalla curva ipsometrica. Con le equazioni INFC della fitomassa arborea epigea si è stimata la biomassa e il carbonio immagazzinato (frazione di carbonio 0,5; CO₂ = C × 44/12).'));
      const used = [...new Set(rs.flatMap(r => Object.keys(r.tally).map(k2 => k2.split('|')[0])))];
      C.push(T(['Specie', 'Equazione INFC', 'b1', 'b2', 'b3'], used.map(x => { const s = SP[x] || {}; const q = volCoeff(x); return [s.nome || x, q.src, fmt(q.b[0], 4), fmt(q.b[1], 6), q.b[2] != null ? fmt(q.b[2], 4) : '–']; })));
      C.push(cap(`Tabella ${nc}.2 – Coefficienti delle equazioni di cubatura adottate (volume in dm³).`));
      C.push(H(`${nc}.5 Elaborazione`, 2));
      C.push(P(`Per ogni area di saggio i valori sono riportati all'ettaro; la stima ${cal ? 'per unità colturale' : 'particellare'} è la media delle unità di campionamento, con errore di campionamento calcolato al 95% di probabilità (t di Student) sul volume a ettaro. Per i cavallettamenti totali i valori sono riferiti alla superficie boscata.`));
      if (txt(k)) C.push(...paras(txt(k)));
      continue;
    }
    if (k === 'comprese') {
      C.push(...paras(txt(k)));
      const comp = {}; ps.forEach(x => (comp[gOf(x) || '—'] = comp[gOf(x) || '—'] || []).push(x));
      const rowsC = Object.entries(comp).map(([c, list]) => { const sup = list.reduce((s, x) => s + supOf(x), 0); const V = list.reduce((s, x) => s + (stats[x.id] ? stats[x.id].Vtot : 0), 0); return [c, list.length, f2(sup), f0(V), sup ? f0(V / sup) : '–']; });
      C.push(T([GL, TX('us', p), 'Superficie ha', 'Provvigione m³', 'm³/ha'], rowsC)); C.push(cap(`Sintesi per ${TX('gn', p)}.`));
      C.push(T([UA, TX('ga', p) || GL, 'Sup. ha', 'Ril.', 'N/ha', 'G m²/ha', 'dg cm', 'V m³/ha', 'E %', 'V tot m³'],
        ps.map(x => { const s = stats[x.id]; return [x.num + (x.sub || ''), gOf(x), f2(supOf(x)), s ? s.n : 0, s ? f0(s.N) : '–', s ? f1(s.G) : '–', s ? f1(s.dg) : '–', s ? f0(s.V) : '–', s && s.E ? f1(s.E) : '–', s ? f0(s.Vtot) : '–']; })));
      C.push(cap(`Parametri dendrometrici per ${TX('un', p)}.`));
      for (const [c, list] of Object.entries(comp)) {
        const agg = {}; let supT = 0;
        list.forEach(x => { const s = stats[x.id]; const sp = supOf(x); if (!s) return; supT += sp; for (const k2 in s.bySp) { const a = agg[k2] = agg[k2] || {N: 0, G: 0, V: 0}; a.N += s.bySp[k2].N * sp; a.G += s.bySp[k2].G * sp; a.V += s.bySp[k2].V * sp; } });
        if (!supT) continue;
        C.push(H(`${GL} ${c}`, 2));
        const Vt = Object.values(agg).reduce((s, a) => s + a.V, 0);
        C.push(T(['Specie', 'N/ha', 'G m²/ha', 'V m³/ha', '% V'], Object.entries(agg).sort((a, b) => b[1].V - a[1].V).map(([k2, a]) => [(SP[k2] || {}).nome || k2, f0(a.N / supT), f2(a.G / supT), f1(a.V / supT), Vt ? f1(a.V / Vt * 100) : '–'])));
        C.push(cap(`Composizione ${cal ? 'del comparto' : 'della compresa'} ${c} (valori medi ponderati sulla superficie).`));
      }
      continue;
    }
    if (k === 'interventi') {
      C.push(...paras(txt(k)));
      const L2 = ps.filter(x => x.intervento).sort((a, b) => (num(a.anno_int) || 9999) - (num(b.anno_int) || 9999) || byNum(a, b));
      let totR = 0, totS = 0;
      const rowsI = L2.map(x => { const s = stats[x.id]; const r = s && s.ripresa !== '' ? s.ripresa : ''; if (r !== '') totR += r; totS += supOf(x); return [x.anno_int || '–', (cal && gOf(x) ? gOf(x) + ' / ' : '') + x.num + (x.sub || ''), x.intervento, x.priorita || '', f2(supOf(x)), x.prelievo ? f0(num(x.prelievo)) : '–', r !== '' ? f0(r) : '–']; });
      if (rowsI.length) { C.push(T(['Anno', cal ? 'C.C. / U.C.' : 'Part.', 'Intervento', 'Priorità', 'Sup. ha', 'Prelievo %', 'Ripresa m³'], rowsI, ['Totale', '', '', '', f2(totS), '', f0(totR)])); C.push(cap(`Tabella ${nc}.1 – Piano degli interventi.`)); }
      const du = num(p.durata) || 10;
      C.push(P(`La ripresa complessiva nel periodo di validità è stimata in ${f0(totR)} m³, pari a una ripresa media annua di ${f0(totR / du)} m³.`));
      continue;
    }
    if (k === 'viabilita') {
      C.push(...paras(txt(k)));
      const r = ps.filter(x => x.viab || x.esbosco || x.dist_str);
      if (r.length) { C.push(T([UA, 'Viabilità', 'Distanza da strada m', 'Esbosco'], r.map(x => [x.num + (x.sub || ''), x.viab || '', x.dist_str || '', x.esbosco || '']))); C.push(cap(`Tabella ${nc}.1 – Accessibilità delle ${TX('uns', p)}.`)); }
      continue;
    }
    if (k === 'ambiente') {
      C.push(...paras(txt(k)));
      let B = 0, sup = 0; ps.forEach(x => { const s = stats[x.id]; if (s) { B += s.B * supOf(x); sup += supOf(x); } });
      if (sup) C.push(P(`La fitomassa arborea epigea stimata con le equazioni INFC è di circa ${f0(B)} t di sostanza secca (${f0(B / sup)} t/ha), corrispondenti a ${f0(B * 0.5)} t di carbonio e ${f0(B * 0.5 * 44 / 12)} t di CO₂ equivalente immagazzinate nel soprassuolo.`));

  }

  // Allegato A – registro particellare
  C.push(new D.Paragraph({children: [new D.PageBreak()]}));
  C.push(H('Allegato A – ' + TX('reg', p)));
  let lastG = null;
  for (const x of ps) {

        const {n, rowsA, rowsD} = compTables(p, lastG, cur); const d = compData(p, lastG);

        C.push(P(`a. Quadro delle unità colturali (${n.us.length} U.C., ${f2(n.sup)} ha)`, {b: true})); C.push(T(HEAD_A, rowsA));
        COMP_F.forEach(([k2, l], i) => { if (d[k2]) { C.push(P(l, {b: true})); C.push(...paras(d[k2])); } });
        C.push(P('d. Piano degli interventi colturali', {b: true})); if (rowsD.length) C.push(T(HEAD_D, rowsD)); else C.push(P('—'));
        C.push(P(`g. Ripresa legnosa a ettaro: ${n.ripHa !== '' ? f1(n.ripHa) + ' m³/ha riferiti all\'anno di intervento' : '—'}`, {b: true}));
      }
    }
    C.push(H(`${unitName(x, p)}${x.localita ? ' – ' + x.localita : ''}`, cal ? 3 : 2));
    const kv = [];
    reg.scheda.forEach(sec => { if (sec.sec === 'Descrizione') return; sec.f.forEach(([k2, l]) => { const v = x[k2]; const s = Array.isArray(v) ? v.join(', ') : parseArr(v).length > 1 && String(v).startsWith('{') ? parseArr(v).join(', ') : v; if (s !== '' && s != null && !(Array.isArray(s) && !s.length)) kv.push([l, String(s)]); }); });
    if (kv.length) { const half = Math.ceil(kv.length / 2); const rowsK = []; for (let i = 0; i < half; i++) rowsK.push([kv[i][0], kv[i][1], kv[i + half] ? kv[i + half][0] : '', kv[i + half] ? kv[i + half][1] : '']); C.push(new D.Table({width: {size: 100, type: D.WidthType.PERCENTAGE}, rows: rowsK.map(r => new D.TableRow({children: r.map((c, i) => cell(c, {l: true, b: i % 2 === 1}))}))})); }
    const s = stats[x.id];
    if (s) { C.push(P('')); C.push(T(['Specie', 'N/ha', 'G m²/ha', 'V m³/ha'], Object.entries(s.bySp).sort((a, b) => b[1].G - a[1].G).map(([k2, b]) => [(SP[k2] || {}).nome || k2, f0(b.N), f2(b.G), f1(b.V)]), ['Totale', f0(s.N), f2(s.G), f1(s.V)])); }
    if (x.descr) C.push(P(x.descr));
    if (x.prescr) C.push(P('Prescrizioni: ' + x.prescr, {i: true}));
  }
  // Allegato B – distribuzione diametrica
  C.push(new D.Paragraph({children: [new D.PageBreak()]}));
  C.push(H(`Allegato B – Distribuzione diametrica per ${TX('un', p)} (piante/ha)`));
  const allC = [...new Set(ps.flatMap(x => stats[x.id] ? Object.keys(stats[x.id].byC).map(Number) : []))].sort((a, b) => a - b);
  if (allC.length) C.push(T([UA].concat(allC.map(String)).concat(['Tot.']), ps.filter(x => stats[x.id]).map(x => [x.num + (x.sub || '')].concat(allC.map(c => stats[x.id].byC[c] ? f0(stats[x.id].byC[c]) : '')).concat([f0(stats[x.id].N)]))));

  const doc = new D.Document({
    creator: p.tecnico || 'PAF Campo', title: p.nome, description: 'Relazione tecnica del Piano di Assestamento Forestale',
    features: {updateFields: true},
    styles: {default: {document: {run: {font: F, size: 22}}},
      paragraphStyles: [{id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: {size: 30, bold: true, color: '2F6B2A', font: F}, paragraph: {spacing: {before: 360, after: 160}}},
        {id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: {size: 25, bold: true, color: '1B2419', font: F}, paragraph: {spacing: {before: 240, after: 120}}}]},
    sections: [{properties: {page: {margin: {top: 1134, bottom: 1134, left: 1134, right: 1134}}},
      headers: {default: new D.Header({children: [new D.Paragraph({children: [new D.TextRun({text: `${p.nome || ''} – Relazione tecnica`, size: 16, color: '5D6B58'})], alignment: D.AlignmentType.RIGHT})]})},
      footers: {default: new D.Footer({children: [new D.Paragraph({children: [new D.TextRun({children: ['Pag. ', D.PageNumber.CURRENT, ' di ', D.PageNumber.TOTAL_PAGES], size: 16})], alignment: D.AlignmentType.CENTER})]})},
      children: C}]
  });
  return D.Packer.toBlob(doc);
}
