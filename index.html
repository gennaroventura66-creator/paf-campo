<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b2a">
<title>Martellata Campo</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>window.PAF_PWA=true</script>
<style>:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1b2419; --muted:#5d6b58; --line:#d7ddd2;
  --acc:#2f6b2a; --acc-ink:#ffffff; --acc-soft:#e3efdf; --warn:#a15c00; --warn-soft:#fff1dc;
  --bad:#b3261e; --dead:#6d5a4b; --mat:#1f5f8b; --pol:#7a4d9c;
  --r:12px; --tap:56px;
  font-size:16px;
}
:root[data-theme="dark"]{
  --bg:#0f140e; --card:#182017; --ink:#eef3ea; --muted:#a3b19c; --line:#2d3a2a;
  --acc:#7cc46f; --acc-ink:#0b1409; --acc-soft:#223320; --warn:#f0b35a; --warn-soft:#2e2413;
  --bad:#ff8a80; --dead:#c8ad96; --mat:#7cc0f0; --pol:#c9a4ea;
}
:root[data-theme="sun"]{ /* alto contrasto per pieno sole */
  --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#222; --line:#000;
  --acc:#003d00; --acc-ink:#ffffff; --acc-soft:#dcffd6; --warn:#6b3a00; --warn-soft:#ffe8b0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--acc);color:var(--acc-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top .t{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:.78rem;opacity:.85;display:block;font-weight:500}
header.top button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-size:.85rem}
main{padding:12px 14px;max-width:900px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(8,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;color:var(--muted);padding:8px 0 10px;font-size:.58rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav.bottom button .i{font-size:1.35rem;line-height:1}
nav.bottom button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:1.15rem;margin:4px 0 12px}
h3{font-size:1rem;margin:14px 0 8px}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:0 16px;min-height:48px;font:inherit;font-weight:600}
.btn.sec{background:transparent;color:var(--acc)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem}
.btn.block{width:100%}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
.list .it.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.list .it .b{flex:1;min-width:0}
.list .it .b b{display:block}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-size:.9rem;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"▾";color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 14px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.78rem}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;max-width:90vw}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:10px}

/* ---- Cavallettamento ---- */
.tally-head{position:sticky;top:52px;z-index:15;background:var(--bg);padding:8px 0 6px}
.stati{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stati button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:.85rem}
.stati button.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.stati.d2{grid-template-columns:1fr 1fr}
.stati button.on[data-s=V]{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.stati button.on[data-s=S]{border-color:var(--dead);background:var(--dead);color:#fff}
.stati button.on[data-s=M]{border-color:var(--mat);background:var(--mat);color:#fff}
.stati button.on[data-s=P]{border-color:var(--pol);background:var(--pol);color:#fff}
.spbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.spbar button{flex:0 0 auto;min-width:64px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;padding:4px 8px;line-height:1.05}
.spbar button small{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.spbar button.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.spbar button.on small{color:var(--acc-ink)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dgrid button{position:relative;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.45rem;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dgrid button .n{position:absolute;right:6px;top:4px;font-size:.8rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:99px;padding:1px 7px}
.dgrid button .n:empty{display:none}
.dgrid button.flash{background:var(--acc);color:var(--acc-ink)}
.dgrid button.flashm{background:var(--bad);color:#fff}
.tally-sum{font-size:.85rem}
.dict{display:flex;gap:6px;margin:8px 0}
.dict input{font-size:1.2rem;font-weight:700;text-transform:uppercase}
.bigN{font-size:1.6rem;font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .bar{fill:var(--acc)}
.chart .pt{fill:var(--acc);opacity:.65}
.chart .ln{stroke:var(--warn);stroke-width:2;fill:none}
.chart .ax{stroke:var(--line)}

/* ---- Stampa ---- */
#print{display:none}
@media print{
  body{padding:0;background:#fff;color:#000}
  body.printing header.top, body.printing nav.bottom, body.printing main{display:none!important}
  body.printing #print{display:block}
  #print{font-family:Georgia,"Times New Roman",serif;font-size:10.5pt;color:#000}
  #print .pp{page-break-after:always}
  #print h1{font-size:15pt;margin:0 0 4pt}
  #print h2{font-size:12pt;margin:10pt 0 4pt;border-bottom:1px solid #000}
  #print table{font-size:9pt}
  #print th,#print td{border-bottom:1px solid #999;color:#000}
  #print .kv{display:grid;grid-template-columns:1fr 1fr;gap:1pt 14pt}
  #print .kv div{border-bottom:1px dotted #bbb;padding:1pt 0}
  #print .kv b{font-weight:600}
}
@media (min-width:700px){ .dgrid{grid-template-columns:repeat(6,1fr)} }

/* ---- Mappa ---- */
.maptools{position:absolute;top:8px;left:8px;right:8px;z-index:500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.mbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 8px #0002}
.mbar .btn.sm{min-height:40px;padding:0 10px}
.mtb{flex-wrap:nowrap}.mtb .btn.sm{flex:1;padding:0 4px;font-size:.8rem;min-width:0;white-space:nowrap}
.mappanel{position:absolute;left:8px;right:8px;bottom:12px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px #0003}
.navarrow{font-size:2.6rem;line-height:1;color:var(--acc);width:52px;text-align:center;transition:transform .3s;transform-origin:50% 50%}
.plabel{background:#ffffffd9;border:1px solid #1b2419;border-radius:6px;padding:1px 6px;font-weight:800;font-size:13px;color:#1b2419;white-space:nowrap;transform:translate(-50%,-50%)}
.leaflet-tooltip.adslabel{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:800;font-size:10px;padding:0}
.leaflet-tooltip.adslabel::before{display:none}
.leaflet-popup-content{font-size:14px;line-height:1.45}
.leaflet-popup-content .btn{margin-top:6px}
.leaflet-container{font:inherit}
[hidden]{display:none!important}
.oh{font-size:.78rem;margin:-8px 0 10px;white-space:pre-wrap}
/* Martellata Campo */
.stati.d3,.tally-head .stati{grid-template-columns:repeat(3,1fr)}
.stati button.on.dT{border-color:var(--bad);background:var(--bad);color:#fff}
.stati button.on.dM{border-color:var(--mat);background:var(--mat);color:#fff}
.stati button.on.dR{border-color:var(--warn);background:var(--warn);color:#fff}
.kpv{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:1rem;min-width:88px;text-align:center;cursor:pointer}
.kpv b{font-size:1.5rem}
.kpv.on{border-color:var(--acc);background:var(--acc-soft)}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kpad button{min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.6rem;font-weight:700}
.kpad button:active{background:var(--acc-soft)}
.btn.big{min-height:62px;font-size:1.15rem}
table.pl tr{cursor:pointer}
.clsgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.clsgrid button{position:relative;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:700}
.clsgrid button b{position:absolute;top:2px;right:5px;font-size:.72rem;color:var(--acc)}
.clsgrid button.has{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.clsgrid button.minus{border-style:dashed;color:#c0392b}
@media(max-width:360px){.clsgrid{grid-template-columns:repeat(4,1fr)}}
#bign{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,40,18,.92);color:#fff;text-align:center;padding:24px}
#bign.on{display:flex}
#bign .bn{font-size:min(38vw,200px);font-weight:900;line-height:1;letter-spacing:-.02em}
#bign .bn.x{color:#ffb4a8}
#bign .bs{margin-top:18px;font-size:1.25rem;opacity:.9}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:6px 0}
.chk input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--acc)}
</style>
</head>
<body>
<header class="top">
  <div class="t" id="hdr">Martellata Campo<span class="sub" id="hdrsub">Martellata e matricinatura</span></div>
  <span id="sync" class="pill" hidden style="background:#fff3;color:inherit;margin-right:6px;cursor:pointer" onclick="go('altro')"></span><span id="net" class="pill" style="background:#fff3;color:inherit"></span>
</header>
<main id="view"></main>
<nav class="bottom" id="nav">
  <button data-v="lotti"><span class="i">▦</span>Lotti</button>
  <button data-v="mappa"><span class="i">⌖</span>Mappa</button>
  <button data-v="martella"><span class="i">⚒</span>Martella</button>
  <button data-v="elenco"><span class="i">☰</span>Piedilista</button>
  <button data-v="saggi"><span class="i">◯</span>Saggi</button>
  <button data-v="cubatura"><span class="i">⇕</span>Cubatura</button>
  <button data-v="riepilogo"><span class="i">Σ</span>Riepilogo</button>
  <button data-v="altro"><span class="i">⋯</span>Altro</button>
</nav>
<div id="print"></div>

function parseArr(s) {
  if (Array.isArray(s)) return s;
  if (s == null || s === '') return [];

  if (!s.startsWith('{')) return s.split(/\s*[,;]\s*/).filter(Boolean);
  const out = []; let cur = '', q = false, esc = false, any = false;
  for (const ch of s.slice(1, -1)) {
    if (esc) { cur += ch; esc = false; continue; }
    if (ch === '\\') { esc = true; continue; }
    if (ch === '"') { q = !q; any = true; continue; }
    if (ch === ',' && !q) { out.push(cur); cur = ''; any = false; continue; }
    cur += ch; any = true;
  }

  const ex = areeOf(l.id).filter(x => x.geom && x.tipo === 'Area esclusa');
  const s = a.reduce((t, x) => t + GEO.areaHa(x.geom), 0) - ex.reduce((t, x) => t + GEO.areaHa(x.geom), 0);
  return s > 0 ? Math.round(s * 10000) / 10000 : '';
}
function stats(l, filt) {

  const rows = pianteOf(l.id).filter(x => !filt || filt(x)).map(x => ({x, c: treeCalc(l, x, cur)}));
  const agg = (list) => { const o = {n: 0, g: 0, v: 0, b: 0, q: 0, miss: 0, vmiss: 0}; list.forEach(({c}) => { o.n++; o.g += c.g; if (c.v == null) o.vmiss++; else o.v += c.v; if (c.b != null) o.b += c.b; if (c.q != null) o.q += c.q; if (c.h == null) o.miss++; }); return o; };

  return {rows, cur, amp, tot: agg(rows), bySp: by(rows, r => r.x.sp), byC: by(rows, r => classOf(r.c.d, amp)), bySpC: by(rows, r => r.x.sp + '|' + classOf(r.c.d, amp)),
    byEta: by(rows, r => r.x.eta || '—'), bySpEta: by(rows, r => r.x.sp + '|' + (r.x.eta || '—')), byArea: by(rows, r => r.x.areaId || '')};
}

function checks(l) {

  const grp = (SP[spPrev] || {}).grp;
  if (ceduo) {
    const turno = num((N.turni || {})[grp]);
    if (turno) { const eta = num(l.eta); out.push({ok: !eta ? null : eta >= turno, t: `Turno minimo per ${GRUPPI[grp] || grp}: ${turno} anni${eta ? ` · età del ceduo ${eta} anni` : ' · indica l\'età del ceduo'}`}); }
    const esente = (N.esenti || []).includes(grp);
    const min = composto ? num(N.composto) : grp === 'castagno' ? num(N.matrCastagno) : num(N.matr);
    if (esente) out.push({ok: true, t: `${GRUPPI[grp]}: ceduo senza obbligo di matricine`});

    else if (min) out.push({ok: null, t: `Matricine: minimo ${min}/ha · indica la superficie del lotto per la verifica`});
    if (num(N.matr2T) && M.length && !esente) { const k = M.filter(x => ['2T', '3T', '≥4T'].includes(x.eta)).length; const p = k / M.length * 100; out.push({ok: p >= num(N.matr2T), t: `Matricine di età ≥ 2 turni: ${fmt(p, 0)}% · minimo ${N.matr2T}%`}); }

    if (N.periodo) out.push({ok: null, t: `Periodo di taglio dei cedui: ${N.periodo}`});

/* posizione continua mentre si martella */
const TG = {watch: null, pos: null};
function treeGpsStart() {
  if (TG.watch != null || !navigator.geolocation) return;
  TG.watch = navigator.geolocation.watchPosition(p => { TG.pos = p.coords; const e = $('#gacc'); if (e) e.textContent = '±' + Math.round(p.coords.accuracy) + ' m'; }, () => {}, {enableHighAccuracy: true, maximumAge: 5000, timeout: 30000});
}
function treeGpsStop() { if (TG.watch != null) { navigator.geolocation.clearWatch(TG.watch); TG.watch = null; } }

function dupWarn(l) {
  const c = {}; pianteOf(l.id).forEach(x => { if (num(x.n) !== '') c[x.n] = (c[x.n] || 0) + 1; });

  return d.length ? `<div class="warnbox">Numeri ripetuti: ${d.slice(0, 20).map(esc).join(', ')}${d.length > 20 ? '…' : ''}. Controlla la numerazione (ogni operatore può partire da un numero diverso: Altro → Squadra).</div>` : '';
}

/* ---------- CUBATURA: altezze e tavole ---------- */
VIEWS.cubatura = () => {
  const l = lot(); const cur = curves(l.id); const {used} = spOrder(); const hs = S.altezze.filter(x => x.lottoId === l.id).sort((a, b) => (b.t || 0) - (a.t || 0));
  const spL = [...new Set(used.concat(hSample(l.id).map(p => p.sp)))];
  let h = `<div class="card"><h2>Altezze</h2><p class="muted">Misura alcune altezze per specie (sulle piante martellate, dal modulo della pianta, oppure su alberi campione qui sotto). Con almeno 3 misure l'app costruisce la curva ipsometrica h = a + b·ln(d); altrimenti usa l'altezza media che indichi per la specie.</p>
    <div class="g3"><label class="f"><span>Specie</span><select id="hsp">${(spL.length ? spL : S.specie.map(s => s.id)).map(s => `<option value="${s}" ${s === sel.sp ? 'selected' : ''}>${esc(s)} ${esc(spName(s))}</option>`).join('')}<option value="">altra…</option></select></label>
      <label class="f"><span>d (cm)</span><input id="hd" inputmode="decimal" onkeydown="if(event.key==='Enter')$('#hh').focus()"></label><label class="f"><span>h (m)</span><input id="hh" inputmode="decimal" onkeydown="if(event.key==='Enter')A.addH()"></label></div>
    <button class="btn block" onclick="A.addH()">Registra albero campione</button>
    ${hs.length ? `<div class="tw" style="margin-top:8px"><table><tr><th>Specie</th><th>d</th><th>h</th><th></th></tr>${hs.slice(0, 30).map(x => `<tr><td>${esc(x.sp)}</td><td>${fmt(num(x.d), 1)}</td><td>${fmt(num(x.h), 1)}</td><td><button class="chip" style="min-height:30px;padding:2px 10px" onclick="A.delH('${x.id}')">✕</button></td></tr>`).join('')}</table></div>` : ''}</div>`;
  h += `<div class="card"><h2>Altezze per specie</h2><div class="tw"><table><tr><th>Specie</th><th>Misure</th><th>Curva</th><th>h(20)</th><th>h(40)</th><th>h media (m)</th></tr>`;
  spL.forEach(s => { const c = cur[s]; const n = hSample(l.id).filter(p => p.sp === s).length; h += `<tr><td>${esc(s)} ${esc(spName(s))}</td><td>${n}</td><td>${c ? `${fmt(c.a, 2)} + ${fmt(c.b, 2)}·ln d (R² ${fmt(c.r2, 2)})` : '–'}</td><td>${c ? fmt(c.a + c.b * Math.log(20), 1) : ''}</td><td>${c ? fmt(c.a + c.b * Math.log(40), 1) : ''}</td><td><input value="${esc((l.hm || {})[s] ?? '')}" inputmode="decimal" style="width:70px;min-height:36px;padding:6px" onchange="A.setMap('hm','${s}',this.value)"></td></tr>`; });
  h += `</table></div></div>`;
  h += `<div class="card"><h2>Tavole di cubatura</h2><p class="muted">Per ogni specie si usa l'equazione a doppia entrata <b>INFC 2005</b> (Tabacchi et al., 2011). Se il Piano di assestamento ha tavole proprie, inseriscile in <b>Altro → Tavole di cubatura del PAF</b> e assegnale qui: prevalgono sull'INFC (fuori dal campo della tavola si torna all'INFC). Il peso della legna fresca (t/m³, valori indicativi modificabili) serve per esprimere la massa in quintali.</p>
    <div class="tw"><table><tr><th>Specie</th><th>Tavola</th><th>Peso t/m³</th></tr>
    <tr><td><b>Tutte</b></td><td><select style="min-height:36px;padding:4px" onchange="A.setMap('tav','*',this.value)"><option value="infc">INFC 2005 (per specie)</option>${S.tavole.map(t => `<option value="${t.id}" ${(l.tav || {})['*'] === t.id ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></td><td></td></tr>
    ${spL.map(s => `<tr><td>${esc(s)} ${esc(spName(s))}</td><td><select style="min-height:36px;padding:4px" onchange="A.setMap('tav','${s}',this.value)"><option value="">come “Tutte”</option><option value="infc" ${(l.tav || {})[s] === 'infc' ? 'selected' : ''}>INFC – ${esc((INFC[(SP[s] || {}).infc] || {}).sez || '—')}</option>${S.tavole.map(t => `<option value="${t.id}" ${(l.tav || {})[s] === t.id ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></td><td><input value="${esc((l.peso || {})[s] ?? '')}" placeholder="${esc((SP[s] || {}).peso || '')}" inputmode="decimal" style="width:70px;min-height:36px;padding:6px" onchange="A.setMap('peso','${s}',this.value)"></td></tr>`).join('')}</table></div></div>`;
  $('#view').innerHTML = h;
};

async function out(name, content, mime, share) {
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime});
  if (typeof PT !== 'undefined' && !PT.noArch) setTimeout(() => PT.archivia(name, blob), 300);
  if (typeof NATIVE !== 'undefined' && NATIVE) {
    try {
      const data = u8ToB64(new Uint8Array(await blob.arrayBuffer())); let uri = null, where = '';
      try { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: 'Martellata Campo/' + name, data, directory: 'DOCUMENTS', recursive: true})).uri; where = 'Documenti/Martellata Campo'; }
      catch (e) { uri = (await Capacitor.nativePromise('Filesystem', 'writeFile', {path: name, data, directory: 'CACHE', recursive: true})).uri; }
      if (where) toast(`Salvato in ${where}/${name}`, 3500);
      if (share || !where) { try { await Capacitor.nativePromise('Share', 'share', {title: name, files: [uri], dialogTitle: 'Invia ' + name}); } catch (e) { if (!/cancel/i.test(e.message || '')) toast('Condivisione: ' + e.message, 3500); } }
      return true;
    } catch (e) { toast('Errore salvataggio: ' + e.message, 4000); return false; }
  }
  try {
    if (share) { const file = new File([blob], name, {type: mime}); if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return true; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true;
  } catch (e) { if (e.name !== 'AbortError') toast('Errore: ' + e.message); return false; }
}

function applyTheme(k) {
  const r = document.documentElement;
  if (k === 'auto') { if (matchMedia('(prefers-color-scheme: dark)').matches) r.dataset.theme = 'dark'; else delete r.dataset.theme; }
  else if (k === 'light') delete r.dataset.theme; else r.dataset.theme = k;
}
async function loadAll() {

  SPECIE_DEFAULT.forEach(d => { if (!S.specie.some(x => x.id === d.id)) S.specie.push({...d}); });
  S.cfg = (await DB.get('config', 'cfg')) || {};

}

  ar2.forEach(x => insertRow(db, 'ads_rilievi', schema.ads_rilievi, {fid: x.fid, uuid: x.id, mod_ts: x.mod || x.t, ads_uuid: x.adsId, tipo: x.tipo, specie: x.sp || null, classe: numOrNull(x.c), n: numOrNull(x.n)}));

  hs.forEach(x => insertRow(db, 'altezze', schema.altezze, {fid: x.fid, uuid: x.id, mod_ts: x.mod || x.t, specie: x.sp, d: numOrNull(x.d), h: numOrNull(x.h), operatore: x.op || null, data: new Date(x.t || Date.now()).toISOString()}));

  await writeRifLayers(db, l, schema, base);

async function merge3({db, bdb, t, store, lotId, conv, F, apply, del, rep, mk}) {

  const bmap = new Map(); if (bdb) rows(bdb, t).forEach(r => { if (r.uuid) bmap.set(r.uuid, r); });
  const seen = new Set();
  for (const r of rows(db, t)) {
    if (!r.uuid) { if (mk) { const o = mk(conv(r, gc), r); if (o) { await putS(store, o); rep.nuovi++; } } continue; }
    seen.add(r.uuid); if (del.has(r.uuid)) continue;
    const R = conv(r, gc); let loc = S[store].find(x => x.id === r.uuid); const b = bmap.get(r.uuid);
    if (!loc) { if (b) continue; const o = mk ? mk(R, r) : null; if (o) { o.id = r.uuid; await putS(store, o); rep.nuovi++; } continue; }
    const rNewer = (r.mod_ts || 0) > (loc.mod || 0); const B = b ? conv(b, gcb) : null; const L = conv(null, null, loc);
    let ch = false;
    for (const [k, ty] of F) if (pick3(nv(L[k], ty), nv(R[k], ty), B ? nv(B[k], ty) : undefined, rNewer) === 'r') { apply(loc, k, R); ch = true; }
    if (r.fid) loc.fid = r.fid;
    if (ch) { loc.mod = Math.max(loc.mod || 0, r.mod_ts || 0); rep.agg++; }
    await putS(store, loc);
  }
  for (const [id, b] of bmap) if (!seen.has(id)) {
    const loc = S[store].find(x => x.id === id && x.lottoId === lotId); if (!loc) continue;
    const B = conv(b, gcb), L = conv(null, null, loc);
    if (F.every(([k, ty]) => nv(L[k], ty) === nv(B[k], ty))) { await dropS(store, id); rep.elim++; }
  }
}

/* legge i file scelti e restituisce i dataset trovati */
async function readVector(files) {
  const bag = {};

    const u8 = new Uint8Array(await f.arrayBuffer());
    if (/\.zip$/i.test(f.name)) Object.entries(await unzip(u8)).forEach(([k, v]) => bag[k.split('/').pop()] = v);
    else bag[f.name] = u8;
  }
  const out = [];
  const by = ext => Object.keys(bag).filter(k => k.toLowerCase().endsWith(ext));
  for (const shp of by('.shp')) {
    const base = shp.slice(0, -4); const get = e => { const k = Object.keys(bag).find(x => x.toLowerCase() === (base + e).toLowerCase()); return k ? bag[k] : null; };
    const dbf = get('.dbf'); const prj = get('.prj'); const cpg = get('.cpg');
    const geoms = parseShp(bag[shp]);
    const tab = dbf ? parseDbf(dbf, cpg ? new TextDecoder().decode(cpg).trim().replace(/^UTF8$/i, 'utf-8').replace(/^(ANSI )?1252$/i, 'windows-1252') : null) : {fields: [], recs: geoms.map(() => ({}))};
    const feats = []; geoms.forEach((g, i) => { if (g && tab.recs[i] !== null) feats.push({g, p: tab.recs[i] || {}}); });
    const prjTxt = prj ? new TextDecoder().decode(prj) : '';

    out.push({name: base, feats, fields: tab.fields.map(f => f.name), gtype: feats[0] ? feats[0].g.type : 'Point', crs: det || guessCrs(gbbox(feats.map(f => f.g))), crsFrom: det ? 'prj' : prj ? 'prj-sconosciuto' : 'stimato', prj: prjTxt, noDbf: !dbf});

    const fs = d.type === 'FeatureCollection' ? d.features : d.type === 'Feature' ? [d] : [{type: 'Feature', geometry: d, properties: {}}];
    const feats = fs.filter(f => f && f.geometry).map(f => ({g: f.geometry.type === 'Polygon' ? {type: 'MultiPolygon', coordinates: [f.geometry.coordinates]} : f.geometry, p: f.properties || {}}));
    const nm = d.crs && d.crs.properties && d.crs.properties.name; const ep = nm && +(String(nm).match(/(\d{4,5})$/) || [])[1];
    const fields = [...new Set(feats.flatMap(f => Object.keys(f.p)))];

}
/* legge un GeoPackage qualsiasi (progetto QGIS/QField fatto a mano): un dataset per ogni layer vettoriale,

async function readGpkgAny(u8, fname = '', log = () => {}) {
  const SQL = await sqlJs(); const db = new SQL.Database(u8); const out = [];
  try {
    let r; try { r = db.exec("SELECT c.table_name, c.identifier, g.column_name, g.srs_id FROM gpkg_contents c JOIN gpkg_geometry_columns g ON g.table_name=c.table_name WHERE c.data_type='features'"); }
    catch (e) { throw new Error((fname || 'Il file') + ' non è un GeoPackage valido'); }
    for (const [t, ident, gcol, srs] of (r[0] || {values: []}).values) {
      if (MANAGED(t)) continue;
      let code = +srs, def = '';
      try { const d = db.exec('SELECT organization, organization_coordsys_id, definition FROM gpkg_spatial_ref_sys WHERE srs_id=?', [srs]); if (d.length) { const [org, oid, dd] = d[0].values[0]; if (/epsg/i.test(org || '') && oid > 0) code = +oid; def = dd || ''; } } catch (e) {}
      const st = db.prepare(`SELECT * FROM "${t}" LIMIT 50000`); const cols = st.getColumnNames(); const raw = []; let k = 0;
      log(`Layer ${ident || t}…`);
      while (st.step()) {
        if (++k % 2000 === 0) await new Promise(r => setTimeout(r, 0));
        const v = st.get(); const p = {}; let geom = null;
        cols.forEach((c, i) => { if (c === gcol) geom = v[i]; else if (!(v[i] instanceof Uint8Array)) p[c] = v[i]; });
        let gg = null; try { gg = geom ? GEO.readGPKG(geom) : null; } catch (e) {}

      st.free();

      const known = CRS[code] || FAST_UTM33.includes(code) || FAST_GEO.includes(code);
      const useCrs = known ? code : def && !/^undefined$/i.test(def.trim()) ? def : guessCrs(gbbox(raw.map(f => f.g)));
      let fn; try { fn = await toWgs(useCrs); } catch (e) { console.warn('SR non gestito', t, code); continue; }
      const feats = []; raw.forEach(f => { try { feats.push({g: GEO.mapCoords(f.g, fn), p: f.p}); } catch (e) {} });
      out.push({name: ident || t, feats, fields: cols.filter(c => c !== gcol && c !== 'fid'), gtype: feats[0] ? feats[0].g.type : 'Point', crs: 4326, crsFrom: 'gpkg', crsLabel: CRS[code] ? `${CRS[code][0]} (EPSG:${code})` : code > 0 ? 'EPSG:' + code : 'stimato', src: fname});

}

/* ---------- mappa: livelli ---------- */
function drawRif() {
  if (!M.map) return;
  if (!M.lyrR) M.lyrR = L.featureGroup().addTo(M.map);
  M.lyrR.clearLayers();
  layersOf(prog().id).filter(l => l.visible !== false).forEach(l => {
    const gj = {type: 'FeatureCollection', features: l.feats.slice(0, 20000).map(f => ({type: 'Feature', geometry: f.g, properties: f.p}))};
    L.geoJSON(gj, {
      style: {color: l.color, weight: /Line/.test(l.gtype) ? 2.5 : 1.5, fillOpacity: .06, dashArray: /Polygon/.test(l.gtype) ? '5 4' : null},
      pointToLayer: (f, ll) => L.circleMarker(ll, {radius: 5, color: '#fff', weight: 1, fillColor: l.color, fillOpacity: .9}),
      onEachFeature: (f, lyr) => lyr.on('click', ev => {
        if (M.draw) return M.map.fire('click', ev);
        L.DomEvent.stopPropagation(ev);
        const rows = Object.entries(f.properties || {}).filter(([, v]) => v != null && v !== '').slice(0, 12).map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${esc(String(v))}</td></tr>`).join('');
        L.popup().setLatLng(ev.latlng).setContent(`<b>${esc(l.name)}</b><table style="font-size:.8rem">${rows}</table>`).openOn(M.map);
      })
    }).addTo(M.lyrR);
  });
  M.lyrR.bringToBack();
}

  async req(method, path, body, bin) {
    const url = QFC.url() + path.replace(/\/?$/, '/');
    const h = {Accept: 'application/json'};
    if (QFC.token()) h.Authorization = 'Token ' + QFC.token();
    let status, data, text;
    if (NATIVE) {
      const o = {url, method, headers: h, connectTimeout: 20000, readTimeout: 120000};
      if (bin) o.responseType = 'arraybuffer';
      if (body && body.file) {
        const bd = 'pafcampo' + Math.random().toString(16).slice(2);
        const enc = new TextEncoder();
        const head = enc.encode(`--${bd}\r\nContent-Disposition: form-data; name="file"; filename="${body.name}"\r\nContent-Type: ${body.mime}\r\n\r\n`);
        const tail = enc.encode(`\r\n--${bd}--\r\n`);

      else if (body) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
      let r;
      try { r = await fetch(url, {method, headers: h, body: b}); }
      catch (e) { throw new Error(ponte() ? 'Ponte o QFieldCloud non raggiungibili (' + (e.message || 'rete assente') + '). Controlla la connessione e l\'indirizzo del ponte.' : 'Dal sito web serve il ponte verso QFieldCloud: impostalo in Altro → QFieldCloud (oppure usa l\'app Android).'); }

      if (r.ok) { if (bin) return new Uint8Array(await r.arrayBuffer()); return status === 204 ? null : r.json(); }

  },
  async login(user, pass) { const d = await QFC.req('POST', 'auth/login/', {username: user, password: pass}); LS.set('mc-qfc-token', d.token); LS.set('mc-qfc-user', d.username || user); return d; },
  async logout() { try { await QFC.req('POST', 'auth/logout/'); } catch (e) {} LS.set('mc-qfc-token', ''); },
  projects: () => QFC.req('GET', 'projects/'),
  create: (name, owner) => QFC.req('POST', 'projects/', {name, owner, description: 'Martellata e matricinatura – Martellata Campo', is_public: false}),
  files: pid => QFC.req('GET', `files/${pid}/`),
  download: (pid, name) => QFC.req('GET', `files/${pid}/${String(name).split('/').map(encodeURIComponent).join('/')}/`, null, true),
  upload: (pid, name, data, mime = 'application/octet-stream') => QFC.req('POST', `files/${pid}/${encodeURIComponent(name)}/`, {file: data instanceof Uint8Array ? data : new Uint8Array(data), name, mime}),

const fileSig = (files, n) => { const f = files.find(x => x.name === n); return f ? (f.md5sum || f.sha256 || '') + '|' + (f.last_modified || f.size || '') : ''; };

/* Sincronizzazione: 1) scarica il GeoPackage dal cloud e unisce le modifiche fatte in QField
   2) carica il GeoPackage aggiornato con i dati dell'app, solo se nel frattempo nessuno ha modificato il file. */
async function qfcSync(prog, log = () => {}, force = true) {
  const pid = prog.qfc_pid;
  if (!pid) throw new Error('Piano non collegato a un progetto QFieldCloud.');
  let files = await QFC.files(pid), chg = 0, synth = 0;
  for (let tent = 0; tent < 3; tent++) {
    const sig = fileSig(files, GPKG_FILE);
    if (sig && sig !== prog.qfc_sig) {
      log('Scarico ' + GPKG_FILE + '…');
      const u8 = await QFC.download(pid, GPKG_FILE);
      const {rep} = await importGpkg(u8, prog.id, {base: await syncBaseGet(prog.id), force: true}); chg += rep.nuovi + rep.agg + rep.elim;
      await syncBaseSet(prog.id, u8); prog.qfc_sig = sig;
      log(`Dal cloud: ${rep.nuovi} elementi nuovi, ${rep.agg} aggiornati, ${rep.elim} eliminati.`);
    }
    const t0 = Date.now();
    const local = !sig || !prog.qfc_last || synth > 0 || LS.get('mc-lastmod', 0) > prog.qfc_last;
    const needQgs = !files.some(x => /^Martellata\.qg[sz]$/.test(x.name));
    if (local || force || needQgs) {
      log('Preparo il GeoPackage aggiornato…');
      const out = await exportGpkg(prog.id);
      files = await QFC.files(pid);
      if (fileSig(files, GPKG_FILE) !== sig) { log('Il file sul cloud è cambiato proprio ora: ripeto l\'unione.'); prog.qfc_sig = ''; continue; }
      log('Carico su QFieldCloud…');
      await QFC.upload(pid, GPKG_FILE, out, 'application/geopackage+sqlite3');
      await gpkgBaseSet(prog.id, out); await syncBaseSet(prog.id, out);
      if (needQgs) {
        log('Carico il progetto QGIS…');
        const q = await (await fetch('./Martellata.qgz')).arrayBuffer();
        await QFC.upload(pid, 'Martellata.qgz', q, 'application/zip');
      }
      try { await QFC.package(pid); } catch (e) {}
      files = await QFC.files(pid);
    } else log('Nessuna modifica locale da inviare.');
    prog.qfc_sig = fileSig(files, GPKG_FILE); prog.qfc_last = t0; prog.qfc_err = ''; await DB.put('lotti', prog);
    log('Sincronizzazione completata. In QField premi "Sincronizza" per ricevere i dati.');
    return chg;
  }
  throw new Error('Il file sul cloud continua a cambiare (QField sta sincronizzando?). Riprovo più tardi.');
}

/* Collega un progetto del cloud: scarica il piano sul telefono di un nuovo operatore,
   ritrova il piano già presente (stesso identificativo) oppure collega quello aperto. */
async function qfcLink(pid, name, log = () => {}) {
  const files = await QFC.files(pid); const sig = fileSig(files, GPKG_FILE); const cur = prog();
  const link = async p => { p.qfc_pid = pid; p.qfc_name = name; await save('lotti', p); return p; };
  if (!sig && files.some(f => /\.(qgs|qgz|gpkg|shp|geojson)$/i.test(f.name) && !/^Martellata\.qg[sz]$/.test(f.name)))
    throw new Error(`Il progetto "${name}" non è stato creato da Martellata Campo: non lo collego per non modificarlo. Per portarne i dati nel lotto usa "Importa dati da un altro progetto".`);
  if (!sig) { if (!cur) throw new Error('Il progetto sul cloud è vuoto: crea prima il lotto sul telefono, poi collegalo.'); cur.qfc_sig = ''; cur.qfc_last = 0; return link(cur); }
  log('Scarico ' + GPKG_FILE + '…');
  const u8 = await QFC.download(pid, GPKG_FILE);
  const SQL = await sqlJs(); const db = new SQL.Database(u8); const pr = rows(db, 'lotto')[0]; db.close();
  const same = pr && pr.uuid && S.lotti.find(x => x.id === pr.uuid);
  const empty = x => !S.aree.some(q => q.lottoId === x.id) && !S.piante.some(q => q.lottoId === x.id);
  let target;
  if (same) target = same;
  else if (!cur || empty(cur) || !confirm(`Il progetto "${name}" contiene un lotto diverso da "${cur.nome}". Unire i dati del cloud nel lotto aperto?\n\nAnnulla = scarica il lotto del cloud come lotto separato.`)) {
    const {prog: p, rep} = await importGpkg(u8, null); target = p;
    log(`Lotto scaricato: ${rep.aree} aree, ${rep.piante} piante.`);
    if (cur && empty(cur) && cur.id !== p.id && /^Nuovo lotto$/.test(cur.nome || '') && !cur.qfc_pid) { await remove('lotti', cur.id); }
    target.qfc_sig = sig; target.qfc_last = Date.now(); await syncBaseSet(target.id, u8);
    return link(target);
  } else target = cur;
  // unione nel piano esistente
  const {rep} = await importGpkg(u8, target.id, {force: true, base: target.qfc_pid === pid ? await syncBaseGet(target.id) : null});
  log(`Uniti: ${rep.nuovi} elementi nuovi, ${rep.agg} aggiornati.`);
  target.qfc_sig = sig; target.qfc_last = 0; await syncBaseSet(target.id, u8);
  return link(target);
}

/* ---------- Sincronizzazione automatica (solo app Android) ---------- */
const AUTO = {busy: false, dirty: false, last: 0, timer: null, errAt: 0};
const autoOn = () => NET() && LS.get('mc-qfc-auto', true) && !!QFC.token();
function syncBadge(state) {
  const el = document.getElementById('sync'); if (!el) return;
  el.hidden = !NET() || !QFC.token();
  el.textContent = {run: '☁ …', ok: '☁ ✓', err: '☁ !', wait: '☁ •'}[state] || '☁';
  el.title = {run: 'Sincronizzazione in corso', ok: 'Sincronizzato', err: 'Ultima sincronizzazione non riuscita', wait: 'Modifiche da inviare'}[state] || '';
}
async function autoSync(force) {
  if (!autoOn() || AUTO.busy || !navigator.onLine) { if (AUTO.dirty) syncBadge('wait'); return; }
  const ps = S.lotti.filter(p => p.qfc_pid);
  if (!ps.length) return;
  if (!force && !AUTO.dirty && Date.now() - AUTO.last < 10 * 60e3) return;
  if (!force && Date.now() - AUTO.errAt < 2 * 60e3) return;
  AUTO.busy = true; AUTO.dirty = false; syncBadge('run');
  let ok = true, chg = 0;
  for (const p of ps) {
    try { chg += await qfcSync(p, () => {}, false); }
    catch (e) { ok = false; p.qfc_err = e.message; try { await DB.put('lotti', p); } catch (x) {} console.warn('autosync', e); }
  }
  AUTO.busy = false; AUTO.last = Date.now(); if (!ok) AUTO.errAt = Date.now();
  syncBadge(ok ? (AUTO.dirty ? 'wait' : 'ok') : 'err');
  if (!chg) return;
  toast(`☁ ${chg} aggiornamenti ricevuti`, 2500);
  if (sel.view === 'mappa') { if (M.map && M.lyrP) drawLayers(false); }
  else if (['lotti', 'elenco', 'riepilogo', 'altro'].includes(sel.view) && !document.querySelector('input:focus,textarea:focus,select:focus')) go(sel.view);
}
function autoMark() { if (!NET()) return; AUTO.dirty = true; syncBadge('wait'); clearTimeout(AUTO.timer); AUTO.timer = setTimeout(() => autoSync(), 45e3); }
function autoStart() {
  if (!NET() || AUTO.started) return; AUTO.started = true;
  syncBadge(AUTO.dirty ? 'wait' : '');
  addEventListener('online', () => setTimeout(() => autoSync(true), 3000));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); else if (AUTO.dirty) autoSync(true); });
  setInterval(() => autoSync(), 3 * 60e3);
  setTimeout(() => autoSync(true), 4000);
}

/* Importa i dati di un progetto QFieldCloud qualsiasi (fatto a mano in QGIS/QField) nel lotto aperto.
   Il progetto sul cloud viene solo letto: nessun file viene caricato o modificato. */
const MB = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
const QFC_MAXMB = 120;
/* elenco dei file importabili di un progetto QFieldCloud (GeoPackage, shapefile raggruppati, GeoJSON) */
async function qfcOtherFiles(pid) {
  const files = await QFC.files(pid); const out = [];
  files.filter(f => /\.(gpkg|geojson)$/i.test(f.name)).forEach(f => out.push({key: f.name, names: [f.name], size: +f.size || 0}));
  files.filter(f => /\.shp$/i.test(f.name)).forEach(f => {
    const base = f.name.slice(0, -4).toLowerCase();
    const parts = files.filter(x => x.name.toLowerCase().startsWith(base + '.') && /\.(shp|dbf|prj|cpg)$/i.test(x.name));
    out.push({key: f.name, names: parts.map(x => x.name), size: parts.reduce((a, x) => a + (+x.size || 0), 0)});
  });
  return out;
}
async function qfcReadOther(pid, list, log = () => {}) {
  const sets = [];
  for (const it of list) {
    if (it.size > QFC_MAXMB * 1048576) { log(`${it.key}: ${MB(it.size)}, troppo grande per il telefono. Saltato.`); continue; }
    if (/\.gpkg$/i.test(it.key)) {
      log(`Scarico ${it.key} (${MB(it.size)})…`);
      const u8 = await QFC.download(pid, it.key);
      log(`Leggo i layer di ${it.key}…`); await new Promise(r => setTimeout(r, 30));
      const ds = await readGpkgAny(u8, it.key.split('/').pop(), log);
      log(`${it.key}: ${ds.length} layer con geometrie.`); sets.push(...ds);
    } else {
      const blobs = [];
      for (const n of it.names) { log('Scarico ' + n + '…'); const u8 = await QFC.download(pid, n); blobs.push({name: n.split('/').pop(), arrayBuffer: async () => u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)}); }
      try { sets.push(...(await readVector(blobs))); } catch (e) { log(it.key + ': ' + e.message); }
    }
  }
  return sets;
}

/* ============================================================
   Divisione del lavoro in squadra (comune a PAF Campo e Martellata Campo)
   Ogni unità di lavoro (particella / area / area di saggio) può essere:
   assegnata dal capo squadra, presa in carico da un operatore, completata, libera.
   I record viaggiano nel GeoPackage (tabella "incarichi") con la sincronizzazione.
   Regole di unione: vince la modifica più recente; se due operatori prendono la stessa

    ads: {lab: () => 'area di saggio', list: pid => S.rilievi.filter(r => r.progId === pid).sort((a, b) => (a.n || 0) - (b.n || 0)), name: r => rilName(r), parent: r => ['part', S.particelle.find(p => p.id === r.partId)], store: 'rilievi'}

  ops: pid => [].concat(S.rilievi.filter(r => r.progId === pid).map(r => r.op), S.osservazioni.filter(o => o.progId === pid).map(o => o.op), S.altezze.filter(h => h.progId === pid).map(h => h.op)),
  last: (pid, op) => Math.max(0, ...S.rilievi.filter(r => r.progId === pid && r.op === op).map(r => r.mod || r.t1 || r.t0 || 0), ...S.osservazioni.filter(o => o.progId === pid && o.op === op).map(o => o.mod || o.t || 0))

  proj: () => lot(), projKey: 'lottoId',
  kinds: {
    area: {lab: () => 'area', list: lid => areeOf(lid).filter(a => a.tipo !== 'Area esclusa'), name: a => a.nome || 'Area', parent: null, store: 'aree'},
    ads: {lab: () => 'area di saggio', list: lid => adsOf(lid), name: a => 'AS' + (a.n ?? ''), parent: a => ['area', S.aree.find(x => x.id === a.areaId)], store: 'ads'}

  top: 'area',
  touch: (store, o) => store === 'piante' ? (o.areaId ? ['area', S.aree.find(a => a.id === o.areaId)] : null) : store === 'ads' ? ['ads', o]

  last: (lid, op) => Math.max(0, ...S.piante.filter(x => x.lottoId === lid && x.op === op).map(x => x.mod || x.t || 0), ...S.ads.filter(x => x.lottoId === lid && x.op === op).map(x => x.mod || x.t || 0))

const incHeld = s => s === 'assegnato' || s === 'corso' || s === 'fatto';

/* incarico che vale per l'elemento: il suo, altrimenti quello dell'unità che lo contiene */
function incEff(kind, el) {
  if (!el) return null;

async function incSet(kind, el, stato, op) {
  const p = SQ.proj(); const me = opName(); const old = incOf(el.id) || {};
  const r = {id: el.id, projId: el[SQ.projKey] || (p && p.id), kind, nome: SQ.kinds[kind].name(el), op: stato === 'libero' ? '' : (op || me), stato, da: stato === 'assegnato' ? me : (old.da || ''),

/* chiamata da save(): prende in carico in automatico ciò su cui si inizia a lavorare */
const INC_BUSY = new Set();
function incTouch(store, o) {
  try {

const INC_COLS = [['uuid', 'TEXT'], ['mod_ts', 'INTEGER'], ['tipo', 'TEXT'], ['nome', 'TEXT'], ['operatore', 'TEXT'], ['stato', 'TEXT'], ['assegnato_da', 'TEXT'], ['t_presa', 'INTEGER'], ['prec', 'TEXT'], ['data', 'TEXT']];
function incRows(pid) {
  return S.incarichi.filter(x => x.projId === pid).map((x, i) => ({fid: i + 1, uuid: x.id, mod_ts: x.mod || x.t || 0, tipo: x.kind, nome: x.nome || null, operatore: x.op || null, stato: x.stato, assegnato_da: x.da || null, t_presa: x.tp || null, prec: x.prev || null, data: new Date(x.mod || x.t || Date.now()).toISOString()}));

/* unisce gli incarichi del cloud; restituisce quante modifiche e le unità perse da questo operatore */
async function incMerge(rs, pid) {
  let chg = 0; const lost = []; const me = opName();
  for (const r of rs) {
    if (!r.uuid) continue;
    const x = {id: r.uuid, projId: pid, kind: r.tipo || '', nome: r.nome || '', op: r.operatore || '', stato: INC_ST[r.stato] ? r.stato : 'libero', da: r.assegnato_da || '', tp: r.t_presa || 0, prev: r.prec || '', mod: r.mod_ts || 0, t: r.mod_ts || 0};
    const l = incOf(x.id);
    if (!l) { await putS('incarichi', x); chg++; continue; }
    if ((l.mod || 0) === x.mod && l.op === x.op && l.stato === x.stato) continue;
    let win = x.mod > (l.mod || 0) ? x : l;
    if (x.stato === 'corso' && l.stato === 'corso' && x.op !== l.op) win = (x.tp || x.mod) <= (l.tp || l.mod) ? x : l; // prese in contemporanea: vince la prima
    const older = win === x ? l : x;
    if (!['corso', 'assegnato'].includes(win.stato) && win.prev && incHeld(older.stato) && older.op && older.op !== win.prev && older.stato !== 'fatto') win = older; // rilascio di un incarico che nel frattempo era passato ad altri
    if (win === x) { if (l.op === me && ['corso', 'assegnato'].includes(l.stato) && x.op && x.op !== me) lost.push(x); await putS('incarichi', x); chg++; }
  }
  if (lost.length) setTimeout(() => toast(`Attenzione: ${lost.map(x => x.nome).join(', ')} ${lost.length > 1 ? 'erano già state prese' : 'era già stata presa'} da ${[...new Set(lost.map(x => x.op))].join(', ')}`, 6000), 300);
  return {chg, lost};
}

const GR_COL = ['#2f6b2a', '#c98a1f', '#3b6fb6', '#b5443b', '#7a5c9e', '#2a9d8f', '#8c8c3b', '#d4765a', '#5b7f95', '#9b6b3c'];

}

/* ============================================================
   Martellata Campo — aree di saggio, stime a ettaro e riepilogo per sezione
   Alto fusto: provvigione dalle aree di saggio + martellata pianta per pianta → % di prelievo.
   Ceduo: polloni, ceppaie e matricine nelle aree di saggio → massa ritraibile;
          matricine rilasciate numerate nel piedilista di matricinatura.
   ============================================================ */
const adsSupNormaSet = l => { const N = regN(l); return num(isCeduo(l) ? N.adsCeduo : N.adsFustaia); };
const adsSupNorma = l => adsSupNormaSet(l) || num(regN(l).adsCeduo) || ADS_DEF;
const adsSup = (a, l) => num(a.sup) || adsSupNorma(l || S.lotti.find(x => x.id === a.lottoId) || {});
const adsRaggio = a => (a.forma || 'C') === 'C' ? Math.sqrt(adsSup(a) / Math.PI) : '';
/* raggio da misurare lungo il pendio perché la proiezione orizzontale abbia la superficie voluta */
const adsRaggioPend = a => { const r = adsRaggio(a); const p = num(a.pend); if (!r || !p) return r; return r / Math.sqrt(Math.cos(Math.atan(p / 100))); };
function adsClassi(l) {
  const amp = num(l.amp) || (isCeduo(l) ? 2 : 5); const d0 = num(l.dmin) || amp;
  const start = Math.max(amp, classOf(d0, amp)); const max = isCeduo(l) ? 40 : 80; const out = [];
  for (let c = start; c <= max + 1e-9; c += amp) out.push(Math.round(c * 10) / 10);
  S.adsril.filter(r => r.lottoId === l.id && num(r.c) && !out.includes(num(r.c))).forEach(r => out.push(num(r.c)));
  return [...new Set(out)].sort((a, b) => a - b);
}
const T975 = [0, 12.71, 4.30, 3.18, 2.78, 2.57, 2.45, 2.36, 2.31, 2.26, 2.23, 2.20, 2.18, 2.16, 2.14, 2.13, 2.12, 2.11, 2.10, 2.09, 2.09];
const tStud = df => df <= 0 ? '' : df < T975.length ? T975[df] : df < 30 ? 2.06 : df < 60 ? 2.02 : 1.98;

/* stime dalle aree di saggio: medie a ettaro, per specie e per classe */
function adsStats(l) {
  const cur = curves(l.id); const amp = num(l.amp) || 5; const ced = isCeduo(l); const main = ced ? 'P' : 'F';
  const vc = {}; const volC = (sp, c) => { const k = sp + '|' + c; if (!(k in vc)) vc[k] = treeCalc(l, {sp, d: c}, cur); return vc[k]; };
  const z = () => ({n: 0, g: 0, v: 0, q: 0, vmiss: 0});
  const addTo = (m, key, n, c) => { const x = m[key] = m[key] || z(); x.n += n; if (c) { x.g += c.g * n; if (c.v == null) x.vmiss += n; else x.v += c.v * n; if (c.q != null) x.q += c.q * n; } };
  const per = adsOf(l.id).map(a => {
    const sup = adsSup(a, l); const o = {a, sup, k: 10000 / sup, T: {}, sp: {}, cl: {}};
    S.adsril.filter(r => r.adsId === a.id && num(r.n) > 0).forEach(r => {
      const n = num(r.n);
      if (r.tipo === 'C') { addTo(o.T, 'C', n); addTo(o.sp, 'C|' + r.sp, n); return; }
      const c = volC(r.sp, num(r.c)); addTo(o.T, r.tipo, n, c); addTo(o.sp, r.tipo + '|' + r.sp, n, c);
      const kc = r.tipo + '|' + r.sp + '|' + num(r.c); o.cl[kc] = (o.cl[kc] || 0) + n;
    });
    return o;
  });
  const nA = per.length; const mean = f => nA ? per.reduce((s, o) => s + f(o), 0) / nA : 0;
  const haOf = (key, fld) => { const keys = new Set(); per.forEach(o => Object.keys(o[fld]).forEach(k => keys.add(k))); const out = {}; keys.forEach(k => { out[k] = {n: mean(o => (o[fld][k] || z()).n * o.k), g: mean(o => (o[fld][k] || z()).g * o.k), v: mean(o => (o[fld][k] || z()).v * o.k), q: mean(o => (o[fld][k] || z()).q * o.k), vmiss: per.reduce((s, o) => s + (o[fld][k] || z()).vmiss, 0)}; }); return out; };
  const ha = haOf('', 'T'), haSp = haOf('', 'sp');
  const haCl = {}; { const keys = new Set(); per.forEach(o => Object.keys(o.cl).forEach(k => keys.add(k))); keys.forEach(k => { const [t, sp, c] = k.split('|'); const n = mean(o => (o.cl[k] || 0) * o.k); const vv = volC(sp, +c); haCl[k] = {t, sp, c: +c, n, v: vv.v != null ? vv.v * n : 0}; }); }
  const vs = per.map(o => (o.T[main] || z()).v * o.k); const m = mean(o => (o.T[main] || z()).v * o.k);
  const sd = nA > 1 ? Math.sqrt(vs.reduce((s, v) => s + (v - m) ** 2, 0) / (nA - 1)) : '';
  const err = {n: nA, m, sd, cv: sd !== '' && m ? sd / m * 100 : '', e: sd !== '' && m ? tStud(nA - 1) * sd / Math.sqrt(nA) / m * 100 : ''};
  return {per, nA, ha, haSp, haCl, main, err, amp, supMean: mean(o => o.sup), supTot: per.reduce((s, o) => s + o.sup, 0), z};
}
const zero = () => ({n: 0, g: 0, v: 0, q: 0, vmiss: 0});
const adsSpList = (st, t) => Object.keys(st.haSp).filter(k => k.startsWith(t + '|')).map(k => k.slice(t.length + 1)).sort((a, b) => st.haSp[t + '|' + b].v - st.haSp[t + '|' + a].v || st.haSp[t + '|' + b].n - st.haSp[t + '|' + a].n);
const adsClList = (st, t) => [...new Set(Object.values(st.haCl).filter(x => x.t === t).map(x => x.c))].sort((a, b) => a - b);

/* verifiche sulle aree di saggio e sul prelievo */
function adsChecks(l) {
  const out = []; const N = regN(l); const list = adsOf(l.id); const set = adsSupNormaSet(l); const sup = supLotto(l); const ced = isCeduo(l);
  if (!list.length) { out.push({ok: false, t: `Nessuna area di saggio: servono per la stima ${ced ? 'della massa ritraibile del ceduo' : 'della provvigione e della percentuale di prelievo'} (sezione Saggi)`}); return out; }
  const small = set ? list.filter(a => adsSup(a, l) < set - 0.5) : []; const big = num(N.adsMax) ? list.filter(a => adsSup(a, l) > num(N.adsMax) + 0.5) : [];
  out.push({ok: set ? !small.length : null, t: `Aree di saggio: ${list.length}${set ? ` · superficie minima ${fmt(set, 0)} m²${small.length ? ` · sotto la soglia: ${small.map(a => 'AS' + a.n).join(', ')}` : ''}` : ' · superficie da norma non indicata (Altro → Norme regionali)'}${big.length ? ` · oltre ${fmt(num(N.adsMax), 0)} m²: ${big.map(a => 'AS' + a.n).join(', ')} (ammesso per soprassuoli radi o degradati)` : ''}`});
  const st = adsStats(l);
  if (sup) out.push({ok: null, t: `Superficie campionata ${fmt(st.supTot, 0)} m² pari al ${fmt(st.supTot / (sup * 10000) * 100, 2)}% del lotto`});
  if (st.err.e !== '') out.push({ok: st.err.e <= 20, t: `Errore di stima del volume a ettaro ±${fmt(st.err.e, 1)}% (P 95%, CV ${fmt(st.err.cv, 0)}%, ${st.nA} aree)${st.err.e > 20 ? ' · aumenta il numero di aree di saggio' : ''}`});
  else out.push({ok: null, t: 'Con una sola area di saggio non si può stimare l\'errore: rilevane almeno due'});
  if (!ced) {
    const pv = st.ha.F || zero(); const T = stats(l, x => x.dest === 'T');
    if (pv.v && sup && T.tot.n) {
      const pV = T.tot.v / (pv.v * sup) * 100, pG = T.tot.g / (pv.g * sup) * 100;
      const eta = num(l.eta); const lim = (N.prelievoG || []).find(([e]) => eta && eta <= e);
      out.push({ok: lim && /Diradamento/i.test(l.intervento || '') ? pG <= lim[1] : null, t: `Prelievo: ${fmt(pV, 1)}% del volume e ${fmt(pG, 1)}% dell'area basimetrica${lim && /Diradamento/i.test(l.intervento || '') ? ` · massimo ${lim[1]}% di G nei diradamenti fino a ${lim[0]} anni` : ''}`});
    }
  }
  return out;
}

/* ---------- AZIONI aree di saggio ---------- */
const AD = {
  sel(id) { if (sel.ads !== id) { const a = S.ads.find(x => x.id === id); if (a && !incOk('ads', a)) return; } sel.ads = sel.ads === id ? '' : id; go('saggi'); },
  async add() {
    const l = lot(); const n = adsOf(l.id).reduce((m, a) => Math.max(m, num(a.n) || 0), 0) + 1;
    const a = {id: uid(), lottoId: l.id, n, forma: 'C', sup: adsSupNorma(l), pend: num(l.pend) || '', areaId: sel.area || '', op: opName(), dev: DEV, t: Date.now()};
    await save('ads', a); sel.ads = a.id; sel.adsT = Object.keys(ADS_TIPI[sezOf(l)])[0]; go('saggi'); AD.gps(a.id, true);
  },
  gps(id, quiet) {
    if (!navigator.geolocation) return quiet ? null : toast('GPS non disponibile');
    if (!quiet) toast('Rilevo la posizione…', 1500);
    navigator.geolocation.getCurrentPosition(async p => {
      const a = S.ads.find(x => x.id === id); if (!a) return;
      if (quiet && a.lat) return; a.lat = p.coords.latitude; a.lon = p.coords.longitude; a.acc = Math.round(p.coords.accuracy * 10) / 10;
      if (!a.areaId) { const ar = areeOf(a.lottoId).find(x => x.geom && x.tipo !== 'Area esclusa' && GEO.inside([a.lon, a.lat], x.geom)); if (ar) a.areaId = ar.id; }
      await save('ads', a); if (sel.view === 'saggi') go('saggi');
    }, e => { if (!quiet) toast('Posizione non disponibile: ' + e.message, 3000); }, {enableHighAccuracy: true, timeout: 30000, maximumAge: 10000});
  },
  async del(id) {
    const a = S.ads.find(x => x.id === id); if (!confirm(`Eliminare l'area di saggio AS${a.n} con i suoi conteggi?`)) return;
    for (const r of S.adsril.filter(x => x.adsId === id)) await remove('adsril', r.id);
    await remove('ads', id); sel.ads = ''; go('saggi');
  },
  async tap(t, c, d, btn) {
    const a = S.ads.find(x => x.id === sel.ads); if (!a) return; const sp = sel.sp;
    let r = S.adsril.find(x => x.adsId === a.id && x.tipo === t && x.sp === sp && (t === 'C' || num(x.c) === c));
    const cur = r ? num(r.n) || 0 : 0; const nn = Math.max(0, cur + d);
    if (!r && nn === 0) return;
    if (!r) r = {id: uid(), lottoId: a.lottoId, adsId: a.id, tipo: t, sp, c: t === 'C' ? '' : c, n: 0, op: opName(), t: Date.now()};
    r.n = nn; await save('adsril', r); buzz(d > 0 ? 8 : 20);
    if (t === 'C') { const e = $('#ccnt'); if (e) e.textContent = nn; return; }
    if (btn) { btn.querySelector('b').textContent = nn || ''; btn.classList.toggle('has', nn > 0); }
  },
  addD() {
    const l = lot(); const d = num($('#adsd').value); if (!d) return toast('Inserisci il diametro');
    const c = classOf(d, num(l.amp) || 5); $('#adsd').value = ''; AD.tap(sel.adsT, c, 1).then(() => go('saggi'));
  }
};

const PT_APP = 'mc', PT_STORE = 'lotti', PT_FOTO_KEY = '', PT_LASTMOD = 'mc-lastmod', portaleMain = 'lotti';
function portaleCentro(pts) { const p = pts.filter(x => x.lat != null && x.lat !== '' && x.lon != null); if (!p.length) return null; return {lat: Math.round(p.reduce((s, x) => s + +x.lat, 0) / p.length * 1e5) / 1e5, lon: Math.round(p.reduce((s, x) => s + +x.lon, 0) / p.length * 1e5) / 1e5}; }
async function portaleStato(l) {
  const ps = pianteOf(l.id); const ck = checks(l); const st = typeof adsStats === 'function' ? adsStats(l) : null; const T = stats(l, x => x.dest === 'T');
  const ops = [...new Set(ps.map(x => x.op).filter(Boolean))]; const ult = Math.max(0, ...ps.map(x => x.t || 0), ...adsOf(l.id).map(a => a.mod || a.t || 0));
  let centro = portaleCentro(ps.concat(adsOf(l.id))); if (!centro) { const a = areeOf(l.id).find(x => x.geom); if (a) { const b = GEO.bbox(a.geom); centro = {lat: Math.round((b[1] + b[3]) / 2 * 1e5) / 1e5, lon: Math.round((b[0] + b[2]) / 2 * 1e5) / 1e5}; } }
  const mha = st && st.nA ? Math.round(((st.ha.M || {}).n) || 0) : null;
  return {
    comune: l.comune || '', localita: l.localita || '', proprieta: l.proprieta || '', regione: l.regione || '', sup: num(supLotto(l)) || null,
    sezione: SEZIONI[sezOf(l)] || '', governo: l.governo || '', intervento: l.intervento || '', tecnico: l.tecnico || '', dataInizio: l.data1 || '', dataFine: l.data2 || '',
    operatori: ops, ultimo: ult ? new Date(ult).toISOString() : null, centro,
    stato: {daAbbattere: ps.filter(x => x.dest === 'T').length, matricine: ps.filter(x => x.dest === 'M').length, confine: ps.filter(x => x.dest === 'R').length, contrassegnoX: ps.filter(x => x.segno === 'X').length, volume: Math.round((T.tot.v || 0) * 10) / 10, ads: adsOf(l.id).length, matricineHa: mha, nonConformi: ck.filter(c => c.ok === false).length},
    verifiche: ck.map(c => ({ok: c.ok, t: c.t}))
  };
}

/* =====================================================================
   Portale Foresta — modulo comune alle tre app (PAF Campo, Martellata Campo, DL Foresta)
   Pubblica sul server del portale (Cloudflare Worker + R2) il GeoPackage, la scheda di stato,
   le foto e i report; mostra l'elenco dei progetti pubblicati da tutte le app.
   Richiede, definiti dall'app: PT_APP ('paf'|'mc'|'dl'), PT_STORE (nome dello store dei lotti/piani),
   PT_FOTO_KEY (campo della foto che punta al lotto), portaleStato(l) (scheda di stato), portaleMain (vista principale).
