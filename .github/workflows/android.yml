name: App Android
# Crea l'app Android (APK) dal sito e la pubblica nelle Release:
# https://github.com/gennaroventura66-creator/paf-campo/releases/latest/download/PAF-Campo.apk
on:
  push:
    branches: [main]
    paths: ['index.html', 'PAF_rilievi.qgz', 'icon-512.png', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Progetto Capacitor
        run: |
          set -e
          mkdir app && cd app
          npm init -y > /dev/null
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 sql.js@1.10.3 leaflet@1.9.4 docx@8.5.0
          mkdir -p www/lib/sql.js@1.10.3/dist www/lib/leaflet@1.9.4/dist www/lib/docx@8.5.0/build
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png ../PAF_rilievi.qgz www/
          cp node_modules/sql.js/dist/sql-wasm.js node_modules/sql.js/dist/sql-wasm.wasm www/lib/sql.js@1.10.3/dist/
          cp -r node_modules/leaflet/dist/. www/lib/leaflet@1.9.4/dist/
          cp node_modules/docx/build/index.umd.js www/lib/docx@8.5.0/build/
          echo '{"appId":"it.pafcampo.app","appName":"PAF Campo","webDir":"www","backgroundColor":"#2f6b2a","plugins":{"CapacitorHttp":{"enabled":false}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Permessi, icone, versione
        run: |
          set -e
          cd app/android
          M=app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          grep -c ACCESS_FINE_LOCATION $M
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"0.3.${{ github.run_number }}\"/" app/build.gradle
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          src = Image.open('../../icon-512.png').convert('RGB')
          for f in glob.glob('app/src/main/res/mipmap-*/ic_launcher*.png'):
              w, h = Image.open(f).size
              src.resize((w, h), Image.LANCZOS).save(f)
          for f in glob.glob('app/src/main/res/drawable*/splash.png'):
              w, h = Image.open(f).size
              im = Image.new('RGB', (w, h), '#2f6b2a'); s = min(w, h) // 3
              im.paste(src.resize((s, s), Image.LANCZOS), ((w - s) // 2, (h - s) // 2)); im.save(f)
          PY
          rm -rf app/src/main/res/mipmap-anydpi-v26
      - name: Compila APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -e
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "::warning::Manca il secret ANDROID_KEYSTORE: APK firmato con una chiave provvisoria (gli aggiornamenti non si installeranno sopra)."; fi
          cd app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PAF-Campo.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PAF Campo per Android (build ${{ github.run_number }})
          body: |
            Apri questa pagina dal telefono Android, tocca PAF-Campo.apk e installa (consenti l'installazione dal browser quando richiesto).
            Gli aggiornamenti si installano sopra la versione precedente senza perdere i dati.
          files: PAF-Campo.apk
          make_latest: true
